<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Reel Camera</title>
<style>
:root{--pink:#ff2a6d;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}button{font:inherit;color:inherit;border:0;cursor:pointer}.app{height:100dvh;min-height:100%;display:flex;flex-direction:column;background:#000;overflow:hidden}.stage{position:relative;flex:1;min-height:0;border-radius:28px 28px 0 0;overflow:hidden;background:#171717}#cameraVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#171717;transform:scaleX(-1)}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0005,transparent 24%,transparent 70%,#0004)}.top{position:absolute;z-index:4;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center}.icon{width:42px;height:42px;background:transparent;display:grid;place-items:center}.icon svg{width:28px;height:28px;stroke:#fff}.pills{display:flex;justify-content:center;gap:8px}.pill{width:44px;height:36px;border-radius:22px;background:#373737c9;display:grid;place-items:center;color:#eee}.pill svg{width:19px;height:19px;stroke:currentColor}.pill.zoom{font-size:14px;font-weight:700}.audio{position:absolute;z-index:4;top:calc(max(10px,env(safe-area-inset-top)) + 52px);left:50%;transform:translateX(-50%);height:34px;padding:0 15px;border-radius:20px;background:#0009;font-size:14px;font-weight:600;white-space:nowrap}.tools{position:absolute;z-index:4;left:12px;top:50%;transform:translateY(-43%);display:flex;flex-direction:column;gap:12px}.tool{position:relative;width:38px;height:38px;border-radius:10px;background:#0009;display:grid;place-items:center}.tool svg{width:23px;height:23px;stroke:#fff}.tool.active{outline:1.5px solid #fff}.tool .num{position:absolute;font-size:12px;font-weight:800}.bottom{position:relative;flex:0 0 205px;height:205px;background:#000;padding-bottom:calc(10px + var(--safe))}.capture{position:absolute;top:-38px;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center}#recordBtn{width:76px;height:76px;flex:0 0 76px;border-radius:50%;background:#fff;border:4px solid #000;box-shadow:0 0 0 3px #fff;touch-action:pan-y;padding:0}#recordBtn.recording{background:var(--pink)}.lenses{position:absolute;left:calc(50% + 60px);top:50%;transform:translateY(-50%);display:flex;gap:10px;align-items:center}.lens{width:48px;height:48px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#27d6ff,#6656ff,#e13cff,#2ce5ed)}.lens span{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 25%,#71f5ff,#2864ee 48%,#271c88);border:2px solid #111}.avatarLens{width:48px;height:48px;border-radius:50%;background:#bcecff;border:2px solid #e9f9ff;display:grid;place-items:center}.avatarLens svg{width:28px;height:28px;stroke:#fff}.utility{position:absolute;top:56px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}.gallery{width:38px;height:38px;border:2px solid #fff;border-radius:8px;background:linear-gradient(135deg,#526e8c,#d1b6a3 52%,#344e4a);display:grid;place-items:center}.gallery svg{width:22px;height:22px;stroke:#fff}.flip{width:38px;height:38px;background:transparent;display:grid;place-items:center}.flip svg{width:27px;height:27px;stroke:#fff}.modes{position:absolute;top:104px;left:0;right:0;height:30px;display:flex;justify-content:center;align-items:center;gap:13px;white-space:nowrap;letter-spacing:2px;font-size:12px;font-weight:700}.mode{height:28px;background:transparent;color:#929292;letter-spacing:2px;padding:0 1px}.mode.selected{color:#fff;font-weight:900;position:relative}.mode.selected:after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:22px;height:2px;background:#fff;border-radius:2px}#filterBar{display:none;position:absolute;z-index:8;left:12px;right:12px;bottom:115px;height:78px;border-radius:22px;padding:10px;background:rgba(20,20,20,.95);gap:12px;align-items:center;overflow-x:scroll;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;scroll-snap-type:x mandatory;overscroll-behavior-x:contain}#filterBar::-webkit-scrollbar{display:none;width:0;height:0}#filterBar.visible{display:flex}.filter{flex:0 0 56px;width:56px;min-width:56px;height:58px;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;padding:0;scroll-snap-align:center;font-size:10px;font-weight:600}.swatch{width:44px;height:44px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px #ffffff1f inset;display:block}.filter.active .swatch{border:2px solid var(--pink);box-shadow:0 0 0 1px #fff inset}.filter.active .name{color:#ff75a0}.original{background:linear-gradient(135deg,#181818,#383838)}.warm{background:linear-gradient(135deg,#ffd16b,#f07824 60%,#8e3a18)}.cool{background:linear-gradient(135deg,#b5efff,#338cde 55%,#2d3c99)}.mono{background:linear-gradient(135deg,#fff,#777 55%,#222)}.vintage{background:linear-gradient(135deg,#e6c08b,#98613d 55%,#49301f)}.toast{position:absolute;z-index:10;left:50%;bottom:225px;transform:translateX(-50%);max-width:90%;padding:10px 14px;border-radius:18px;background:#232323f2;font-size:13px;text-align:center;display:none}.toast.show{display:block}#galleryInput{display:none}@media(max-height:650px){.bottom{flex-basis:190px;height:190px}.tools{gap:8px}.tool{width:35px;height:35px}#filterBar{bottom:105px}.modes{top:98px}.utility{top:50px}}
</style></head><body><div class="app"><section class="stage"><video id="cameraVideo" autoplay playsinline muted></video><div class="shade"></div>
<div class="top"><button class="icon" id="closeBtn" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button><div class="pills"><button class="pill" id="flashBtn" aria-label="Flash off"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M13 2 5 13h6l-1 9 9-12h-6l1-8Z"/><path d="m4 4 16 16"/></svg></button><button class="pill zoom" id="zoomBtn">1x</button><button class="pill" id="timerBtn" aria-label="Timer"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6M12 2v3"/></svg></button></div><button class="icon" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19 13.5 21 15l-2 4-2.5-1a8 8 0 0 1-2 1L14 21h-4l-.5-2a8 8 0 0 1-2-1L5 19l-2-4 2-1.5v-2L3 10l2-4 2.5 1a8 8 0 0 1 2-1L10 4h4l.5 2a8 8 0 0 1 2 1L19 6l2 4-2 1.5Z"/></svg></button></div>
<button class="audio" id="audioBtn">♫ Add audio</button><div class="tools"><button class="tool" id="musicBtn" aria-label="Music"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button><button class="tool" id="effectsBtn" aria-label="Effects" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="m8 2 1.6 5.4L15 9l-5.4 1.6L8 16l-1.6-5.4L1 9l5.4-1.6L8 2Z"/><path d="m18 12 1.2 3.8L23 17l-3.8 1.2L18 22l-1.2-3.8L13 17l3.8-1.2L18 12Z"/></svg></button><button class="tool" id="avatarBtn" aria-label="Avatar"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="9" r="3"/><path d="M6.5 19c.8-3 2.7-4.5 5.5-4.5s4.7 1.5 5.5 4.5"/></svg></button><button class="tool" id="drawBtn" aria-label="Draw"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z"/><path d="m13.5 7.5 3 3M18.5 14l.7 2.3 2.3.7-2.3.7-.7 2.3-.7-2.3-2.3-.7 2.3-.7.7-2.3Z"/></svg></button><button class="tool" id="durationBtn" aria-label="15 seconds"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-dasharray="2.2 2.2"><circle cx="12" cy="12" r="9"/></svg><span class="num">15</span></button></div>
<div id="filterBar"><button class="filter active" data-filter="original"><span class="swatch original"></span><span class="name">Original</span></button><button class="filter" data-filter="warm"><span class="swatch warm"></span><span class="name">Warm</span></button><button class="filter" data-filter="cool"><span class="swatch cool"></span><span class="name">Cool</span></button><button class="filter" data-filter="mono"><span class="swatch mono"></span><span class="name">Mono</span></button><button class="filter" data-filter="vintage"><span class="swatch vintage"></span><span class="name">Vintage</span></button></div></section>
<section class="bottom"><div class="capture"><button id="recordBtn" aria-label="Record"></button><div class="lenses"><button class="lens" id="lensBtn" aria-label="Lens"><span></span></button><button class="avatarLens" id="avatarLensBtn" aria-label="Avatar lens"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 3.5-6.5 8-6.5s7.2 2.3 8 6.5"/></svg></button></div></div><div class="utility"><button class="gallery" id="galleryBtn" aria-label="Gallery"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8" r="1.5"/><path d="m4 17 5-5 3 3 3-4 5 6"/></svg></button><button class="flip" id="flipBtn" aria-label="Flip camera"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M7 7h11l-2.5-2.5M17 17H6l2.5 2.5M18 7a7 7 0 0 1 2 5M6 17a7 7 0 0 1-2-5"/></svg></button></div><div class="modes"><button class="mode" data-mode="STORY">STORY</button><button class="mode selected" data-mode="REEL">REEL</button><button class="mode" data-mode="LIVE">LIVE</button></div></section><div class="toast" id="toast"></div><input id="galleryInput" type="file" accept="image/*,video/*"></div>
<script>
(()=>{const $=id=>document.getElementById(id),video=$('cameraVideo'),bar=$('filterBar'),record=$('recordBtn'),effects=$('effectsBtn'),toast=$('toast');let stream=null,facing='user',selected='original',startX=null,lastSwipe=0,recorder=null,chunks=[],recording=false,track=null;const filters={original:'none',warm:'sepia(0.4) saturate(1.3)',cool:'hue-rotate(180deg) saturate(0.8)',mono:'grayscale(1)',vintage:'sepia(0.8) contrast(0.9)'};function say(s){toast.textContent=s;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),2100)}function parentSend(type,extra={}){if(window.parent!==window)window.parent.postMessage({source:'instapro-fresh-reel',type,...extra},location.origin)}async function start(){if(!navigator.mediaDevices?.getUserMedia){say('Camera needs HTTPS and permission.');return}try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});video.srcObject=stream;track=stream.getVideoTracks()[0]||null;video.style.transform=facing==='user'?'scaleX(-1)':'scaleX(1)';await video.play().catch(()=>{})}catch(e){console.error(e);say('Allow camera permission to use Reel camera.')}}function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null}function select(name){if(!(name in filters))return;selected=name;video.style.filter=filters[name];document.querySelectorAll('.filter').forEach(b=>{let yes=b.dataset.filter===name;b.classList.toggle('active',yes);b.setAttribute('aria-pressed',String(yes))})}function showFilters(force){let yes=typeof force==='boolean'?force:!bar.classList.contains('visible');bar.classList.toggle('visible',yes);effects.classList.toggle('active',yes);effects.setAttribute('aria-expanded',String(yes));if(yes)bar.querySelector('[data-filter="'+selected+'"]')?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}effects.onclick=()=>showFilters();document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>select(b.dataset.filter));record.addEventListener('touchstart',e=>{startX=e.touches[0]?.clientX??null},{passive:true});record.addEventListener('touchmove',e=>{if(startX===null||!e.touches.length)return;let dx=e.touches[0].clientX-startX;if(Math.abs(dx)>40){showFilters(true);bar.scrollBy({left:dx<0?90:-90,behavior:'smooth'});let opts=[...bar.querySelectorAll('.filter')],i=opts.findIndex(b=>b.dataset.filter===selected),j=Math.max(0,Math.min(opts.length-1,i+(dx<0?1:-1)));select(opts[j].dataset.filter);opts[j].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});startX=e.touches[0].clientX;lastSwipe=Date.now()}},{passive:true});record.addEventListener('touchend',()=>startX=null,{passive:true});record.addEventListener('touchcancel',()=>startX=null,{passive:true});function mode(m){document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('selected',b.dataset.mode===m));if(m!=='REEL')parentSend('mode',{mode:m})}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>mode(b.dataset.mode));record.onclick=()=>{if(Date.now()-lastSwipe<500)return;if(recording){if(recorder?.state!=='inactive')recorder.stop();recording=false;record.classList.remove('recording');return}if(!stream||!window.MediaRecorder){say('Camera is not ready or recording is unavailable.');return}try{chunks=[];let type=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};recorder.onstop=()=>{record.classList.remove('recording');recording=false;if(!chunks.length)return;let blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});if(window.parent!==window)parentSend('recorded',{blob,mimeType:blob.type});else{let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='reel-'+Date.now()+'.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);say('Video saved to downloads.')}};recorder.start();recording=true;record.classList.add('recording');say('Recording… tap again to stop.')}catch(e){console.error(e);say('Could not start recording.')}};$('flipBtn').onclick=()=>{facing=facing==='user'?'environment':'user';start()};$('closeBtn').onclick=()=>{stop();parentSend('close');if(window.parent===window)say('Camera closed.')};$('galleryBtn').onclick=()=>$('galleryInput').click();$('galleryInput').onchange=e=>{let f=e.target.files?.[0];if(f){if(window.parent!==window)parentSend('selected-file',{name:f.name});else say('Selected: '+f.name)}};$('flashBtn').onclick=async()=>{if(!track?.getCapabilities?.().torch){say('Flash is not available on this camera.');return}try{let on=$('flashBtn').dataset.on!=='1';await track.applyConstraints({advanced:[{torch:on}]});$('flashBtn').dataset.on=on?'1':'0';say(on?'Flash on':'Flash off')}catch(_){say('Could not change flash.')}};$('zoomBtn').onclick=()=>say('Zoom control depends on camera support.');$('timerBtn').onclick=() =>say('Timer off');$('settingsBtn').onclick=()=>say('Camera settings');$('audioBtn').onclick=()=>say('Audio picker can be connected here.');$('musicBtn').onclick=()=>say('Music picker can be connected here.');$('avatarBtn').onclick=()=>say('Avatar tool selected.');$('drawBtn').onclick=()=>say('Draw tool selected.');$('durationBtn').onclick=()=>say('Duration: 15 seconds');$('lensBtn').onclick=()=>showFilters();$('avatarLensBtn').onclick=()=>say('Avatar lens selected.');window.addEventListener('pagehide',stop);window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.source==='instapro-camera-host'&&e.data.type==='shutdown')stop()});start()})();
</script></body></html>
