<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUBE - Home</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* === FULL TRANSPARENT GLASS THEME === */
body{
  background: radial-gradient(circle at 20% 20%, #2a1f45 0%, #120b20 40%, #0a0612 100%) fixed !important;
  color:#fff;font-family:'Poppins',sans-serif;margin:0;padding:0 0 90px;
  min-height:100vh;
}
.header{
  padding:16px 20px;display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:10;
  background: rgba(18, 11, 32, 0.45) !important;
  backdrop-filter: blur(20px) saturate(140%) !important;
  -webkit-backdrop-filter: blur(20px) saturate(140%) !important;
  border-bottom:1px solid rgba(255,255,255,0.1) !important;
}
.logo{font-weight:700;font-size:20px;letter-spacing:-0.5px}
.logo span{background:linear-gradient(135deg,#c084fc,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#videos{display:grid;grid-template-columns:1fr;gap:14px;padding:14px;max-width:600px;margin:0 auto}
@media(min-width:700px){#videos{grid-template-columns:1fr 1fr}}
.card{
  background: rgba(30, 20, 48, 0.42) !important;
  backdrop-filter: blur(18px) saturate(130%) !important;
  -webkit-backdrop-filter: blur(18px) saturate(130%) !important;
  border:1px solid rgba(255,255,255,0.13) !important;
  border-radius:20px;overflow:hidden;transition:0.25s;
  box-shadow: 0 12px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08) !important;
}
.card:hover{transform:translateY(-3px);border-color:rgba(192,132,252,0.4) !important; box-shadow:0 16px 40px rgba(0,0,0,0.5) !important}
.card img, .card video{width:100%;height:190px;object-fit:cover;background:rgba(0,0,0,0.3);display:block}
.card-body{padding:12px;background: rgba(0,0,0,0.15)}
.card h3{margin:0;font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{margin:4px 0 0;color:#b8b0cc;font-size:12px}
.watch-btn{display:inline-block;margin-top:10px;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);color:#fff;text-decoration:none;padding:6px 14px;border-radius:999px;font-size:12px;border:1px solid rgba(255,255,255,0.15)}
.loading{text-align:center;color:#9c92b5;margin-top:80px}
.bottom-nav { 
  position: fixed; bottom: 0; left: 0; width: 100%; 
  background: rgba(18, 11, 32, 0.55) !important; 
  backdrop-filter:blur(24px) saturate(150%) !important;
  -webkit-backdrop-filter:blur(24px) saturate(150%) !important;
  display: flex; justify-content: space-around; align-items: center; 
  height: 70px; border-top: 1px solid rgba(255,255,255,0.12) !important; z-index:99; 
}
.nav-item { text-align: center; color: #9c92b5; text-decoration: none; font-size: 11px; display:flex; flex-direction:column; }
.nav-item.active { color: #fff; text-shadow:0 0 10px rgba(255,255,255,0.5)}
.fab-btn { width: 52px; height: 52px; background: linear-gradient(135deg, rgba(192,132,252,0.9), rgba(129,140,248,0.9)) !important; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; margin-top: -18px; text-decoration: none; border:1px solid rgba(255,255,255,0.25); box-shadow:0 8px 20px rgba(192,132,252,0.5) !important}
</style>
</head>
<body>

<div class="header"><div class="logo">IN<span>TUBE</span></div><div style="font-size:13px;color:#b8b0cc">Lite • Glass</div></div>

<div id="videos"><div class="loading">Loading videos... ⏳</div></div>

<nav class="bottom-nav">
<a href="index.html" class="nav-item active">🏠 Home</a>
<a href="feed.html" class="nav-item">🎞️ Feed</a>
<a href="upload.html" class="fab-btn">+</a>
<a href="explore.html" class="nav-item">📺 Explore</a>
<a href="login.html" class="nav-item">👤 Profile</a>
</nav>

<script type="module">
import { db } from "./firebase-config.js";
import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

async function loadVideos(){
 const container = document.getElementById("videos");
 try{
   const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
   const snap = await getDocs(q);
   if(snap.empty){
     const q2 = query(collection(db, "posts"), orderBy("createdAt", "desc"));
     const snap2 = await getDocs(q2);
     if(snap2.empty){
       container.innerHTML = `<div class="loading">No videos yet.<br>Upload se pehla video daal 🔥</div>`;
       return;
     }
     render(snap2, container); return;
   }
   render(snap, container);
 }catch(e){
   container.innerHTML = `<div class="loading">Error: ${e.message}</div>`;
 }
}
function render(snap, container){
 container.innerHTML = "";
 snap.forEach(docSnap=>{
   const v = docSnap.data();
   const media = v.mediaUrl || v.videoUrl || 'https://picsum.photos/600/400';
   const isVideo = media.includes('.mp4') || media.includes('video');
   container.innerHTML += `
   <div class="card">
     ${isVideo ? `<video src="${media}" muted></video>` : `<img src="${media}" loading="lazy">`}
     <div class="card-body">
       <h3>${v.title || v.caption || 'Untitled'}</h3>
       <p>by ${v.author || v.userName || 'Guest'} • ${v.views || 0} views</p>
       <a class="watch-btn" href="watch.html?id=${docSnap.id}">▶ Watch</a>
     </div>
   </div>`;
 });
}
loadVideos();
</script>
</body>
</html>
