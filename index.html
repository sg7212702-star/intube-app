<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>INTUBE - Transparent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#000;color:#fff;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(800px at 10% 10%, rgba(255,77,166,.30), transparent), radial-gradient(600px at 90% 90%, rgba(120,80,255,.25), transparent), #06060a}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
.logo{font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#ff4da6,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#search{flex:1;max-width:220px;padding:9px 14px;border-radius:20px;outline:none;color:#fff}
.feed{max-width:480px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:16px;padding-bottom:90px}
.reel{position:relative;border-radius:20px;min-height:580px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.reel video,.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.reelData{position:relative;z-index:2;padding:14px;background:linear-gradient(transparent, rgba(0,0,0,.85));width:100%}
.actions{position:absolute;right:8px;bottom:90px;z-index:3;display:flex;flex-direction:column;gap:10px}
.actionBtn{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.bottomBar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:10px;padding:10px 16px;border-radius:30px}
.bBtn{padding:10px 18px;border-radius:20px;border:none;font-weight:700;cursor:pointer;color:#fff}
#uploadModal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.6);backdrop-filter:blur(10px)}
.modalBox{width:100%;max-width:400px;padding:18px;border-radius:20px;display:flex;flex-direction:column;gap:12px}
.inp{padding:12px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;outline:none}

/* === PURA UI TRANSPARENT PINK GLASS - FINAL === */
body, #bg,.feed, #feed,.reel,.top,.modal, #uploadModal{
background:transparent!important
}
.glass,.reel,.top,.modalBox,.actionBtn,.bottomBar, #search,.bBtn{
background:linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,105,180,.16), rgba(255,255,255,.06))!important;
backdrop-filter:blur(28px) saturate(200%)!important;
-webkit-backdrop-filter:blur(28px) saturate(200%)!important;
border:1px solid rgba(255,182,193,.42)!important;
box-shadow:0 8px 32px rgba(0,0,0,.35), 0 0 18px rgba(255,105,180,.35), inset 0 1px 0 rgba(255,255,255,.2)!important;
}
.bBtn.primary{background:linear-gradient(90deg,#ff4da6,#ff8ac6)!important;border:none!important}
</style>
</head>
<body>
<div id="bg"></div>

<div id="loginScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:20px">
<h1 style="font-size:42px;font-weight:900">INTUBE 💎</h1>
<p style="opacity:.7">Transparent Reels</p>
<button id="loginBtn" class="bBtn primary" style="padding:14px 28px;border-radius:30px;font-size:16px">Login with Google</button>
</div>

<div class="top glass" id="mainTop" style="display:none">
<div class="logo">INTUBE</div>
<input id="search" class="glass" placeholder="Search reels...">
<button id="logoutBtn" class="actionBtn glass" style="width:36px;height:36px">🚪</button>
</div>

<div id="feed" class="feed" style="display:none"></div>

<div class="bottomBar glass" id="bottomBar" style="display:none">
<button class="bBtn glass">🏠 Home</button>
<button id="openUpload" class="bBtn primary">+ Upload</button>
</div>

<div id="uploadModal">
<div class="modalBox glass">
<h3>Upload New Reel</h3>
<input type="file" id="fileIn" accept="video/*,image/*" class="inp">
<input type="text" id="capIn" placeholder="Caption likho..." class="inp">
<button id="postBtn" class="bBtn primary" style="width:100%">Post Now</button>
<button id="closeUpload" class="bBtn glass" style="width:100%">Cancel</button>
<div id="upProgress" style="font-size:12px;opacity:.7;text-align:center"></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// === APNA REAL CONFIG YAHA DALO ===
const firebaseConfig = {
  apiKey: "AIzaSyBpL6o6O1O1O1O1O1O1O1O1O", // <-- Yaha apna apiKey
  authDomain: "intube-free.firebaseapp.com",
  projectId: "intube-free",
  storageBucket: "intube-free.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};
// Firebase Console > Project Settings se copy karke yaha paste karo

const CLOUD_NAME="buyq0obz";
const UPLOAD_PRESET="intube_free";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let allReels=[];

const loginScreen=document.getElementById('loginScreen');
const mainTop=document.getElementById('mainTop');
const feed=document.getElementById('feed');
const bottomBar=document.getElementById('bottomBar');

document.getElementById('loginBtn').onclick=async()=>{
  const provider=new GoogleAuthProvider();
  try{ await signInWithPopup(auth,provider); }catch(e){ alert(e.message); }
};
document.getElementById('logoutBtn').onclick=()=>signOut(auth);

onAuthStateChanged(auth,(u)=>{
  currentUser=u;
  if(u){
    loginScreen.style.display='none';
    mainTop.style.display='flex';
    feed.style.display='flex';
    bottomBar.style.display='flex';
    startFeed();
  }else{
    loginScreen.style.display='flex';
    mainTop.style.display='none';
    feed.style.display='none';
    bottomBar.style.display='none';
  }
});

function startFeed(){
  const q=query(collection(db,"reels"),orderBy("time","desc"));
  onSnapshot(q,(snap)=>{
    allReels=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  });
}

function render(){
  const s=document.getElementById('search').value.toLowerCase();
  let list=allReels;
  if(s) list=list.filter(r=>(r.caption||"").toLowerCase().includes(s) || (r.userName||"").toLowerCase().includes(s));
  feed.innerHTML="";
  if(list.length==0){ feed.innerHTML="<p style='text-align:center;opacity:.5;padding:40px'>Koi reel nahi hai, pehla upload karo!</p>"; return; }
  list.forEach(r=>{
    const isVideo=r.type==="video" || r.url.includes(".mp4") || r.url.includes("video");
    feed.innerHTML+=`
      <div class="reel glass">
        ${isVideo?`<video src="${r.url}" loop muted playsinline autoplay onclick="this.paused?this.play():this.pause()" style="cursor:pointer"></video>`:`<img src="${r.url}">`}
        <div class="actions">
          <div class="actionBtn glass">❤️<br><span style="font-size:10px">${r.likes||0}</span></div>
          <div class="actionBtn glass">💬</div>
          <div class="actionBtn glass">↗️</div>
        </div>
        <div class="reelData">
          <b>@${r.userName||'user'}</b>
          <p style="opacity:.9;margin-top:4px">${r.caption||''}</p>
        </div>
      </div>
    `;
  });
}
document.getElementById('search').oninput=render;

// Upload Logic - Cloudinary
document.getElementById('openUpload').onclick=()=>document.getElementById('uploadModal').style.display='flex';
document.getElementById('closeUpload').onclick=()=>document.getElementById('uploadModal').style.display='none';

document.getElementById('postBtn').onclick=async()=>{
  const file=document.getElementById('fileIn').files[0];
  const caption=document.getElementById('capIn').value;
  const progress=document.getElementById('upProgress');
  if(!file) return alert("Pehle video/photo select karo");
  if(!currentUser) return alert("Pehle login karo");

  try{
    document.getElementById('postBtn').innerText="Uploading...";
    progress.innerText="Cloudinary pe upload ho raha hai...";

    const fd=new FormData();
    fd.append("file",file);
    fd.append("upload_preset",UPLOAD_PRESET);

    const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,{method:"POST",body:fd});
    const data=await res.json();
    if(!data.secure_url) throw new Error(JSON.stringify(data));

    progress.innerText="Database me save ho raha hai...";
    await addDoc(collection(db,"reels"),{
      url:data.secure_url,
      caption:caption,
      type:file.type.startsWith("video")?"video":"image",
      userName:currentUser.displayName,
      userId:currentUser.uid,
      likes:0,
      time:serverTimestamp()
    });

    alert("Upload ho gaya! ✅");
    document.getElementById('uploadModal').style.display='none';
    document.getElementById('fileIn').value="";
    document.getElementById('capIn').value="";
    progress.innerText="";
  }catch(e){
    console.error(e);
    alert("Upload fail: "+e.message);
    progress.innerText="Fail: "+e.message;
  }
  document.getElementById('postBtn').innerText="Post Now";
};
</script>
</body>
</html>
