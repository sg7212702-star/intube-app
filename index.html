<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUBE</title>
<link rel="stylesheet" href="assets/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0a0712;
color:white;
padding-bottom:120px;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
width:400px;
height:400px;
background:#ff4fd8;
filter:blur(180px);
top:-100px;
left:-100px;
opacity:.35;
z-index:-1;
}

body::after{
content:"";
position:fixed;
width:400px;
height:400px;
background:#7f5cff;
filter:blur(180px);
right:-100px;
bottom:-100px;
opacity:.35;
z-index:-1;
}

.glass{
background:rgba(255,255,255,.08);
backdrop-filter:blur(35px);
-webkit-backdrop-filter:blur(35px);
border:1px solid rgba(255,255,255,.15);
box-shadow:
0 8px 40px rgba(255,105,180,.18),
inset 0 1px 1px rgba(255,255,255,.18);
}

.header{
margin:15px;
padding:16px 20px;
border-radius:28px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:700;
background:linear-gradient(45deg,#ff4fd8,#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.profile{
width:45px;
height:45px;
border-radius:15px;
background:linear-gradient(45deg,#ff4fd8,#7f5cff);
}

.hero{
margin:15px;
padding:18px;
border-radius:30px;
}

.hero img{
width:100%;
height:220px;
object-fit:cover;
border-radius:22px;
}

.hero h1{
margin-top:15px;
font-size:28px;
}

.hero p{
opacity:.8;
margin-top:8px;
}

.watch-btn{
margin-top:15px;
width:100%;
padding:14px;
border:none;
border-radius:18px;
background:linear-gradient(45deg,#ff4fd8,#7f5cff);
color:white;
font-weight:600;
}

.categories{
display:flex;
gap:10px;
overflow:auto;
padding:0 15px;
}

.categories button{
padding:10px 18px;
border:none;
border-radius:20px;
color:white;
background:rgba(255,255,255,.08);
}

.section{
padding:20px 15px;
}

.section h2{
margin-bottom:15px;
}

.cards{
display:flex;
gap:15px;
overflow:auto;
}

.card{
min-width:260px;
border-radius:25px;
overflow:hidden;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

.card-content{
padding:12px;
}

.card-content h3{
font-size:16px;
}

.card-content p{
opacity:.7;
font-size:13px;
}

.bottom-nav{
position:fixed;
bottom:15px;
left:15px;
right:15px;
height:88px;
border-radius:32px;
display:flex;
justify-content:space-around;
align-items:center;
}

.item{
text-align:center;
font-size:12px;
}

.item span{
display:block;
font-size:22px;
margin-bottom:4px;
}

.create{
width:68px;
height:68px;
border-radius:22px;
background:linear-gradient(45deg,#ff4fd8,#7f5cff);
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
box-shadow:0 0 35px rgba(255,79,216,.5);
}
</style>
</head>

<body>

<div class="header glass">
<div class="logo">INTUBE</div>
<div class="profile"></div>
</div>

<div class="hero glass">
<img src="https://picsum.photos/900/500?random=1">
<h1>Discover Amazing Videos</h1>
<p>Premium Glass Video Platform Experience</p>
<button class="watch-btn">Start Watching</button>
</div>

<div class="categories">
<button>All</button>
<button>Gaming</button>
<button>Music</button>
<button>Live</button>
<button>Movies</button>
<button>Tech</button>
</div>

<div class="section">
<h2>🔥 Trending</h2>

<div class="cards">

<div class="card glass">
<img src="https://picsum.photos/400/250?1">
<div class="card-content">
<h3>Luxury Travel Vlog</h3>
<p>1.2M Views</p>
</div>
</div>

<div class="card glass">
<img src="https://picsum.photos/400/250?2">
<div class="card-content">
<h3>Gaming Highlights</h3>
<p>850K Views</p>
</div>
</div>

<div class="card glass">
<img src="https://picsum.photos/400/250?3">
<div class="card-content">
<h3>Tech Review</h3>
<p>620K Views</p>
</div>
</div>

</div>
</div>

<div class="section">
<h2>⚡ Shorts</h2>

<div class="cards">

<div class="card glass">
<img src="https://picsum.photos/250/400?4">
</div>

<div class="card glass">
<img src="https://picsum.photos/250/400?5">
</div>

<div class="card glass">
<img src="https://picsum.photos/250/400?6">
</div>

</div>
</div>

<div class="bottom-nav glass">

<div class="item">
<span>🏠</span>
Home
</div>

<div class="item">
<span>🎬</span>
Shorts
</div>

<div class="create">+</div>

<div class="item">
<span>📺</span>
Subs
</div>

<div class="item">
<span>👤</span>
Profile
</div>

</div>
<script src="assets/js/app.js"></script>
</body>
</html>
