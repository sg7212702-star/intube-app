<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INTUBE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="glass loginCard">
    <h1>INTUBE 💎</h1>
    <p>Realtime Social Platform</p>
    <button id="googleLoginBtn">Continue With Google</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="topBar glass">
    <div class="logo">INTUBE</div>
    <div class="topBtns">
      <button id="searchBtn">🔍</button>
      <button id="chatBtn">💌</button>
      <button id="notificationBtn">♥️</button>
    </div>
  </header>

<!-- STORIES - INSTAGRAM FIX -->
<section id="stories" style="display:flex;gap:14px;padding:12px;overflow-x:auto;background:#000;">
  <div id="myStoryItem" class="story" style="min-width:72px;display:flex;flex-direction:column;align-items:center;cursor:pointer;">
    <div id="myStoryRing" class="storyRing ring-none" style="position:relative;width:66px;height:66px;">
      <img id="myStoryImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #000;">
      <div id="plusIcon" style="position:absolute;bottom:0;right:0;width:20px;height:20px;border-radius:50%;background:#0095f6;border:2px solid #000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:bold;">+</div>
    </div>
    <small id="myStoryText" style="color:#fff;font-size:11px;margin-top:5px;">Add Story</small>
  </div>
  <div id="storiesList" style="display:flex;gap:14px;"></div>
</section>

  <!-- FEED -->
  <main id="feed"></main>

  <!-- BOTTOM NAV -->
  <nav class="bottomNav glass">
    <button class="active" id="homeBtn">💝<span>Home</span></button>
    <button id="exploreBtn">🔍<span>Explore</span></button>
    <button id="postBtn">➕<span>Post</span></button>
    <button id="reelsBtn">🎬<span>Reels</span></button>
    <button id="profileBtn">👤<span>Profile</span></button>
  </nav>
</div>

<!-- POST UPLOAD MODAL -->
<div id="uploadModal" hidden>
  <div class="glass uploadCard">
    <h3>Create Post</h3>
    <input type="text" id="caption" placeholder="Write caption...">
    <input type="file" id="mediaFile" accept="image/jpeg,image/png,image/jpg,image/webp,video/mp4,video/quicktime,video/webm">
    <button id="uploadBtn">Upload</button>
    <button id="closeUploadModal">Cancel</button>
  </div>
</div>

<!-- STORY UPLOAD MODAL -->
<div id="storyModal" hidden>
  <div class="glass uploadCard">
    <h3>Add Story</h3>
    <p id="storyFileName">No file selected</p>
    <button id="uploadStoryBtn">Upload Story</button>
    <button id="closeStoryModal">Cancel</button>
  </div>
</div>

<!-- STORY VIEWER -->
<div id="storyViewer" hidden>
  <div id="storyProgress"></div>
  <div id="storyHeader">
    <img id="viewerUserPhoto" style="width:40px;height:40px;border-radius:50%">
    <div>
      <b id="viewerUser"></b>
      <small id="storyTime"></small>
    </div>
    <button id="closeViewer">X</button>
  </div>
  <img id="storyImg" hidden>
  <video id="storyVideo" hidden controls playsinline></video>
  <button id="prevStory">Prev</button>
  <button id="nextStory">Next</button>
</div>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="feed.js"></script>
<script type="module" src="stories.js"></script>
<script type="module" src="story_seen.js"></script>
<script type="module" src="upload.js"></script>
<script type="module" src="profile.js"></script>
<script type="module" src="notifications.js"></script>
<script type="module" src="chat.js"></script>
<script type="module" src="reels.js"></script>
<script type="module" src="explore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

<script>
function comingSoon(e){
e.preventDefault();
alert('Coming Soon - Stay Tuned!');
}
document.getElementById('closeUploadModal')?.addEventListener('click', ()=> document.getElementById('uploadModal').hidden=true);
document.getElementById('closeStoryModal')?.addEventListener('click', ()=> document.getElementById('storyModal').hidden=true);
</script>
</body>
</html>
