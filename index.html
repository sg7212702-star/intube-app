<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InstaPro 👑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(120% 120% at 0% 0%, #0f172a 0%, #020617 50%, #000000 100%);color:#fff;font-family:system-ui,sans-serif;overflow-x:hidden;padding-bottom:90px}
.top{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(180deg, rgba(15,23,42,0.9) 0%, rgba(2,6,23,0.8) 100%);backdrop-filter:blur(30px);border-bottom:1px solid rgba(56,189,248,0.15)}
.logo{font-weight:900;font-size:26px;background:linear-gradient(90deg,#38bdf8,#818cf8,#c084fc,#e879f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.glassBtn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(56,189,248,0.2);background:rgba(56,189,248,0.15);color:#e0f2fe;display:flex;align-items:center;justify-content:center}
#storyBar{display:flex;gap:16px;padding:14px 12px;overflow-x:auto;scrollbar-width:none;background:rgba(2,6,23,0.6);border-bottom:1px solid rgba(56,189,248,0.08)}
#storyBar::-webkit-scrollbar{display:none}
.sItem{flex:0 0 68px;min-width:68px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.sRing{width:68px;height:68px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#38bdf8,#818cf8,#c084fc,#f472b6);display:flex;align-items:center;justify-content:center}
.sRing img{width:100%;height:100%;border-radius:50%;border:3px solid #020617;object-fit:cover;background:#0f172a}
.sName{font-size:11px;color:#bae6fd}
.view{display:none;min-height:60vh}.view.active{display:block !important}
.postCard{margin:16px;background:linear-gradient(135deg, rgba(15,23,42,0.8), rgba(30,41,59,0.6));backdrop-filter:blur(24px);border:1px solid rgba(56,189,248,0.12);border-radius:20px;overflow:hidden}
.postHead{padding:12px 16px;display:flex;gap:10px;align-items:center}
.postHead img{width:34px;height:34px;border-radius:50%}
.postMedia{width:100%;display:block;max-height:75vh;object-fit:cover;background:#111}
.postActions{display:flex;gap:18px;padding:12px 16px;font-size:22px}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:70;display:flex;justify-content:space-around;padding:10px 0 14px;background:linear-gradient(180deg, rgba(2,6,23,0.85) 0%, rgba(15,23,42,0.95) 100%);backdrop-filter:blur(40px);border-top:1px solid rgba(56,189,248,0.12)}
.bottom button{width:48px;height:48px;border-radius:14px;border:none;background:transparent;color:#64748b;font-size:24px;display:flex;align-items:center;justify-content:center;transition:0.2s}
.bottom button.active{background:linear-gradient(135deg, rgba(56,189,248,0.2), rgba(129,140,248,0.15));color:#e0f2fe;border:1px solid rgba(56,189,248,0.25);transform:translateY(-2px)}
#overlay{position:fixed;inset:0;background:rgba(2,6,23,0.6);backdrop-filter:blur(16px);z-index:90;display:none}
#overlay.show{display:block}
#createSheet{position:fixed;left:12px;right:12px;bottom:90px;background:linear-gradient(180deg, rgba(15,23,42,0.9), rgba(2,6,23,0.95));border:1px solid rgba(56,189,248,0.15);border-radius:22px;padding:8px;display:none;z-index:95}
#createSheet.show{display:block}
.sheetItem{padding:18px;border-radius:14px;margin:6px;background:rgba(56,189,248,0.08);color:#e0f2fe;text-align:center;font-weight:600;cursor:pointer}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid3 img{width:100%;aspect-ratio:1;object-fit:cover}
</style></head>
<body>
<div class="top"><button class="glassBtn" id="addTopBtn">+</button><div class="logo">InstaPro 👑</div><button class="glassBtn">♡</button></div>
<div id="storyBar"></div>
<div id="homeView" class="view active"><div id="feed"></div></div>
<div id="searchView" class="view"><div style="margin:12px;padding:12px;background:rgba(15,23,42,0.7);border-radius:16px;border:1px solid rgba(56,189,248,0.1);display:flex;gap:8px">🔍<input id="searchInput" placeholder="Search..." style="background:transparent;border:none;outline:none;color:#fff;width:100%"></div><div id="searchResult" class="grid3"></div></div>
<div id="reelsView" class="view"><div style="padding:40px;text-align:center;opacity:0.5">Reels - Premium Blue Coming</div></div>
<div id="profileView" class="view"><div style="padding:20px;display:flex;gap:16px"><div class="sRing" style="width:86px;height:86px"><img src="https://i.pravatar.cc/150?img=12"></div><div style="flex:1;display:flex;justify-content:space-around;text-align:center"><div><b id="postCount">0</b><br>Posts</div><div><b>1.2K</b><br>Followers</div><div><b>340</b><br>Following</div></div></div><div class="grid3" id="profileGrid"></div></div>
<nav class="bottom"><button id="homeBtn" data-view="homeView" class="active">⌂</button><button id="reelsBtn" data-view="reelsView">▶</button><button id="addBtn">＋</button><button id="searchBtn" data-view="searchView">⌕</button><button id="profileBtn" data-view="profileView">◯</button></nav>
<div id="overlay"></div><div id="createSheet"><div class="sheetItem" onclick="alert('New Post')">📷 New Post</div><div class="sheetItem" onclick="alert('New Story')">⭕ New Story</div><div class="sheetItem" id="closeSheet" style="background:rgba(255,80,80,.15)">Cancel</div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
let posts=[{id:1,user:'ananya',avatar:'https://i.pravatar.cc/150?img=1',img:'https://picsum.photos/seed/insta1/600/800',likes:342,liked:false},{id:2,user:'rohit_k',avatar:'https://i.pravatar.cc/150?img=8',img:'https://picsum.photos/seed/insta2/600/800',likes:1205,liked:false},{id:3,user:'priya',avatar:'https://i.pravatar.cc/150?img=5',img:'https://picsum.photos/seed/insta3/600/800',likes:89,liked:false}];
let stories=[{user:'Your story',avatar:'https://i.pravatar.cc/150?img=12'},{user:'ananya',avatar:'https://i.pravatar.cc/150?img=1'},{user:'rohit_k',avatar:'https://i.pravatar.cc/150?img=8'},{user:'priya',avatar:'https://i.pravatar.cc/150?img=5'}];
function showView(id){$$('.view').forEach(v=>v.classList.remove('active'));$('#'+id).classList.add('active');$$('.bottom button').forEach(b=>b.classList.remove('active'));const ab=$(`[data-view="${id}"]`);if(ab)ab.classList.add('active')}
function render(){const f=$('#feed');if(f)f.innerHTML=posts.map(p=>`<div class="postCard"><div class="postHead"><img src="${p.avatar}"><b>${p.user}</b></div><img class="postMedia" src="${p.img}"><div class="postActions"><span class="likeBtn" data-id="${p.id}" style="cursor:pointer">${p.liked?'❤️':'🤍'}</span><span>💬</span><span>✈️</span></div><div style="padding:0 16px 16px"><b>${p.likes} likes</b> • ${p.user}</div></div>`).join('');const sb=$('#storyBar');if(sb)sb.innerHTML=stories.map(s=>`<div class="sItem"><div class="sRing"><img src="${s.avatar}"></div><span class="sName">${s.user}</span></div>`).join('');const pg=$('#profileGrid');if(pg)pg.innerHTML=posts.map(p=>`<img src="${p.img}">`).join('');const pc=$('#postCount');if(pc)pc.textContent=posts.length}
document.addEventListener('DOMContentLoaded',()=>{render();$$('.bottom button[data-view]').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));const open=()=>{$('#createSheet').classList.add('show');$('#overlay').classList.add('show')};const close=()=>{$('#createSheet').classList.remove('show');$('#overlay').classList.remove('show')};$('#addBtn').addEventListener('click',open);$('#addTopBtn').addEventListener('click',open);$('#overlay').addEventListener('click',close);$('#closeSheet').addEventListener('click',close);document.addEventListener('click',e=>{const l=e.target.closest('.likeBtn');if(l){const p=posts.find(x=>x.id==l.dataset.id);if(p){p.liked=!p.liked;p.likes+=p.liked?1:-1;render()}}});showView('homeView')});
</script>
</body></html>
