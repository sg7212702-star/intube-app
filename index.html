<script type="module">

import {
db,
collection,
getDocs
}
from "./firebase-config.js";

async function loadVideos(){

const container =
document.getElementById("videos");

const snap =
await getDocs(
collection(db,"videos")
);

container.innerHTML="";

snap.forEach(doc=>{

const v=doc.data();

container.innerHTML+=`

<div class="card">

<h3>${v.title}</h3>

<p>${v.author}</p>

<a href="watch.html?id=${doc.id}">
Watch Video
</a>

</div>

`;

});

}

loadVideos();

</script>

<div id="videos"></div>
