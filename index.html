<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InstaPro</title>
<style>
body{background:#0e0014;color:#fff;margin:0;font-family:system-ui}
#topBar{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #2a0a2a;position:sticky;top:0;background:#0e0014;z-index:10}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,#ff4d9d,#ff8a5b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{width:42px;height:42px;border-radius:50%;border:1px solid #333;background:#1a0a1a;color:#fff}
.view{display:none;min-height:85vh;padding-bottom:90px}.view.active{display:block}
.postCard{background:#1a0e1e;border-radius:18px;margin:12px;overflow:hidden;border:1px solid #2a1630}
.postCard img,.postCard video{width:100%;display:block}
#bottomBar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:10px;background:#0e0014;border-top:1px solid #2a0a2a;z-index:50}
#bottomBar button{width:64px;height:52px;border-radius:18px;border:none;background:#1c0e1e;color:#fff;font-size:22px}
#bottomBar button.active{background:#2a0a2a;box-shadow:0 0 12px #ff4d9d}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20}
#createSheet{display:none;position:fixed;left:0;right:0;bottom:0;background:#1e1022;border-radius:22px 22px 0 0;padding:18px;z-index:30}
#createSheet button{width:100%;padding:16px;margin:6px 0;border-radius:12px;border:none;background:#2a1630;color:#fff;text-align:left}
.p-header{display:flex;gap:16px;padding:16px;align-items:center}
.p-avatar{width:86px;height:86px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.p-avatar img{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #0e0014;background:#222}
.p-stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.p-stats b{display:block;font-size:18px}.p-stats span{font-size:12px;opacity:.6}
.p-btns{display:flex;gap:8px;padding:0 16px 16px}.p-btns button{flex:1;padding:8px;border-radius:8px;border:none;background:#2a2a3a;color:#fff;font-weight:600}
.p-tabs{display:flex;border-top:1px solid #222;border-bottom:1px solid #222}
.p-tabs button{flex:1;padding:12px;background:transparent;border:none;color:#fff;opacity:.5;font-weight:700}.p-tabs button.active{opacity:1;border-bottom:2px solid #fff}
.empty{padding:60px;text-align:center;opacity:.4}
</style></head><body>
<div id="topBar"><button id="addBtn" class="btn">+</button><div class="logo">InstaPro 👑</div><button id="notifBtn" class="btn">♡</button></div>

<div id="view-home" class="view active"><div id="feed"><div class="empty">Loading feed...</div></div></div>
<div id="view-reels" class="view"><div id="reelsFeed"><div class="empty">Loading reels...</div></div></div>
<div id="view-search" class="view"><div style="padding:12px"><input id="searchIn" placeholder="Search..." style="width:100%;padding:14px;border-radius:12px;background:#1a0e1e;border:1px solid #333;color:#fff"></div><div id="searchRes"></div></div>
<div id="view-notif" class="view"><div style="padding:16px">Notifications</div></div>
<div id="view-profile" class="view">
  <!-- FIX 1: id="menuBtn" add + clickable + clean name -->
  <div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center"><b id="profileTopName">_</b><div id="menuBtn" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer">☰</div></div>
  <div class="p-header"><div class="p-avatar"><img id="profilePic" src="https://i.pravatar.cc/150?u=new"></div><div class="p-stats"><div><b id="postsCount">0</b><span>Posts</span></div><div><b>0</b><span>Followers</span></div><div><b>0</b><span>Following</span></div></div></div>
  <div style="padding:0 16px 4px"><b id="nameText">New User</b> <span id="categoryText" style="font-size:12px;opacity:.6;background:#2a2a3a;padding:2px 6px;border-radius:10px">Creator</span><div id="bioText" style="margin-top:6px">Welcome to InstaPro ✨</div></div>
  <div class="p-btns"><button id="editBtn">Edit profile</button><button id="shareBtn">Share profile</button></div>
  <div id="highlightsBox" style="display:flex;gap:14px;padding:12px 16px;overflow:auto"></div>
  <div class="p-tabs"><button id="tabPosts" class="active">POSTS</button><button id="tabReels">REELS</button></div>
  <div id="postsGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px"></div>
  <div id="reelsGrid" style="display:none;grid-template-columns:1fr 1fr 1fr;gap:2px"></div>
</div>

<div id="overlay"></div>
<div id="createSheet"><button id="optPost">📷 New Post</button><button id="optReel">🎬 New Reel</button><button id="closeSheet">Close</button><div id="upStatus" style="display:none;padding:10px;font-size:12px"></div></div>
<input id="fileInput" type="file" style="display:none">
<div id="bottomBar"><button id="homeBtn" class="active">⌂</button><button id="reelsBtn">▶</button><button id="createBtn">+</button><button id="searchBtn">⌕</button><button id="profileBtn">◯</button></div>

<!-- FIX 2: menu.js ko yahan load karo -->
<script src="./menu.js"></script>

<script>
const $=id=>document.getElementById(id);
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active')); $(v).classList.add('active'); document.querySelectorAll('#bottomBar button').forEach(b=>b.classList.remove('active')); if(v==='view-home') $('homeBtn').classList.add('active'); if(v==='view-reels') $('reelsBtn').classList.add('active'); if(v==='view-profile') $('profileBtn').classList.add('active');}
$('homeBtn').onclick=()=>showView('view-home'); $('reelsBtn').onclick=()=>showView('view-reels'); $('profileBtn').onclick=()=>showView('view-profile'); $('searchBtn').onclick=()=>showView('view-search'); $('notifBtn').onclick=()=>showView('view-notif');
$('addBtn').onclick=()=>{$('createSheet').style.display='block';$('overlay').style.display='block';}; $('createBtn').onclick=$('addBtn').onclick;
$('overlay').onclick=()=>{$('createSheet').style.display='none';$('overlay').style.display='none';}; $('closeSheet').onclick=$('overlay').onclick;
$('tabPosts')?.addEventListener('click',()=>{$('postsGrid').style.display='grid';$('reelsGrid').style.display='none';$('tabPosts').classList.add('active');$('tabReels').classList.remove('active');});
$('tabReels')?.addEventListener('click',()=>{$('postsGrid').style.display='none';$('reelsGrid').style.display='grid';$('tabReels').classList.add('active');$('tabPosts').classList.remove('active');});
</script>

<script type="module">
import { firebaseConfig } from "./firebase.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// FIX 3: Clean User System - No Sanjay Kumar
let myId = localStorage.getItem('my_user_id');
if(!myId){ myId = 'user_'+Math.random().toString(36).slice(2,8); localStorage.setItem('my_user_id', myId); }
$('profileTopName').innerText = myId;
$('nameText').innerText = myId;

// Realtime Profile
onSnapshot(doc(db, "users", myId), snap=>{
  if(snap.exists()){
    let d=snap.data();
    $('nameText').innerText = d.name || myId;
    $('bioText').innerText = d.bio || 'Welcome to InstaPro ✨';
    if(d.photo) $('profilePic').src=d.photo;
    $('profileTopName').innerText = d.username || myId;
  }
});

// FIXED Edit + Share
const editSheet=document.getElementById('editSheet');const editOverlay=document.getElementById('editOverlay');
$('editBtn').onclick=()=>{document.getElementById('eName').value=$('nameText').innerText;document.getElementById('eBio').value=$('bioText').innerText;editSheet.style.display='block';editOverlay.style.display='block';};
$('eCancel').onclick=()=>{editSheet.style.display='none';editOverlay.style.display='none';};editOverlay.onclick=$('eCancel').onclick;
$('eSave').onclick=async()=>{let n=document.getElementById('eName').value.trim();let b=document.getElementById('eBio').value.trim();let f=document.getElementById('ePhoto').files[0];let photoUrl=null;if(f){let fd=new FormData();fd.append('file',f);fd.append('upload_preset','intube_free');let r=await fetch(`https://api.cloudinary.com/v1_1/kujnbe8a/image/upload`,{method:'POST',body:fd});let j=await r.json();photoUrl=j.secure_url;}let data={name:n||myId,bio:b||'Welcome ✨',username:myId};if(photoUrl)data.photo=photoUrl;await setDoc(doc(db,"users",myId),data,{merge:true});editSheet.style.display='none';editOverlay.style.display='none';};
$('shareBtn').onclick=async()=>{let link=location.href+'?user='+myId;if(navigator.share){try{await navigator.share({title:'My InstaPro',url:link});}catch(e){}}else{await navigator.clipboard.writeText(link);alert('Link copied: '+link);}};

let cur='post';
$('optPost').onclick=()=>{cur='post';$('fileInput').accept='image/*,video/*';$('fileInput').click();};
$('optReel').onclick=()=>{cur='reel';$('fileInput').accept='video/*';$('fileInput').click();};
async function up(file){ $('upStatus').style.display='block'; $('upStatus').innerText='Uploading...'; let fd=new FormData(); fd.append('file',file); fd.append('upload_preset',PRESET); let res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${file.type.includes('video')?'video':'image'}/upload`,{method:'POST',body:fd}); let j=await res.json(); return j.secure_url; }
$('fileInput').onchange=async e=>{ let f=e.target.files[0]; if(!f) return; let url=await up(f); if(!url){alert('Upload fail');return;} $('upStatus').innerText='Saving...'; await addDoc(collection(db,"posts"),{url,type:cur,user:myId,userId:myId,time:Date.now()}); e.target.value=''; $('createSheet').style.display='none'; $('overlay').style.display='none'; };

onSnapshot(query(collection(db,"posts"),orderBy("time","desc")),snap=>{
  let all=[]; snap.forEach(d=>all.push({...d.data(), id:d.id}));
  $('feed').innerHTML=all.map(p=>`<div class=postCard><div style="padding:12px;font-weight:700">${p.user}</div>${p.type==='reel'?`<video src="${p.url}" controls></video>`:`<img src="${p.url}">`}</div>`).join('')||'<div class=empty>No posts yet</div>';
  $('reelsFeed').innerHTML=all.filter(p=>p.type==='reel').map(p=>`<div class=postCard><video src="${p.url}" controls autoplay muted loop style="height:80vh"></video></div>`).join('')||'<div class=empty>No reels</div>';
  let mine=all.filter(p=>p.userId===myId);
  $('postsGrid').innerHTML=mine.filter(p=>p.type!=='reel').map(p=>`<img src="${p.url}" style="width:100%;aspect-ratio:1;object-fit:cover">`).join('');
  $('reelsGrid').innerHTML=mine.filter(p=>p.type==='reel').map(p=>`<video src="${p.url}" style="width:100%;aspect-ratio:1;object-fit:cover"></video>`).join('');
  $('postsCount').innerText=mine.length;
});
</script>
</body></html>
