<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUBE - Profile System</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff}
.top{position:sticky;top:0;background:#000;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #222;z-index:100}
#search{flex:1;background:#151515;border:1px solid #222;padding:10px 16px;border-radius:25px;color:#fff;outline:none}
#feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;padding:14px;padding-bottom:80px}
.card{background:#111;border:1px solid #222;border-radius:20px;overflow:hidden}
.card video,.card img{width:100%;height:380px;object-fit:cover;background:#000;cursor:pointer}
.info{padding:10px 12px}
.userRow{display:flex;align-items:center;justify-content:space-between}
.userLeft{display:flex;align-items:center;gap:10px;cursor:pointer}
.userLeft img{width:36px;height:36px;border-radius:50%;border:1px solid #333}
.actionRow{display:flex;gap:16px;margin-top:8px}
.actionBtn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;gap:5px;align-items:center}
.actionBtn.liked{color:#ff004f}
.actionBtn span{font-size:13px;color:#aaa}
.followBtn{background:#fff;color:#000;border:none;padding:6px 14px;border-radius:20px;font-weight:bold;font-size:12px;cursor:pointer}
.followBtn.following{background:#222;color:#fff;border:1px solid #333}
.bell{position:relative;font-size:22px;cursor:pointer}
.bell #notifCount{position:absolute;top:-6px;right:-8px;background:#ff004f;color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:10px;display:flex;align-items:center;justify-content:center;display:none}
#loginScreen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:200}
.loginCard{background:#111;padding:35px;border-radius:25px;border:1px solid #222;text-align:center;width:90%;max-width:380px}
.loginCard button{background:#fff;color:#000;border:none;padding:14px;width:100%;border-radius:30px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:150;display:none;align-items:center;justify-content:center;padding:16px}
.modalBox{background:#111;padding:18px;border-radius:20px;width:100%;max-width:440px;border:1px solid #222;max-height:85vh;overflow:auto}
.upload-btn{position:fixed;bottom:20px;right:20px;background:#ff004f;color:#fff;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;z-index:50}
.profileHeader{text-align:center;padding:10px}
.profileHeader img{width:80px;height:80px;border-radius:50%;border:2px solid #ff004f}
.stats{display:flex;justify-content:space-around;margin:14px 0;text-align:center}
.stat b{display:block;font-size:18px}
#progressWrap{display:none;margin-top:10px;background:#222;height:6px;border-radius:10px;overflow:hidden}
#progressBar{height:100%;width:0%;background:#ff004f}
</style>
</head>
<body>
<div id="loginScreen"><div class="loginCard"><h1>INTUBE 🔥</h1><p style="color:#888">Profile + Follow System</p><button id="googleBtn"><img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20"> Login with Google</button></div></div>

<div class="top"><b>INTUBE</b><input id="search" placeholder="Search..."><div class="bell" onclick="openNotif()">🔔<div id="notifCount">0</div></div><div id="profilePic" style="width:36px;height:36px;background:#222;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer" onclick="openMyProfile()">👤</div></div>

<div id="feed">Loading...</div>
<div class="upload-btn" onclick="document.getElementById('uploadModal').style.display='flex'">+</div>

<div id="uploadModal" class="modal"><div class="modalBox"><h3>Upload</h3><input id="vTitle" style="width:100%;margin:12px 0;padding:12px;border-radius:12px;background:#000;border:1px solid #222;color:#fff" placeholder="Title"><input type="file" id="vFile" accept="video/*,image/*"><div id="progressWrap"><div id="progressBar"></div></div><button id="upBtn" style="width:100%;margin-top:12px;background:#ff004f;border:none;padding:12px;border-radius:20px;color:#fff;font-weight:bold">Upload</button><button onclick="document.getElementById('uploadModal').style.display='none'" style="width:100%;margin-top:8px;background:#222;border:none;padding:8px;border-radius:20px;color:#fff">Close</button><p id="upStatus" style="text-align:center;margin-top:8px;color:#888;font-size:12px"></p></div></div>

<div id="profileModal" class="modal"><div class="modalBox">
<div class="profileHeader"><img id="pPhoto"><h2 id="pName"></h2><p id="pEmail" style="color:#888;font-size:12px"></p>
<div class="stats"><div class="stat"><b id="pPosts">0</b><small>Posts</small></div><div class="stat"><b id="pFollowers">0</b><small>Followers</small></div><div class="stat"><b id="pFollowing">0</b><small>Following</small></div></div>
<button id="pFollowBtn" class="followBtn" style="width:100%;padding:10px;font-size:14px">Follow</button>
</div><div id="pVideos" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"></div>
<button onclick="document.getElementById('profileModal').style.display='none'" style="width:100%;margin-top:12px;background:#222;border:none;padding:10px;border-radius:20px;color:#fff">Close</button>
</div></div>

<div id="commentModal" class="modal"><div class="modalBox"><h3>Comments</h3><div id="commentList"></div><div style="display:flex;gap:6px;margin-top:12px"><input id="commentInput" placeholder="Comment..." style="flex:1;padding:10px;border-radius:20px;background:#000;border:1px solid #333;color:#fff"><button onclick="postComment()" style="background:#ff004f;border:none;padding:10px 14px;border-radius:20px;color:#fff">Send</button></div><button onclick="document.getElementById('commentModal').style.display='none'" style="width:100%;margin-top:10px;background:#222;border:none;padding:8px;border-radius:20px;color:#fff">Close</button></div></div>

<div id="notifModal" class="modal"><div class="modalBox"><h3>Notifications 🔔</h3><div id="notifList"></div><button onclick="document.getElementById('notifModal').style.display='none'" style="width:100%;margin-top:10px;background:#222;border:none;padding:8px;border-radius:20px;color:#fff">Close</button></div></div>

<script type="module">
import { initializeApp } from "firebase/app"; import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "firebase/auth"; import { getFirestore, collection, addDoc, doc, updateDoc, query, orderBy, where, arrayUnion, arrayRemove, increment, onSnapshot, serverTimestamp, getDocs, deleteDoc } from "firebase/firestore";
const firebaseConfig = { apiKey: "AIzaSyDibgzp64G1QB7Pma-7Zx4yMAV06go8cNU", authDomain: "intube-61cca.firebaseapp.com", projectId: "intube-61cca", storageBucket: "intube-61cca.firebasestorage.app", messagingSenderId: "627409965607", appId: "1:627409965607:web:a1d71800d812fe668b7402" };
const CLOUD_NAME="kujnbe0a"; const UPLOAD_PRESET="intube_free";
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app); const provider=new GoogleAuthProvider();
setPersistence(auth,browserLocalPersistence); getRedirectResult(auth).catch(()=>{});
let currentUser=null, allVideos=[], currentCommentId=null, following=[], currentProfileEmail=null;

document.getElementById('googleBtn').onclick=async()=>{ try{await signInWithPopup(auth,provider)}catch{await signInWithRedirect(auth,provider)} };
onAuthStateChanged(auth,(u)=>{ if(u){ currentUser=u; document.getElementById('loginScreen').style.display='none'; document.getElementById('profilePic').innerHTML=`<img src="${u.photoURL}" style="width:100%;height:100%">`; startRealtime(); } else { document.getElementById('loginScreen').style.display='flex'; startRealtime(); } });
window.logout=()=>signOut(auth).then(()=>location.reload());

function startRealtime(){
 onSnapshot(query(collection(db,"videos"), orderBy("time","desc")), snap=>{ allVideos=snap.docs.map(d=>({id:d.id,...d.data()})); render(); });
 if(currentUser){
  onSnapshot(query(collection(db,"follows"), where("followerEmail","==",currentUser.email)), snap=>{ following=snap.docs.map(d=>d.data().followingEmail); render(); });
  onSnapshot(query(collection(db,"notifications"), where("toEmail","==",currentUser.email), orderBy("time","desc")), snap=>{ const n=snap.docs; document.getElementById('notifCount').style.display=n.length?'flex':'none'; document.getElementById('notifCount').innerText=n.length; window._notifs=n.map(d=>d.data()); });
 }
}
function render(){
 let html=""; allVideos.forEach(v=>{
  const liked=currentUser && v.likes?.includes(currentUser.email); const isFollowing=following.includes(v.userEmail);
  html+=`<div class="card">${v.url.includes('video')||v.url.includes('.mp4')?`<video src="${v.url}" controls onplay="addView('${v.id}')"></video>`:`<img src="${v.url}">`}
  <div class="info"><div class="userRow"><div class="userLeft" onclick="openProfile('${v.userEmail}','${v.userName}','${v.userPhoto}')"><img src="${v.userPhoto}"><div><b style="font-size:14px">${v.title}</b><p style="color:#888;font-size:11px">${v.userName} • 👁️ ${v.views||0}</p></div></div>${currentUser && v.userEmail!==currentUser.email?`<button class="followBtn ${isFollowing?'following':''}" onclick="toggleFollow('${v.userEmail}')">${isFollowing?'Following':'Follow'}</button>`:''}</div>
  <div class="actionRow"><button class="actionBtn ${liked?'liked':''}" onclick="toggleLike('${v.id}','${v.userEmail}')">${liked?'❤️':'🤍'} <span>${v.likes?.length||0}</span></button><button class="actionBtn" onclick="openComment('${v.id}')">💬 <span>${v.commentCount||0}</span></button></div></div></div>`;
 });
 document.getElementById('feed').innerHTML=html||"No posts";
}
window.addView=async(id)=>{ await updateDoc(doc(db,"videos",id),{views:increment(1)}); };
window.toggleLike=async(id,owner)=>{ if(!currentUser) return alert("Login"); const v=allVideos.find(x=>x.id===id); const ref=doc(db,"videos",id); if(v.likes?.includes(currentUser.email)) await updateDoc(ref,{likes:arrayRemove(currentUser.email)}); else { await updateDoc(ref,{likes:arrayUnion(currentUser.email)}); if(owner!==currentUser.email) await addDoc(collection(db,"notifications"),{toEmail:owner,fromName:currentUser.displayName,type:"like",text:`${currentUser.displayName} liked your post ❤️`,time:serverTimestamp()}); } };
window.toggleFollow=async(email)=>{ if(!currentUser) return alert("Login"); const q=query(collection(db,"follows"), where("followerEmail","==",currentUser.email), where("followingEmail","==",email)); const snap=await getDocs(q); if(!snap.empty){ snap.forEach(d=>deleteDoc(doc(db,"follows",d.id))); } else { await addDoc(collection(db,"follows"),{followerEmail:currentUser.email,followingEmail:email,time:serverTimestamp()}); await addDoc(collection(db,"notifications"),{toEmail:email,fromName:currentUser.displayName,type:"follow",text:`${currentUser.displayName} followed you ➕`,time:serverTimestamp()}); } if(currentProfileEmail===email) openProfile(currentProfileEmail,document.getElementById('pName').innerText,document.getElementById('pPhoto').src); };

window.openProfile=async(email,name,photo)=>{
 currentProfileEmail=email; document.getElementById('profileModal').style.display='flex'; document.getElementById('pName').innerText=name; document.getElementById('pEmail').innerText=email; document.getElementById('pPhoto').src=photo;
 const posts=allVideos.filter(v=>v.userEmail===email); document.getElementById('pPosts').innerText=posts.length;
 const followersSnap=await getDocs(query(collection(db,"follows"), where("followingEmail","==",email))); document.getElementById('pFollowers').innerText=followersSnap.size;
 const followingSnap=await getDocs(query(collection(db,"follows"), where("followerEmail","==",email))); document.getElementById('pFollowing').innerText=followingSnap.size;
 const btn=document.getElementById('pFollowBtn'); if(!currentUser || email===currentUser.email){ btn.style.display='none'; } else { btn.style.display='block'; btn.innerText=following.includes(email)?'Following':'Follow'; btn.className=following.includes(email)?'followBtn following':'followBtn'; btn.onclick=()=>toggleFollow(email); }
 let pvHtml=""; posts.forEach(v=>{ pvHtml+=`<div style="border-radius:12px;overflow:hidden;border:1px solid #222">${v.url.includes('video')?`<video src="${v.url}" style="width:100%;height:120px;object-fit:cover"></video>`:`<img src="${v.url}" style="width:100%;height:120px;object-fit:cover">`}<p style="padding:4px;font-size:11px">${v.title}</p></div>`; }); document.getElementById('pVideos').innerHTML=pvHtml||"<p style='color:#666'>No posts</p>";
};
window.openMyProfile=()=>{ if(!currentUser) return; openProfile(currentUser.email, currentUser.displayName, currentUser.photoURL); };
window.openComment=async(id)=>{ currentCommentId=id; document.getElementById('commentModal').style.display='flex'; onSnapshot(query(collection(db,"videos",id,"comments"), orderBy("time","desc")), snap=>{ let h=""; snap.forEach(d=>{ const c=d.data(); h+=`<div style="background:#000;border:1px solid #222;padding:8px;border-radius:10px;margin-top:6px;font-size:13px"><b>${c.userName}</b>: ${c.text}</div>`; }); document.getElementById('commentList').innerHTML=h||"No comments"; }); };
window.postComment=async()=>{ const t=document.getElementById('commentInput').value.trim(); if(!t) return; const v=allVideos.find(x=>x.id===currentCommentId); await addDoc(collection(db,"videos",currentCommentId,"comments"),{text:t,userName:currentUser.displayName,time:serverTimestamp()}); await updateDoc(doc(db,"videos",currentCommentId),{commentCount:increment(1)}); if(v.userEmail!==currentUser.email) await addDoc(collection(db,"notifications"),{toEmail:v.userEmail,fromName:currentUser.displayName,type:"comment",text:`${currentUser.displayName} commented: ${t}`,time:serverTimestamp()}); document.getElementById('commentInput').value=""; };
window.openNotif=()=>{ document.getElementById('notifModal').style.display='flex'; let h=""; (window._notifs||[]).forEach(n=>{ h+=`<div style="background:#000;border:1px solid #222;padding:10px;border-radius:12px;margin-top:8px;font-size:13px">🔔 ${n.text}</div>`; }); document.getElementById('notifList').innerHTML=h||"No notifications"; };
document.getElementById('upBtn').onclick=()=>{ let file=document.getElementById('vFile').files[0]; let title=document.getElementById('vTitle').value.trim(); if(!file||!title) return alert("Title+file"); const upBtn=document.getElementById('upBtn'), bar=document.getElementById('progressBar'), wrap=document.getElementById('progressWrap'), status=document.getElementById('upStatus'); upBtn.disabled=true; wrap.style.display='block'; let fd=new FormData(); fd.append('file',file); fd.append('upload_preset',UPLOAD_PRESET); const xhr=new XMLHttpRequest(); xhr.open('POST',`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`); xhr.upload.onprogress=e=>{ if(e.lengthComputable){ bar.style.width=Math.round(e.loaded/e.total*100)+'%'; status.innerText=Math.round(e.loaded/e.total*100)+'%'; } }; xhr.onload=async()=>{ try{ const data=JSON.parse(xhr.responseText); await addDoc(collection(db,"videos"),{title,url:data.secure_url,userName:currentUser.displayName,userEmail:currentUser.email,userPhoto:currentUser.photoURL,likes:[],views:0,commentCount:0,time:serverTimestamp()}); status.innerText="Done"; setTimeout(()=>{ document.getElementById('uploadModal').style.display='none'; upBtn.disabled=false; },800); }catch(e){ status.innerText="Fail: "+e.message; upBtn.disabled=false; } }; xhr.send(fd); };
document.querySelectorAll('.modal').forEach(m=>{ m.addEventListener('click', e=>{ if(e.target===m) m.style.display='none'; }); });
</script>
</body>
</html>
