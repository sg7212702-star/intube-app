<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>InstaPro</title>
<style>
body{background:#0a0a0f;color:#fff;margin:0;font-family:system-ui}
#topBar{display:flex;justify-content:space-between;padding:12px;background:#0a0a0f;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:20px}.btn{width:42px;height:42px;border-radius:50%;border:1px solid #333;background:#15151d;color:#fff}
.view{display:none;padding:12px;min-height:70vh}.view.active{display:block}
#postsGrid,#reelsGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px}
.postCard{background:#15151d;border-radius:12px;margin-bottom:12px;overflow:hidden;border:1px solid #222}
.postCard img,.postCard video{width:100%;display:block}
#bottomBar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:10px 0;background:#0f0f17;border-top:1px solid #222}
#bottomBar button{width:56px;height:42px;border-radius:14px;border:none;background:#1a1a27;color:#fff;font-size:20px}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
#createSheet{display:none;position:fixed;left:0;right:0;bottom:0;background:#1c1c29;border-radius:20px 20px 0 0;padding:18px;z-index:30}
#createSheet button{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:none;background:#2a2a3d;color:#fff;text-align:left}
.empty{padding:40px;text-align:center;opacity:.5}
</style></head><body>
<div id="topBar"><button id="addBtn" class="btn">+</button><div class="logo">InstaPro</div><button class="btn">♡</button></div>
<div id="view-home" class="view active"><div id="feed"></div></div>
<div id="view-reels" class="view"><div id="reelsFeed"></div></div>
<div id="view-profile" class="view"><div style="display:flex;justify-content:space-between;padding:12px"><b id="nameText">sanjay kumar</b><b id="postsCount">0 posts</b></div><div id="postsGrid"></div><div id="reelsGrid" style="display:none"></div></div>
<div id="overlay"></div>
<div id="createSheet"><button id="optPost">📷 New Post</button><button id="optReel">🎬 New Reel</button><button id="closeSheet">Close</button></div>
<input id="fileInput" type="file" accept="image/*,video/*" style="display:none">
<div id="bottomBar"><button id="homeBtn">⌂</button><button id="reelsBtn">▶</button><button id="createBtn">+</button><button id="searchBtn">⌕</button><button id="profileBtn">◯</button></div>
<script>
const CLOUD_NAME='kujnbe8a';const PRESET='intube_free';let cur='post';
const $=id=>document.getElementById(id);
const showView=v=>{document.querySelectorAll('.view').forEach(x=>{x.classList.remove('active');x.style.display='none'});let e=$(v);if(e){e.classList.add('active');e.style.display='block';}};
$('homeBtn').onclick=()=>{showView('view-home');renderFeed();};
$('reelsBtn').onclick=()=>{showView('view-reels');renderReels();};
$('profileBtn').onclick=()=>{showView('view-profile');renderProfile();};
function openSheet(){$('createSheet').style.display='block';$('overlay').style.display='block';}
function closeSheet(){$('createSheet').style.display='none';$('overlay').style.display='none';}
$('addBtn').onclick=openSheet;$('createBtn').onclick=openSheet;
$('overlay').onclick=closeSheet;$('closeSheet').onclick=closeSheet;
$('optPost').onclick=()=>{cur='post';$('fileInput').accept='image/*,video/*';$('fileInput').click();};
$('optReel').onclick=()=>{cur='reel';$('fileInput').accept='video/*';$('fileInput').click();};
async function up(file){
let b64=await new Promise(r=>{let rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(file);});
let fd=new FormData();fd.append('file',file);fd.append('upload_preset',PRESET);
try{let res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${file.type.includes('video')?'video':'image'}/upload`,{method:'POST',body:fd});let j=await res.json();if(j.secure_url)return j.secure_url;}catch(e){}
return b64;
}
$('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;closeSheet();let url=await up(f);let all=JSON.parse(localStorage.getItem('intube_cloud')||'[]');all.push({url,type:cur,time:Date.now(),user:$('nameText').innerText});localStorage.setItem('intube_cloud',JSON.stringify(all));e.target.value='';renderFeed();renderReels();renderProfile();};
function renderFeed(){let all=JSON.parse(localStorage.getItem('intube_cloud')||'[]');let feed=$('feed');if(all.length==0){feed.innerHTML='<div class=empty>Feed Empty</div>';return;}feed.innerHTML='';all.slice().reverse().forEach(p=>{let m=p.type==='reel'?`<video src="${p.url}" controls style="width:100%"></video>`:`<img src="${p.url}" style="width:100%">`;feed.innerHTML+=`<div class=postCard><div style="padding:10px;font-weight:700">${p.user}</div>${m}</div>`;});}
function renderReels(){let all=JSON.parse(localStorage.getItem('intube_cloud')||'[]').filter(p=>p.type==='reel');let rf=$('reelsFeed');if(all.length==0){rf.innerHTML='<div class=empty>No Reels</div>';return;}rf.innerHTML='';all.slice().reverse().forEach(p=>{rf.innerHTML+=`<div class=postCard><video src="${p.url}" controls autoplay muted loop style="width:100%;height:70vh;object-fit:contain"></video></div>`;});}
function renderProfile(){let all=JSON.parse(localStorage.getItem('intube_cloud')||'[]');$('postsCount').innerText=all.length;let g=$('postsGrid');g.innerHTML='';all.slice().reverse().forEach(p=>{let d=document.createElement('div');d.style.cssText='aspect-ratio:1/1;overflow:hidden;background:#111;border-radius:6px';d.innerHTML=p.type==='reel'?`<video src="${p.url}" style="width:100%;height:100%;object-fit:cover"></video>`:`<img src="${p.url}" style="width:100%;height:100%;object-fit:cover">`;g.appendChild(d);});}
renderFeed();renderReels();renderProfile();
</script></body></html>
