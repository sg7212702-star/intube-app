<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InstaPro</title>
<style>
body{background:#0e0014;color:#fff;margin:0;font-family:system-ui}
#topBar{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #2a0a2a;position:sticky;top:0;background:#0e0014;z-index:10}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,#ff4d9d,#ff8a5b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{width:42px;height:42px;border-radius:50%;border:1px solid #333;background:#1a0a1a;color:#fff}
.view{display:none;min-height:85vh;padding-bottom:90px}.view.active{display:block}
.postCard{background:#1a0e1e;border-radius:18px;margin:12px;overflow:hidden;border:1px solid #2a1630}
.postCard img,.postCard video{width:100%;display:block}
#bottomBar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:10px;background:#0e0014;border-top:1px solid #2a0a2a;z-index:50}
#bottomBar button{width:64px;height:52px;border-radius:18px;border:none;background:#1c0e1e;color:#fff;font-size:22px}
#bottomBar button.active{background:#2a0a2a;box-shadow:0 0 12px #ff4d9d}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20}
#createSheet{display:none;position:fixed;left:0;right:0;bottom:0;background:#1e1022;border-radius:22px 22px 0 0;padding:18px;z-index:30}
#createSheet button{width:100%;padding:16px;margin:6px 0;border-radius:12px;border:none;background:#2a1630;color:#fff;text-align:left}
.p-header{display:flex;gap:16px;padding:16px;align-items:center}
.p-avatar{width:86px;height:86px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.p-avatar img{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #0e0014;background:#222}
.p-stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.p-stats b{display:block;font-size:18px}.p-stats span{font-size:12px;opacity:.6}
.p-btns{display:flex;gap:8px;padding:0 16px 16px}.p-btns button{flex:1;padding:8px;border-radius:8px;border:none;background:#2a2a3a;color:#fff;font-weight:600}
.p-tabs{display:flex;border-top:1px solid #222;border-bottom:1px solid #222}
.p-tabs button{flex:1;padding:12px;background:transparent;border:none;color:#fff;opacity:.5;font-weight:700}.p-tabs button.active{opacity:1;border-bottom:2px solid #fff}
.empty{padding:60px;text-align:center;opacity:.4}
/* MOBILE LAYOUT FIX */
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  max-width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

img,
video {
  max-width: 100%;
}

.view {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

.postCard {
  width: calc(100% - 24px);
  max-width: 600px;
  margin: 12px auto;
}

#feed,
#reelsFeed,
#postsGrid,
#reelsGrid {
  width: 100%;
  max-width: 100%;
  min-width: 0;
}

#bottomBar {
  width: 100%;
  left: 0;
  right: 0;
  padding-bottom: env(safe-area-inset-bottom);
}

#topBar {
  width: 100%;
  max-width: 100%;
}

@media (max-width: 600px) {
  body {
    font-size: 14px;
  }

  .postCard img,
  .postCard video {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
  }
                                                      }  
</style></head><body>
<div id="topBar"><button id="addBtn" class="btn">+</button><div class="logo">InstaPro 👑</div><button id="notifBtn" class="btn">♡</button></div>

<div id="view-home" class="view active"><div id="feed"><div class="empty">Loading feed...</div></div></div>
<div id="view-reels" class="view"><div id="reelsFeed"><div class="empty">Loading reels...</div></div></div>
<div id="view-search" class="view"><div style="padding:12px"><input id="searchIn" placeholder="Search..." style="width:100%;padding:14px;border-radius:12px;background:#1a0e1e;border:1px solid #333;color:#fff"></div><div id="searchRes"></div></div>
<div id="view-notif" class="view"><div style="padding:16px">Notifications</div></div>
<div id="view-profile" class="view">
  <!-- FIX 1: id="menuBtn" add + clickable + clean name -->
  <div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center"><b id="profileTopName">_</b><div id="menuBtn" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer">☰</div></div>
  <div class="p-header"><div class="p-avatar"><img id="profilePic" src="https://i.pravatar.cc/150?u=new"></div><div class="p-stats"><div><b id="postsCount">0</b><span>Posts</span></div><div><b>0</b><span>Followers</span></div><div><b>0</b><span>Following</span></div></div></div>
  <div style="padding:0 16px 4px"><b id="nameText">New User</b> <span id="categoryText" style="font-size:12px;opacity:.6;background:#2a2a3a;padding:2px 6px;border-radius:10px">Creator</span><div id="bioText" style="margin-top:6px">Welcome to InstaPro ✨</div></div>
  <div class="p-btns"><button id="editBtn">Edit profile</button><button id="shareBtn">Share profile</button></div>
  <div id="highlightsBox" style="display:flex;gap:14px;padding:12px 16px;overflow:auto"></div>
  <div class="p-tabs"><button id="tabPosts" class="active">POSTS</button><button id="tabReels">REELS</button></div>
  <div id="postsGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px"></div>
  <div id="reelsGrid" style="display:none;grid-template-columns:1fr 1fr 1fr;gap:2px"></div>
</div>

<div id="overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9998"></div>
<div id="createSheet" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;z-index:9999;border-radius:20px 20px 0 0;padding:16px">
<button type="button" id="optPost" style="width:100%;padding:14px;background:#222;color:#fff;border:1px solid #333;border-radius:12px;margin-bottom:10px">📷 New Post</button>
<button type="button" id="optReel" style="width:100%;padding:14px;background:#222;color:#fff;border:1px solid #333;border-radius:12px;margin-bottom:10px">🎬 New Reel</button>
<button type="button" id="closeSheet" style="width:100%;padding:14px;background:#000;color:#fff;border-radius:12px">Close</button>
<div id="upStatus" style="display:none;padding:10px;font-size:12px;color:#aaa"></div>
</div>
<input id="fileInput" type="file" accept="image/*,video/*" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0">

<div id="bottomBar" style="position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#000;border-top:1px solid #222;padding:10px 0;z-index:9997">
<button type="button" id="homeBtn" class="active">⌂</button>
<button type="button" id="reelsBtn">▶</button>
<button type="button" id="createBtn">+</button>
<button type="button" id="searchBtn">⌕</button>
<button type="button" id="profileBtn">◯</button>
</div>

<!-- PRO GLASS EDITOR - FINAL -->
<div id="instaEditor" style="display:none;position:fixed;inset:0;background:#000;z-index:99999;flex-direction:column">
<div style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.12)">
<button onclick="closeEditor()" style="width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:16px">✕</button>
<span style="color:#fff;font-weight:800;font-size:14px">PRO EDITOR • GLASS</span>
<button onclick="goToCaption()" style="background:#0095f6;color:#fff;font-weight:800;padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,0.3)">Next</button>
</div>
<div id="editArea" style="flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden">
<img id="editorImage" src="" style="max-width:100%;max-height:100%;object-fit:contain">
<div id="textOverlays" style="position:absolute;inset:0;pointer-events:none;z-index:2"></div>
<canvas id="editorCanvas" style="display:none"></canvas>
</div>
<div style="background:rgba(20,20,20,0.9);backdrop-filter:blur(25px);border-top:1px solid rgba(255,255,255,0.12)">
<div style="display:flex">
<button id="tabFilter" onclick="showTab('filter')" style="flex:1;background:rgba(255,255,255,0.12);border:none;color:#fff;padding:14px 0;font-weight:800;border-bottom:2px solid #fff">FILTERS</button>
<button id="tabEdit" onclick="showTab('edit')" style="flex:1;background:transparent;border:none;color:rgba(255,255,255,0.5);padding:14px 0;font-weight:700">EDIT</button>
</div>
<div id="filterRow" style="display:flex;gap:12px;overflow-x:auto;padding:16px">
<div onclick="applyFilter('none',this)" style="min-width:70px;text-align:center"><div class="fbox" style="width:64px;height:64px;border-radius:14px;background:rgba(255,255,255,0.2);border:2px solid #fff;display:flex;align-items:center;justify-content:center">🖼️</div><p style="color:#fff;font-size:10px;margin-top:6px">Normal</p></div>
<div onclick="applyFilter('grayscale(100%)',this)" style="min-width:70px;text-align:center"><div class="fbox" style="width:64px;height:64px;border-radius:14px;background:rgba(120,120,120,0.3);border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center">⚫</div><p style="color:#fff;font-size:10px;margin-top:6px">Mono</p></div>
<div onclick="applyFilter('sepia(0.9)',this)" style="min-width:70px;text-align:center"><div class="fbox" style="width:64px;height:64px;border-radius:14px;background:rgba(180,140,100,0.4);border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center">📜</div><p style="color:#fff;font-size:10px;margin-top:6px">Sepia</p></div>
<div onclick="applyFilter('contrast(140%) saturate(140%)',this)" style="min-width:70px;text-align:center"><div class="fbox" style="width:64px;height:64px;border-radius:14px;background:rgba(0,200,255,0.3);border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center">🌈</div><p style="color:#fff;font-size:10px;margin-top:6px">Vivid</p></div>
<div onclick="applyFilter('brightness(120%)',this)" style="min-width:70px;text-align:center"><div class="fbox" style="width:64px;height:64px;border-radius:14px;background:rgba(255,255,200,0.3);border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center">☀️</div><p style="color:#fff;font-size:10px;margin-top:6px">Bright</p></div>
</div>
<div id="editRow" style="display:none;padding:16px;gap:10px;flex-wrap:wrap">
<button onclick="changeRatio()" style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:10px 18px;border-radius:20px;font-weight:700">✂️ Crop</button>
<button onclick="rotateImg()" style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:10px 18px;border-radius:20px;font-weight:700">🔄 Rotate</button>
<button onclick="addText()" style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:10px 18px;border-radius:20px;font-weight:700">Aa Text</button>
<button onclick="clearTexts()" style="background:rgba(255,60,60,0.2);color:#fff;border:1px solid rgba(255,80,80,0.3);padding:10px 18px;border-radius:20px;font-weight:700">🗑️ Clear</button>
<label style="flex:1;min-width:140px;background:rgba(255,255,255,0.1);color:#fff;padding:10px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);display:flex;gap:8px;font-size:12px">☀️<input id="brightRange" type="range" min="50" max="200" value="100" oninput="updateEdit()" style="flex:1"></label>
<label style="flex:1;min-width:140px;background:rgba(255,255,255,0.1);color:#fff;padding:10px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);display:flex;gap:8px;font-size:12px">◐<input id="contrastRange" type="range" min="50" max="200" value="100" oninput="updateEdit()" style="flex:1"></label>
<label style="flex:1;min-width:140px;background:rgba(255,255,255,0.1);color:#fff;padding:10px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);display:flex;gap:8px;font-size:12px">🎨<input id="saturateRange" type="range" min="0" max="200" value="100" oninput="updateEdit()" style="flex:1"></label>
</div>
</div>
<div id="captionPage" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(30px);z-index:100000;flex-direction:column">
<div style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:rgba(0,0,0,0.6);border-bottom:1px solid rgba(255,255,255,0.1)">
<button onclick="backToEdit()" style="width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);color:#fff">←</button>
<span style="color:#fff;font-weight:800">New Post</span>
<button onclick="postNow()" style="background:#0095f6;color:#fff;font-weight:800;padding:8px 20px;border-radius:20px;border:1px solid rgba(255,255,255,0.3)">Share</button>
</div>
<div style="margin:16px;padding:16px;display:flex;gap:12px;background:rgba(255,255,255,0.08);border-radius:16px;border:1px solid rgba(255,255,255,0.12)">
<img id="captionThumb" src="" style="width:64px;height:64px;border-radius:12px;object-fit:cover">
<textarea id="captionInput" placeholder="Write caption... ✨" style="flex:1;background:transparent;border:none;color:#fff;outline:none;resize:none;height:100px"></textarea>
</div>
</div>
</div>

<script type="module">
import { db } from "./firebase.js";
import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
let currentFilter='none', currentRatio='original', rot=0;
window.finalImageBase64=null;
const $=id=>document.getElementById(id);
window.closeEditor=()=>{ $('instaEditor').style.display='none'; $('textOverlays').innerHTML=''; $('captionPage').style.display='none'; $('fileInput').value=''; };
window.showTab=(t)=>{ if(t==='filter'){ $('filterRow').style.display='flex'; $('editRow').style.display='none'; $('tabFilter').style.cssText='flex:1;background:rgba(255,255,255,0.12);border:none;color:#fff
