<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>INTUBE - Locked</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#08080a;color:#fff;max-width:480px;margin:0 auto;padding-bottom:100px;background:radial-gradient(600px at 0% 0%,rgba(225,48,108,.22),transparent 70%),#08080a}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(12,12,14,.8);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:99}
.logo{font-family:cursive;font-size:28px;color:#E1306C;font-style:italic;font-weight:700}
.btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#E1306C;font-size:20px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px)}
.storyWrap{padding:16px;background:rgba(255,255,255,.02);border-bottom:1px solid rgba(255,255,255,.06)}
.story{width:72px;text-align:center;position:relative}
.ring{width:72px;height:72px;border-radius:50%;padding:3px;background:conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);position:relative}
.ring img{width:100%;height:100%;border-radius:50%;border:3px solid #0a0a0c;background:#2a2a3a;object-fit:cover}
.plus{position:absolute;bottom:2px;right:2px;width:24px;height:24px;background:#0095F6;color:#fff;border-radius:50%;border:2.5px solid #0a0a0c;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.story span{font-size:13px;margin-top:8px;display:block;color:#fff}
.feed{padding:16px}
.empty{padding:50px 20px;text-align:center;border-radius:24px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.14);backdrop-filter:blur(20px);color:#888;line-height:1.6}
.empty b{color:#fff;font-size:18px;display:block;margin-bottom:10px}
.empty small{line-height:2.2;font-size:15px}
.bottom{position:fixed;bottom:16px;left:16px;right:16px;max-width:448px;margin:0 auto;height:68px;display:flex;justify-content:space-around;align-items:center;background:rgba(20,20,24,.85);backdrop-filter:blur(32px);border:1px solid rgba(255,255,255,.13);border-radius:28px;z-index:200}
.bottom button{width:52px;height:52px;border-radius:16px;border:none;background:transparent;color:#8e8e8e;font-size:28px;display:flex;align-items:center;justify-content:center}
.bottom button.active{background:rgba(255,255,255,.10);color:#fff}
.bottom img{width:30px;height:30px;border-radius:50%}
</style></head><body>
<div class="top"><button class="btn">+</button><div class="logo">InstaPro 👑</div><button class="btn">♡</button></div>
<div class="storyWrap"><div class="story" id="yourStory"><div class="ring"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"><div class="plus">+</div></div><span>Your story</span></div></div>
<div class="feed" id="feed"><div class="empty"><b>Feed Empty 💎</b>No posts yet.
