window.openU=()=>{if(!cur)return alert("Login");umodal.style.display='flex'};window.closeU=()=>{umodal.style.display='none';ustatus.innerText="";pwrap.style.display='none'};vfile.onchange=e=>{const f=e.target.files[0];if(!f)return;prev.style.display='block';if(f.type.startsWith('video')){prev.outerHTML=`<video id="prev" controls style="width:100%;max-height:170px;border-radius:10px;margin-top:8px;display:block" class="${fsel.value}"></video>`;document.getElementById('prev').src=URL.createObjectURL(f)}else{prev.src=URL.createObjectURL(f);prev.className=fsel.value}};fsel.onchange=e=>{prev.className=e.target.value};upbtn.onclick=()=>{let file=vfile.files[0],title=vtitle.value.trim();if(!file||!title)return alert("Caption+file");upbtn.disabled=true;upbtn.innerText="Posting...";ustatus.innerText="0%";pwrap.style.display='block';pbar.style.width='0%';let fd=new FormData();fd.append('file',file);fd.append('upload_preset',PRESET);const xhr=new XMLHttpRequest();xhr.open('POST',`https://api.cloudinary.com/v1_1/${CLOUD}/auto/upload`);xhr.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);pbar.style.width=p+'%';ustatus.innerText=p+'%'}};xhr.onload=async()=>{try{const d=JSON.parse(xhr.responseText);if(!d.secure_url)throw new Error(d.error?.message);ustatus.innerText="Saving...";await addDoc(collection(db,"videos"),{title,url:d.secure_url,filter:fsel.value,userId:cur.uid,userName:cur.displayName,userPhoto:cur.photoURL,likes:0,comments:0,likedBy:[],time:serverTimestamp()});ustatus.innerText="Done";setTimeout(()=>{closeU();vtitle.value="";vfile.value="";prev.style.display='none';upbtn.disabled=false;upbtn.innerText="Post"},700)}catch(e){ustatus.innerText=e.message;upbtn.disabled=false;upbtn.innerText="Post"}};xhr.onerror=()=>{ustatus.innerText="Network error";upbtn.disabled=false;upbtn.innerText="Post"};xhr.send(fd)};search.oninput=e=>{const q=e.target.value.toLowerCase();const f=vids.filter(v=>v.title.toLowerCase().includes(q)||v.userName.toLower window.tm=()=>{const p=document.getElementById('apanel');p.style.display=p.style.display==='block'?'none':'block';if(p.style.display==='block')updateAnalytics()};function updateAnalytics(){if(!cur)return;const mine=vids.filter(v=>v.userId===cur.uid);const totalLikes=mine.reduce((s,v)=>s+(v.likes||0),0);const totalViews=mine.length*127+totalLikes*3;const eng=mine.length?Math.round(totalLikes/mine.length*10):0;document.getElementById('astats').innerHTML=`<div style="padding:10px;border-radius:12px;background:rgba(255,255,255,.08);text-align:center"><b style="font-size:18px">${totalViews}</b><br><span style="font-size:10px">VIEWS</span></div><div style="padding:10px;border-radius:12px;background:rgba(255,255,255,.08);text-align:center"><b style="font-size:18px">${totalLikes}</b><br><span style="font-size:10px">LIKES</span></div><div style="padding:10px;border-radius:12px;background:rgba(255,255,255,.08);text-align:center"><b style="font-size:18px">${follow.size}</b><br><span style="font-size:10px">FOLLOWING</span></div><div style="padding:10px;border-radius:12px;background:rgba(255,255,255,.08);text-align:center"><b style="font-size:18px">${eng}%</b><br><span style="font-size:10px">ENGAGE</span></div>`}window.setF=f=>{curFilter=f;document.querySelectorAll('#feed video,#feed img').forEach(el=>{el.className=f});document.querySelectorAll('[id^=f]').forEach(b=>b.style.background='rgba(255,255,255,.15)');const map={'':'f0','f-vivid':'f1','f-cinema':'f2','f-gold':'f3','f-neon':'f4','f-vintage':'f5'};if(map[f])document.getElementById(map[f]).style.background='#ff4da6'};
</script></body></html>
