<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>INTUBE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
*{font-family:system-ui}
body{
background:#050508;
color:#fff;
max-width:480px;
margin:0 auto;
padding-bottom:90px;
}
.top{
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
position:sticky;
top:0;
z-index:99;
background:rgba(10,10,12,.45);
backdrop-filter:blur(30px);
border-bottom:1px solid rgba(255,255,255,.07);
}
.logo{
font-family:cursive;
font-size:27px;
color:#E1306C;
font-weight:700;
font-style:italic;
}
.btn{
width:36px;
height:36px;
border-radius:50%;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.10);
color:#E1306C;
font-size:20px;
display:flex;
align-items:center;
justify-content:center;
}
.stories{
display:flex;
gap:14px;
padding:14px 16px;
background:rgba(255,255,255,.015);
border-bottom:1px solid rgba(255,255,255,.05);
}
.story{
flex:0 0 68px;
text-align:center;
position:relative;
}
.ring{
width:68px;
height:68px;
border-radius:50%;
padding:3px;
background:conic-gradient(
#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
position:relative;
}
.ring img{
width:100%;
height:100%;
border-radius:50%;
border:3px solid #08080a;
background:#222;
object-fit:cover;
}
.plus{
position:absolute;
bottom:-1px;
right:-1px;
width:22px;
height:22px;
background:#0095F6;
color:#fff;
border-radius:50%;
border:2.5px solid #08080a;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
font-weight:700;
}
.story span{
font-size:11px;
margin-top:6px;
display:block;
color:#fff;
}
.feed{
min-height:60vh;
}
.empty{
margin:20px 16px;
padding:44px 20px;
text-align:center;
border-radius:22px;
background:rgba(255,255,255,.03);
border:1px dashed rgba(255,255,255,.12);
backdrop-filter:blur(24px);
color:#888;
line-height:1.7;
}
.empty b{
color:#fff;
display:block;
font-size:15px;
margin-bottom:6px;
}
.bottom{
position:fixed;
bottom:14px;
left:14px;
right:14px;
max-width:452px;
margin:0 auto;
height:62px;
display:flex;
justify-content:space-around;
align-items:center;
background:rgba(16,16,20,.55);
backdrop-filter:blur(32px);
border:1px solid rgba(255,255,255,.11);
border-radius:24px;
z-index:200;
}
.bottom button{
width:44px;
height:44px;
border-radius:14px;
border:none;
background:transparent;
color:#8e8e8e;
font-size:26px;
}
.bottom button.active{
color:#fff;
background:rgba(255,255,255,.09);
}
.bottom img{
width:26px;
height:26px;
border-radius:50%;
}
#profileFeed{
display:none;
}
.pHead{
display:flex;
gap:12px;
align-items:center;
padding:16px;
}
.pHead .ring{
width:84px;
height:84px;
}
.stat{
display:flex;
gap:24px;
flex:1;
justify-content:space-around;
text-align:center;
}
.stat b{
display:block;
font-size:16px;
}
.stat small{
color:#888;
font-size:12px;
}
</style>
</head>
<body>

<div class="top">
<button class="btn" id="addBtn">+</button>
<div class="logo">InstaPro 👑</div>
<button class="btn" id="heartBtn">♡</button>
</div>

<div class="stories">
<div class="story" id="yourStory">
<div class="ring">
<img src="https://cdn-icons-png.flaticon.com/512/149/149071
