<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>INTUBE 💎</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#050507;color:#fff;overflow-x:hidden}
::-webkit-scrollbar{display:none}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(600px at 20% 10%, rgba(120,40,200,0.14), transparent 80%), #000}
.glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,0.12)}
#app{min-height:100vh;padding-bottom:90px}

/* TOP BAR */
.topBar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:rgba(10,10,12,0.85);backdrop-filter:blur(30px);border-bottom:1px solid rgba(255,255,255,0.08)}
.logo{font-weight:800;font-size:21px;letter-spacing:2.5px;background:linear-gradient(90deg,#feda75,#d62976,#4f5bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topBtns{display:flex;gap:10px}
.iBtn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer}
.iBtn svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.7}

/* STORIES */
#stories{display:flex;gap:16px;padding:14px 14px;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,0.06)}
.story{min-width:68px;display:flex;flex-direction:column;align-items:center;gap:6px}
.storyRing{width:66px;height:66px;border-radius:50%;padding:2.5px;display:flex;align-items:center;justify-content:center}
.ring-active{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.ring-none{background:rgba(255,255,255,0.14)}
.storyRing img{width:100%;height:100%;border-radius:50%;border:3px solid #0a0a0c;object-fit:cover;background:#222}
.story small{font-size:11px;color:#ccc}

/* FEED - PURE DESIGN */
#feed{max-width:520px;margin:0 auto}
.post{margin:14px 12px;background:rgba(20,20,24,0.75);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.09);border-radius:22px;overflow:hidden}
.postHead{display:flex;align-items:center;gap:10px;padding:12px 14px}
.postHead img{width:32px;height:32px;border-radius:50%;background:#222}
.postHead.name{font-size:13.5px;font-weight:600;line-height:1.1}
.postHead.loc{font-size:11px;color:#8a8a9a}
.postHead.more{margin-left:auto;background:none;border:none;color:#fff}
.postHead.more svg{width:18px;height:18px;fill:#fff}
.postMedia{width:100%;aspect-ratio:1;background:#111;display:block}
.postActs{display:flex;align-items:center;gap:16px;padding:12px 14px}
.postActs button{background:none;border:none;cursor:pointer}
.postActs button svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.6}
.postActs.right{margin-left:auto}

/* SCREENS - HIDDEN UI ONLY */
.screen{position:fixed;inset:0;z-index:90;background:#050507;display:none;overflow-y:auto;padding:60px 0 90px}
.screen.active{display:block}
.sHead{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;padding:0 16px;background:rgba(10,10,12,0.9);backdrop-filter:blur(30px);border-bottom:1px solid rgba(255,255,255,0.08);z-index:91}
.sHead h2{font-size:16px;font-weight:600}

/* BOTTOM NAV - GLASS */
.bottomNav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:94%;max-width:430px;display:flex;justify-content:space-between;padding:8px;border-radius:100px;z-index:100;background:rgba(18,18,22,0.82);backdrop-filter:blur(40px) saturate(200%);border:1px solid rgba(255,255,255,0.14);box-shadow:0 12px 40px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.1)}
.bottomNav button{background:none;border:none;color:#6e6e84;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 16px;border-radius:100px;cursor:pointer;transition:0.2s}
.bottomNav button.active{color:#fff;background:rgba(255,255,255,0.12)}
.bottomNav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7}
.bottomNav button.active svg{fill:currentColor}
.bottomNav button span{font-size:9px;font-weight:500}

/* MODAL */
#uploadModal,#storyModal{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(16px);display:flex;align-items:flex-end;justify-content:center;z-index:2000}
#uploadModal[hidden],#storyModal[hidden]{display:none!important}
.uploadCard{width:100%;max-width:520px;padding:22px 18px 30px;border-radius:28px 28px 0 0;background:rgba(24,24,28,0.95);border:1px solid rgba(255,255,255,0.13);display:flex;flex-direction:column;gap:12px}
.uploadCard h3{text-align:center;font-size:15px}
.uploadCard input{padding:13px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff;outline:none}
.uploadCard button{padding:13px;border-radius:100px;border:none;font-weight:600}
#uploadBtn{background:#fff;color:#000}
#closeUploadModal{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.12)}
</style>
</head>
<body>

<div id="app">
  <!-- TOP BAR - ALL BUTTONS -->
  <header class="topBar">
    <div class="logo">INTUBE</div>
    <div class="topBtns">
      <button class="iBtn" id="searchBtn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M21 21l-4.3-4.3"/></svg></button>
      <button class="iBtn" id="notifBtn"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
      <button class="iBtn" id="chatBtn"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </div>
  </header>

  <!-- STORIES -->
<section id="stories">
  <div id="myStoryItem" class="story">
    <div id="myStoryRing" class="storyRing ring-none" style="position:relative">
      <img id="myStoryImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
      <div style="position:absolute;bottom:-1px;right:-1px;width:20px;height:20px;background:#fff;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid #0c0c12;font-size:12px">+</div>
    </div>
    <small id="myStoryText">Your Story</small>
  </div>
  <div id="storiesList" style="display:flex;gap:14px"></div>
</section>
<input type="file" id="storyFile" accept="image/*,video/*" hidden>

  <!-- FEED - ONLY DESIGN, NO LIKES COUNT -->
  <main id="feed">
    <div class="post">
      <div class="postHead">
        <img>
        <div><div class="name">Username</div><div class="loc">Location</div></div>
        <button class="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"/><circle cx="19.5" cy="12" r="1.5"/><circle cx="4.5" cy="12" r="1.5"/></svg></button>
      </div>
      <div class="postMedia"></div>
      <div class="postActs">
        <button><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
        <button><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H12L8 21v-3.5A8.5 8.5 0 0 1 21 11.5z"/></svg></button>
        <button><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
        <button class="right"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
      </div>
    </div>
  </main>

  <!-- ALL INSTAGRAM SCREENS - UI ONLY -->
  <div id="exploreScreen" class="screen"><div class="sHead"><h2>Search & Explore</h2></div></div>
  <div id="reelsScreen" class="screen"><div class="sHead"><h2>Reels</h2></div></div>
  <div id="chatScreen" class="screen"><div class="sHead"><h2>Messages</h2></div></div>
  <div id="notifScreen" class="screen"><div class="sHead"><h2>Notifications</h2></div></div>
  <div id="profileScreen" class="screen"><div class="sHead"><h2>Profile</h2></div></div>

  <!-- BOTTOM NAV - ALL 5 BUTTONS INSTA STYLE -->
  <nav class="bottomNav">
    <button class="active" id="homeBtn"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></button>
    <button id="exploreBtn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Search</span></button>
    <button id="postBtn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><span>Post</span></button>
    <button id="reelsBtn"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg><span>Reels</span></button>
    <button id="profileBtn"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></button>
  </nav>
</div>

<div id="uploadModal" hidden><div class="uploadCard"><h3>Create Post</h3><input type="text" id="caption" placeholder="Write caption..."><input type="file" id="mediaFile" accept="image/*,video/*"><button id="uploadBtn">Share</button><button id="closeUploadModal">Cancel</button></div></div>
<div id="storyModal" hidden><div class="uploadCard"><h3>Add Story</h3><input type="file" id="storyFile"><button id="uploadStoryBtn">Share</button><button id="closeStoryModal">Cancel</button></div></div>

<input type="file" id="storyFileInput" hidden>
<div id="storyViewer" hidden></div>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="feed.js"></script>
<script type="module" src="stories.js"></script>
<script type="module" src="upload.js"></script>
<script>
document.getElementById('postBtn').onclick=()=>document.getElementById('uploadModal').hidden=false;
document.getElementById('closeUploadModal').onclick=()=>document.getElementById('uploadModal').hidden=true;
document.querySelectorAll('.bottomNav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.bottomNav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));
</script>
</body>
</html>
