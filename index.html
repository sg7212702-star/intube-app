<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>INTUBE • Pro Max</title>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;overflow:hidden}
body::before{
content:'';position:fixed;inset:0;z-index:-2;
background:
radial-gradient(900px at 20% 0%, rgba(168,85,247,0.28), transparent 60%),
radial-gradient(800px at 90% 10%, rgba(236,72,153,0.22), transparent 60%),
radial-gradient(700px at 50% 100%, rgba(56,189,248,0.18), transparent 60%),
#000
}
#app{height:100dvh;display:flex;flex-direction:column}
.topBar{
height:58px;display:flex;align-items:center;justify-content:space-between;
padding:0 16px;background:rgba(16,16,20,0.78);backdrop-filter:blur(28px);
border-bottom:1px solid rgba(255,255,255,0.07);position:sticky;top:0;z-index:50
}
.logo{font-family:'Grand Hotel',cursive;font-size:32px;background:linear-gradient(90deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topIcons{display:flex;gap:18px;align-items:center}
.topIcons button{background:none;border:none;color:#fff;font-size:22px;position:relative}
.badge{position:absolute;top:-4px;right:-6px;background:#ff3040;color:#fff;font-size:9px;padding:2px 5px;border-radius:10px;font-weight:700}
.main{flex:1;overflow-y:auto;scrollbar-width:none}.main::-webkit-scrollbar{display:none}
.screen{display:none;min-height:100%;padding-bottom:90px}.screen.active{display:block}
.stories{display:flex;gap:14px;padding:14px 12px;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,0.06)}.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 66px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{width:66px;height:66px;border-radius:50%;padding:2.8px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.ring img{width:100%;height:100%;border-radius:50%;border:3px solid #000;object-fit:cover;background:#111}
.story span{font-size:11px;color:#c9c9d1}
.post{background:rgba(16,16,20,0.65);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:12px}
.pHead{padding:12px 14px;display:flex;align-items:center;gap:10px}.pHead img{width:34px;height:34px;border-radius:50%}.pHead b{font-size:13.5px}.pHead small{font-size:11px;color:#8a8a9a;display:block}
.pImg{width:100%;aspect-ratio:1/1;background:#0f0f12;object-fit:cover;display:block}
.pActions{display:flex;gap:16px;padding:12px 14px 6px;font-size:22px;align-items:center}
.pActions .right{margin-left:auto}
.pLike{font-weight:600;font-size:13.5px;padding:0 14px}
.pCaption{padding:4px 14px 4px;font-size:13.5px;color:#d6d6de}.pCaption b{color:#fff;margin-right:6px}
.pTime{padding:0 14px 14px;font-size:11px;color:#777}
.profileWrap{padding:0}
.pStatsRow{padding:16px;display:flex;gap:18px;align-items:center}
.pAvatar{width:88px;height:88px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5)}
.pAvatar img{width:100%;height:100%;border-radius:50%;border:3px solid #000;object-fit:cover;background:#222}
.stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:18px}.stats span{font-size:12px;color:#a1a1b0}
.pInfo{padding:0 16px}.pInfo h3{font-size:15px;font-weight:700}.pInfo p{font-size:13.5px;color:#d0d0d8;margin-top:4px;white-space:pre-wrap;line-height:1.35}.pInfo small{font-size:12px;color:#6f6f80}
.pBtns{padding:14px 16px;display:flex;gap:8px}
.pBtns button{flex:1;padding:9px 0;background:rgba(255,255,255,0.13);border:none;border-radius:9px;color:#fff;font-weight:600;font-size:13.5px;backdrop-filter:blur(10px)}
.pBtns button.primary{background:#fff;color:#000}
.tabs{display:flex;border-top:1px solid rgba(255,255,255,0.08);margin-top:6px}
.tabs button{flex:1;padding:12px 0;background:none;border:none;border-top:1.5px solid transparent;color:#6e6e84;font-size:20px}
.tabs button.active{border-top-color:#fff;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid div{aspect-ratio:1;background:#111;overflow:hidden;position:relative}
.grid img{width:100%;height:100%;object-fit:cover}
.grid .overlay{position:absolute;inset:0;background:linear-gradient(transparent 60%, rgba(0,0,0,0.6));display:flex;align-items:flex-end;padding:6px;gap:8px;font-size:12px;font-weight:600}
.bottomNav{position:fixed;bottom:0;left:0;right:0;height:86px;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;background:rgba(8,8,10,0.84);backdrop-filter:blur(30px);border-top:1px solid rgba(255,255,255,0.08);z-index:100}
.bottomNav button{background:none;border:none;color:#7a7a86;font-size:26px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:16px;position:relative}
.bottomNav button.active{color:#fff}.bottomNav button img{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,0.25)}
.modal{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0.68);backdrop-filter:blur(24px);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:100%;max-width:520px;background:rgba(22,22,26,0.96);border:1px solid rgba(255,255,255,0.1);border-top-left-radius:26px;border-top-right-radius:26px;padding:18px 16px 28px;max-height:88dvh;overflow-y:auto}
.sheetHandle{width:36px;height:4px;background:rgba(255,255,255,0.25);border-radius:100px;margin:0 auto 16px}
.sheet h3{text-align:center;font-size:16px;margin-bottom:14px}
.sheet input,.sheet textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff;outline:none;margin-bottom:10px}
.sheet button.full{width:100%;padding:13px;border-radius:100px;border:none;background:#fff;color:#000;font-weight:700;margin-top:8px}
.iconBtn{width:100%;display:flex;align-items:center;gap:14px;padding:14px;background:rgba(255,255,255,0.06);border:none;border-radius:14px;color:#fff;margin-bottom:10px;font-size:14px;text-align:left}
</style>
</head>
<body>
<div id="app">
<div class="topBar">
<div class="logo">INTUBE</div>
<div class="topIcons">
<button id="addPostBtn">＋</button>
<button id="notifBtn">♡<span class="badge">3</span></button>
<button id="msgBtn">✈</button>
</div>
</div>

<div class="main">
<div id="homeScreen" class="screen active">
<div class="stories" id="storiesRow">
<div class="story"><div class="ring"><img id="myStoryImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png"></div><span>Your Story</span></div>
</div>
<div id="feed"></div>
</div>

<div id="searchScreen" class="screen">
<div style="padding:12px"><div style="background:rgba(255,255,255,0.08);border-radius:12px;padding:12px 14px;color:#888">🔍 Search users, tags...</div></div>
<div class="grid" id="searchGrid"></div>
</div>

<div id="reelsScreen" class="screen">
<div id="reelsFeed" style="height:100%"></div>
</div>

<div id
