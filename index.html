<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUBE - Real YouTube</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
 "imports": {
  "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
  "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
  "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
 }
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;overflow-x:hidden}
.top{position:sticky;top:0;background:rgba(0,0,0,.9);backdrop-filter:blur(15px);display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #222;z-index:100}
#feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:16px}
.card{background:#111;border:1px solid #222;border-radius:20px;overflow:hidden}
.card video,.card img{width:100%;height:220px;object-fit:cover}
.info{padding:12px}
#loginScreen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:200}
.loginCard{background:#111;padding:35px;border-radius:25px;border:1px solid #222;text-align:center;width:90%;max-width:380px}
.loginCard button{background:#fff;color:#000;border:none;padding:14px;width:100%;border-radius:30px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;margin-top:20px}
#uploadModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center}
.upload-btn{position:fixed;bottom:20px;right:20px;background:#ff004f;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;z-index:50}
</style>
</head>
<body>

<div id="loginScreen">
<div class="loginCard">
<h1>INTUBE 🔥</h1><p style="color:#888;margin-top:8px">Real YouTube Clone</p>
<button id="googleBtn"><img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20"> Login with Google</button>
<p id="loginMsg" style="color:#ff004f;margin-top:12px;font-size:13px"></p>
</div>
</div>

<div class="top">
<b>INTUBE</b>
<input id="search" placeholder="Search..." style="flex:1;background:#151515;border:1px solid #222;padding:10px 16px;border-radius:25px;color:#fff">
<div id="profilePic" style="width:38px;height:38px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer" onclick="logout()">👤</div>
</div>

<div id="feed">Loading...</div>
<div class="upload-btn" onclick="document.getElementById('uploadModal').style.display='flex'">+</div>

<div id="uploadModal"><div style="background:#111;padding:20px;border-radius:20px;width:90%;max-width:400px;border:1px solid #222">
<h3>Upload</h3>
<input id="vTitle" placeholder="Title" style="width:100%;margin:12px 0;padding:10px;border-radius:12px;background:#000;border:1px solid #222;color:#fff">
<input type="file" id="vFile" accept="video/*,image/*" style="width:100%">
<button id="upBtn" style="width:100%;margin-top:12px;background:#ff004f;border:none;padding:12px;border-radius:20px;color:#fff;font-weight:bold">Upload</button>
<button onclick="document.getElementById('uploadModal').style.display='none'" style="width:100%;margin-top:8px;background:#222;border:none;padding:8px;border-radius:20px;color:#fff">Cancel</button>
<p id="upStatus" style="text-align:center;margin-top:10px;color:#888"></p>
</div></div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "firebase/auth";
import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "firebase/firestore";

// Tera config
const firebaseConfig = {
  apiKey: "AIzaSyDibgzp64G1QB7Pma-7Zx4yMAV06go8cNU",
  authDomain: "intube-61cca.firebaseapp.com",
  projectId: "intube-61cca",
  storageBucket: "intube-61cca.firebasestorage.app",
  messagingSenderId: "627409965607",
  appId: "1:627409965607:web:a1d71800d812fe668b7402"
};

const CLOUD_NAME = "dtzv2wy4z";
const UPLOAD_PRESET = "intube_preset";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// REAL FIX 1: Persistence set karo
setPersistence(auth, browserLocalPersistence);

// REAL FIX 2: Page load pe Redirect result check karo
getRedirectResult(auth).then((result)=>{
  if(result?.user){
    console.log("Redirect Login Success:", result.user.email);
  }
}).catch(e=>{
  document.getElementById('loginMsg').innerText = e.message;
  console.error("Redirect Error:", e);
});

let currentUser = null;

// REAL FIX 3: Hybrid Login (Popup fail to Redirect)
document.getElementById('googleBtn').onclick = async ()=>{
  const msg = document.getElementById('loginMsg');
  msg.innerText = "Google khul raha hai...";
  try{
    await signInWithPopup(auth, provider);
  }catch(err){
    console.warn("Popup blocked, using Redirect", err.code);
    if(err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request'){
      msg.innerText = "Popup block hai, redirect kar rahe hai...";
      await signInWithRedirect(auth, provider);
    }else{
      msg.innerText = err.message;
    }
  }
};

onAuthStateChanged(auth, (user)=>{
 if(user){
  currentUser=user;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('profilePic').innerHTML=`<img src="${user.photoURL}" style="width:38px;height:38px;border-radius:50%">`;
  loadVideos();
 }else{
  document.getElementById('loginScreen').style.display='flex';
  loadVideos();
 }
});

window.logout=()=>signOut(auth).then(()=>location.reload());

async function loadVideos(){
 try{
  const snap = await getDocs(query(collection(db,"videos"), orderBy("time","desc")));
  let html="";
  snap.forEach(d=>{
    let v=d.data();
    html+=`<div class="card">${v.url.includes('video')?`<video src="${v.url}" controls></video>`:`<img src="${v.url}">`}<div class="info"><b>${v.title}</b><p style="color:#888;font-size:13px">${v.userName}</p></div></div>`;
  });
  document.getElementById('feed').innerHTML = html || "<p style='padding:20px;color:#888'>Koi video nahi</p>";
 }catch(e){ document.getElementById('feed').innerHTML = e.message; }
}

document.getElementById('upBtn').onclick= async ()=>{
 let file=document.getElementById('vFile').files[0];
 let title=document.getElementById('vTitle').value;
 if(!file||!title) return alert("Title + file chahiye");
 document.getElementById('upStatus').innerText="Uploading...";
 let fd=new FormData(); fd.append('file', file); fd.append('upload_preset', UPLOAD_PRESET);
 try{
  let res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,{method:'POST',body:fd});
  let data=await res.json();
  if(!data.secure_url) throw new Error(data.error?.message||'Preset error');
  await addDoc(collection(db,"videos"),{ title, url:data.secure_url, userName:currentUser.displayName, userEmail:currentUser.email, userPhoto:currentUser.photoURL, time:new Date() });
  document.getElementById('upStatus').innerText="Done 🔥";
  setTimeout(()=>{document.getElementById('uploadModal').style.display='none'; loadVideos();},1000);
 }catch(err){ document.getElementById('upStatus').innerText="Failed: "+err.message; }
}
</script>
</body>
</html>
