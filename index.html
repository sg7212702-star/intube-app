<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InstaPro</title>
<link rel="stylesheet" href="./style.css">
<style>
body{background:#0e0014;color:#fff;margin:0;font-family:system-ui}
#topBar{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #2a0a2a;position:sticky;top:0;background:#0e0014;z-index:10}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,#ff4d9d,#ff8a5b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{width:42px;height:42px;border-radius:50%;border:1px solid #333;background:#1a0a1a;color:#fff}
.view{display:none;min-height:85vh;padding-bottom:90px}.view.active{display:block}
.postCard{background:#1a0e1e;border-radius:18px;margin:12px auto;overflow:hidden;border:1px solid #2a1630;width:calc(100% - 24px);max-width:600px}
#bottomBar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:10px;background:#0e0014;border-top:1px solid #2a0a2a;z-index:50}
#bottomBar button{width:64px;height:52px;border-radius:18px;border:none;background:#1c0e1e;color:#fff;font-size:22px}
#bottomBar button.active{background:#2a0a2a;box-shadow:0 0 12px #ff4d9d}
.p-header{display:flex;gap:16px;padding:16px;align-items:center}
.p-avatar{width:86px;height:86px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.p-avatar img{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #0e0014}
.p-stats{display:flex;flex:1;justify-content:space-around;text-align:center}
#storyBar{display:flex;gap:14px;overflow-x:auto;padding:12px;border-bottom:1px solid #222;scrollbar-width:none}
#storyBar::-webkit-scrollbar{display:none}
.sItem{min-width:66px;text-align:center}.sPlus{width:62px;height:62px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:28px;border:1px dashed #555}
.sRing{width:62px;height:62px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.sRing img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #000}
.sName{font-size:11px;margin-top:4px}
.empty{padding:60px;text-align:center;opacity:.4}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9998}
#createSheet{display:none;position:fixed;left:0;right:0;bottom:0;background:#1e1022;border-radius:22px 22px 0 0;padding:18px;z-index:9999}
#profileMenuSheet{display:none;position:fixed;left:0;right:0;bottom:0;background:#1e1235;padding:20px;z-index:10000;border-radius:20px 20px 0 0}
#fileInput,#storyInput{position:fixed;left:-9999px;width:1px;height:1px;opacity:0}
*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}
</style></head><body>

<div id="topBar"><button id="addBtn" class="btn">+</button><div class="logo">InstaPro 👑</div><button id="notifBtn" class="btn">♡</button></div>

<div id="view-home" class="view active">
  <div id="storyBar">
    <div class="sItem" id="yourStoryBtn"><div class="sPlus">+</div><div class="sName">Your Story</div></div>
    <div id="otherStories" style="display:flex;gap:14px"></div>
  </div>
  <div id="feed"><div class="empty">Loading feed...</div></div>
</div>

<div id="view-reels" class="view"><div id="reelsFeed"><div class="empty">Loading reels...</div></div></div>
<div id="view-search" class="view"><div style="padding:12px"><input id="searchIn" placeholder="Search..." style="width:100%;padding:14px;border-radius:12px;background:#1a0e1e;border:1px solid #333;color:#fff"></div><div id="searchRes"></div></div>
<div id="view-notif" class="view"><div style="padding:16px">Notifications</div></div>

<div id="view-profile" class="view">
  <div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center"><b id="profileTopName">_</b><div id="menuBtn" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer">☰</div></div>
  <div class="p-header"><div class="p-avatar"><img id="profilePic" src="https://i.pravatar.cc/150?u=new"></div><div class="p-stats"><div><b id="postsCount">0</b><br><span style="font-size:12px;opacity:.6">Posts</span></div><div><b>0</b><br><span style="font-size:12px;opacity:.6">Followers</span></div><div><b>0</b><br><span style="font-size:12px;opacity:.6">Following</span></div></div></div>
  <div style="padding:0 16px 4px"><b id="nameText">New User</b> <span id="categoryText" style="font-size:12px;opacity:.6;background:#2a2a3a;padding:2px 6px;border-radius:10px">Creator</span><div id="bioText" style="margin-top:6px">Welcome to InstaPro ✨</div></div>
  <div style="display:flex;gap:8px;padding:0 16px 16px"><button id="editBtn" style="flex:1;padding:10px;border-radius:8px;border:none;background:#2a2a3a;color:#fff;font-weight:600">Edit profile</button><button id="shareBtn" style="flex:1;padding:10px;border-radius:8px;border:none;background:#2a2a3a;color:#fff;font-weight:600">Share profile</button></div>
  <div style="display:flex;border-top:1px solid #222"><button id="tabPosts" style="flex:1;padding:12px;background:transparent;border:none;color:#fff;font-weight:700;opacity:1;border-bottom:2px solid #fff">POSTS</button><button id="tabReels" style="flex:1;padding:12px;background:transparent;border:none;color:#fff;opacity:.5;font-weight:700">REELS</button></div>
  <div id="postsGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px"></div><div id="reelsGrid" style="display:none;grid-template-columns:1fr 1fr 1fr;gap:2px"></div>
</div>

<!-- SHEETS - SINGLE TIME ONLY -->
<div id="overlay"></div>
<div id="createSheet"><div style="width:40px;height:5px;background:#444;border-radius:10px;margin:0 auto 12px"></div><div style="display:flex;justify-content:space-between;padding-bottom:12px"><b>Create</b><button id="closeSheet" style="background:#333;color:#fff;border:none;width:30px;height:30px;border-radius:50%">✕</button></div><button id="optPost" style="width:100%;padding:14px;background:#222;color:#fff;border:1px solid #333;border-radius:12px;margin-bottom:10px;text-align:left">📷 New Post</button><button id="optReel" style="width:100%;padding:14px;background:#222;color:#fff;border:1px solid #333;border-radius:12px;margin-bottom:10px;text-align:left">🎬 New Reel</button><button id="optStory" style="width:100%;padding:14px;background:#222;color:#fff;border:1px solid #333;border-radius:12px;text-align:left">⭕ New Story</button></div>

<div id="profileMenuSheet"><div style="width:40px;height:4px;background:#555;margin:0 auto 15px;border-radius:10px"></div><div id="mSettings" style="padding:14px;background:#2a1a4a;border-radius:12px;margin:8px 0">⚙️ Settings and privacy</div><div style="padding:14px;background:#2a1a4a;border-radius:12px;margin:8px 0">📊 Your activity</div><div id="mLogout" style="padding:14px;background:#2a1a4a;border-radius:12px;margin:8px 0;color:#ff5a5b">🚪 Log out</div><div onclick="document.getElementById('profileMenuSheet').style.display='none';document.getElementById('overlay').style.display='none'" style="padding:14px;background:#333;border-radius:12px;text-align:center;margin-top:10px">Cancel</div></div>

<div id="subPage" style="display:none;position:fixed;inset:0;background:#0e0e14;z-index:10001;overflow:auto"><div style="display:flex;gap:12px;padding:14px;border-bottom:1px solid #222;position:sticky;top:0;background:#0e0e14"><button id="subBack" style="background:none;border:none;color:#fff;font-size:22px">←</button><b id="subTitle">Settings</b></div><div id="subContent" style="padding:16px"></div></div>

<input id="fileInput" type="file" accept="image/*,video/*"><input id="storyInput" type="file" accept="image/*,video/*">

<div id="bottomBar"><button id="homeBtn" class="active">⌂</button><button id="reelsBtn">▶</button><button id="createBtn">+</button><button id="searchBtn">⌕</button><button id="profileBtn">◯</button></div>

<!-- EDITOR - SINGLE TIME -->
<div id="instaEditor" style="display:none;position:fixed;inset:0;background:#000;z-index:10002;flex-direction:column">
<div style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:rgba(0,0,0,.85);border-bottom:1px solid rgba(255,255,255,.12)"><button onclick="closeEditor()" style="width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff">✕</button><span style="color:#fff;font-weight:800">PRO EDITOR • GLASS</span><button onclick="goToCaption()" style="background:#0095f6;color:#fff;font-weight:800;padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.3)">Next</button></div>
<div id="editArea" style="flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden"><img id="editorImage" style="max-width:100%;max-height:100%;object-fit:contain"><div id="textOverlays" style="position:absolute;inset:0;pointer-events:none;z-index:2"></div><canvas id="editorCanvas" style="display:none"></canvas></div>
<div style="background:rgba(20,20,20,.92);border-top:1px solid rgba(255,255,255,.12)"><div style="display:flex"><button id="tabFilter" onclick="showTab('filter')" style="flex:1;background:rgba(255,255,255,.12);border:none;color:#fff;padding:14px 0;font-weight:800;border-bottom:2px solid #fff">FILTERS</button><button id="tabEdit" onclick="showTab('edit')" style="flex:1;background:transparent;border:none;color:rgba(255,255,255,.5);padding:14px 0;font-weight:700">EDIT</button></div><div id="filterRow" style="display:flex;gap:12px;overflow-x:auto;padding:16px"><div onclick="applyFilter('none',this)" style="min-width:70px;text-align:center"><div style="width:64px;height:64px;border-radius:14px;background:rgba(255,255,255,.2);border:2px solid #fff;display:flex;align-items:center;justify-content:center">🖼️</div><p style="font-size:10px;margin-top:6px">Normal</p></div><div onclick="applyFilter('grayscale(100%)',this)" style="min-width:70px;text-align:center"><div style="width:64px;height:64px;border-radius:14px;background:#888;display:flex;align-items:center;justify-content:center">⚫</div><p style="font-size:10px;margin-top:6px">Mono</p></div><div onclick="applyFilter('sepia(0.9)',this)" style="min-width:70px;text-align:center"><div style="width:64px;height:64px;border-radius:14px;background:#b48c64;display:flex;align-items:center;justify-content:center">📜</div><p style="font-size:10px;margin-top:6px">Sepia</p></div><div onclick="applyFilter('contrast(140%) saturate(140%)',this)" style="min-width:70px;text-align:center"><div style="width:64px;height:64px;border-radius:14px;background:#00c8ff;display:flex;align-items:center;justify-content:center">🌈</div><p style="font-size:10px;margin-top:6px">Vivid</p></div></div><div id="editRow" style="display:none;padding:16px;gap:10px;flex-wrap:wrap"><button onclick="changeRatio()" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);padding:10px 18px;border-radius:20px">✂️ Crop</button><button onclick="rotateImg()" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);padding:10px 18px;border-radius:20px">🔄 Rotate</button><button onclick="addText()" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);padding:10px 18px;border-radius:20px">Aa Text</button></div></div>
<div id="captionPage" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,.95);z-index:10003;flex-direction:column"><div style="display:flex;justify-content:space-between;padding:14px"><button onclick="backToEdit()" style="width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff">←</button><b>New Post</b><button onclick="postNow()" style="background:#0095f6;color:#fff;padding:8px 20px;border-radius:20px;border:none">Share</button></div><div style="margin:16px;padding:16px;display:flex;gap:12px;background:rgba(255,255,255,.08);border-radius:16px"><img id="captionThumb" style="width:64px;height:64px;border-radius:12px;object-fit:cover"><textarea id="captionInput" placeholder="Write caption... ✨" style="flex:1;background:transparent;border:none;color:#fff;outline:none;resize:none;height:100px"></textarea></div></div>
</div>

<!-- SIRF DESIGN - LOGIC ALAG FILE ME -->
<script type="module" src="./firebase.js"></script>
<script type="module" src="./menu.js"></script>
<script type="module" src="./stories.js"></script>
<script type="module" src="./feed.js"></script>
<script type="module" src="./reels.js"></script>
<script type="module" src="./profile.js"></script>
<script type="module" src="./upload.js"></script>
<script type="module" src="./editor.js"></script>
<script type="module" src="./search.js"></script>
</body></html>
