<header class="topGlass">

<!-- HOME PAGE WRAPPER - Ye main fix hai -->
<div id="homePage" class="page" style="display:block;">
  <div class="storyGlass">
    <div class="sItem"><div class="sRing add" id="addStoryBtn"><span>+</span></div><p>Your story</p></div>
    <div id="otherStories" style="display:flex;gap:12px"></div>
  </div>
  <main id="feed"></main>
</div>
  <!-- Instagram Style Comments Panel -->
<div id="commentsPanel" class="comments-panel" style="display:none;">
  <div class="comments-backdrop" data-close-comments="true"></div>

  <section class="comments-sheet" role="dialog" aria-modal="true" aria-labelledby="commentsTitle">
    <div class="comments-handle"></div>

    <header class="comments-header">
      <h3 id="commentsTitle">Comments</h3>
      <button type="button" id="closeCommentsBtn" aria-label="Close comments">✕</button>
    </header>

    <div id="commentsList" class="comments-list">
      <p class="comments-loading">Loading comments...</p>
    </div>

    <form id="commentForm" class="comment-form">
      <img id="commentCurrentUserAvatar" src="https://www.gravatar.com/avatar/?d=mp" alt="Your profile">

      <input
        id="commentInput"
        type="text"
        placeholder="Add a comment..."
        maxlength="2000"
        autocomplete="off"
        required
      >

      <button id="sendCommentBtn" type="submit">Post</button>
    </form>
  </section>
</div>

<!-- EXPLORE / SEARCH PAGE - Niche Search se khulega -->
<div id="explorePage" class="page" style="display:none; padding-top:60px; min-height:100vh; padding-bottom:90px; background:#000;">
  <div style="margin:10px; padding:12px 14px; border-radius:12px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); display:flex; gap:8px">
    <span>🔍</span><input id="searchInput" placeholder="Search..." style="flex:1; background:transparent; border:0; color:#fff; outline:none">
  </div>
  <div id="exploreGrid" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:2px; padding:6px;"></div>
  <div id="exploreEmpty" style="text-align:center; opacity:.5; padding:40px">No posts yet - Pehla post karo!</div>
</div>

<!-- REELS PAGE -->
<div id="reelsPage" class="page" style="display:none; padding-top:60px; min-height:100vh; padding-bottom:90px; background:#000;">
  <div style="padding:12px"><b>Reels</b> <span style="opacity:.5; font-size:12px">(Posts as Reels - No Billing)</span></div>
  <div id="reelsGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:6px;"></div>
</div>

<!-- CHAT PAGE - Real Time -->
<div id="chatPage" class="page" style="display:none; padding-top:60px; min-height:100vh; padding-bottom:90px; background:#000; flex-direction:column;">
  <div style="padding:12px; border-bottom:1px solid rgba(255,255,255,.1)"><b>Messages</b> <span style="opacity:.5; font-size:12px">Real Time Firestore</span></div>
  <div id="chatMsgs" style="flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; height:60vh;"></div>
  <div style="display:flex; gap:8px; padding:10px; position:fixed; bottom:75px; left:0; right:0; background:#000; border-top:1px solid rgba(255,255,255,.1)">
    <input id="chatInput" placeholder="Message..." style="flex:1; padding:12px; border-radius:20px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1); color:#fff">
    <button id="chatSend" style="padding:10px 18px; border-radius:20px; border:0; background:#fff; color:#000; font-weight:600">Send</button>
  </div>
</div>

<!-- PROFILE PAGE -->
<div id="profilePage" class="page" style="display:none; padding-top:60px; min-height:100vh; padding-bottom:90px; background:#000;">
  <div style="padding:20px; text-align:center">
    <div style="width:86px; height:86px; border-radius:50%; background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); margin:0 auto 12px; padding:3px"><img id="myAvatarLarge" src="https://i.pravatar.cc/100?img=12" style="width:100%; height:100%; border-radius:50%; border:3px solid #000"></div>

    <p style="opacity:.5; font-size:12px; margin-top:8px">Real time - Firestore se 0 se start</p>
  </div>
  <div id="myPosts" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:2px; padding:6px;"></div>
</div>
