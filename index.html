<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>INTUBE - Real Public</title>
<script type="importmap">
{ "imports": { "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js", "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js" } }
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;overflow:hidden}
#feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{height:100vh;width:100%;position:relative;scroll-snap-align:start;background:#111}
.card video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;bottom:0;left:0;right:0;padding:20px 15px 35px;background:linear-gradient(transparent,rgba(0,0,0,0.9))}
.top{position:fixed;top:0;left:0;right:0;padding:12px 15px;display:flex;justify-content:space-between;z-index:10;background:linear-gradient(rgba(0,0,0,0.7),transparent)}
.btn{background:#ff004f;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-weight:bold;text-decoration:none}
</style>
</head>
<body>
<div class="top">
<b>INTUBE 🔥 REAL</b>
<a href="upload.html" class="btn">+ Upload</a>
</div>
<div id="feed"><p style="text-align:center;padding-top:50vh">Loading real videos...</p></div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, query, orderBy, onSnapshot } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyDibgzp64G1QB7Pma-7Zx4yMAV06go8cNU",
  authDomain: "intube-61cca.firebaseapp.com",
  projectId: "intube-61cca",
  storageBucket: "intube-61cca.firebasestorage.app",
  messagingSenderId: "627409965607",
  appId: "1:627409965607:web:a1d71800d812fe668b7402"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const feed = document.getElementById('feed');
const q = query(collection(db, "videos"), orderBy("timestamp", "desc"));

onSnapshot(q, (snap) => {
  if(snap.empty){
    feed.innerHTML = "<p style='text-align:center;padding-top:50vh'>Abhi koi video nahi hai<br>Be first to upload!</p>";
    return;
  }
  feed.innerHTML = "";
  snap.forEach(d => {
    const v = d.data();
    feed.innerHTML += `
      <div class="card">
        <video src="${v.videoUrl}" loop autoplay muted playsinline onclick="this.muted=false; this.paused ? this.play() : this.pause()"></video>
        <div class="overlay">
          <b>@${v.userName || 'User'}</b>
          <p>${v.caption || ''}</p>
        </div>
      </div>`;
  });
});
</script>
</body>
</html>
