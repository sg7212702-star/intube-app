  g+=`<div class="gitem" onclick="focusReel('${v.id}')"><${isV?'video muted':'img'} src="${v.url}" style="width:100%;height:100%;object-fit:cover"><${isV?'/video':''}><div style="position:absolute;bottom:3px;left:3px;font-size:9px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:10px">❤️ ${v.likes||0}</div></div>`;
 });
 feed.innerHTML=h;homeGrid.innerHTML=g;searchRes.innerHTML=g;renderProfile();attachObs();
}
window.focusReel=id=>{switchView('reels');setTimeout(()=>{const idx=vids.findIndex(v=>v.id===id);const el=document.querySelectorAll('.reel')[idx];if(el)el.scrollIntoView({behavior:'smooth'})},150)};
function attachObs(){const vidsEl=document.querySelectorAll('#feed video');const obs=new IntersectionObserver(es=>{es.forEach(e=>{const vid=e.target;const aud=vid.parentElement.querySelector('audio');if(e.isIntersecting){vid.play().catch(()=>{});if(aud&&aud.dataset.playing==='1')aud.play().catch(()=>{});}else{vid.pause();if(aud)aud.pause();}});},{threshold:.65});vidsEl.forEach(v=>obs.observe(v));}
window.toggleMusic=function(el){const reel=el.closest('.reel');const a=reel.querySelector('audio');const v=reel.querySelector('video');if(!a)return;if(a.paused){a.play();a.dataset.playing='1';if(v)v.muted=true;el.innerText='Pause';}else{a.pause();a.dataset.playing='0';el.innerText='Play';}};
window.pop=e=>{const p=e.querySelector('.pop');p.classList.add('show');setTimeout(()=>p.classList.remove('show'),700)};
async function addNotif(to,type,vid,txt){if(!cur||!to||to===cur.uid)return;await addDoc(collection(db,"notifications"),{toUserId:to,fromUserId:cur.uid,fromName:cur.displayName,fromPhoto:cur.photoURL,type,videoId:vid||'',text:txt||'',read:false,time:serverTimestamp()})}
window.toggleL=async id=>{if(!cur)return alert("Login");const vR=doc(db,"videos",id),lR=doc(db,"videos",id,"likes",cur.uid),s=await getDoc(lR);if(s.exists()){await deleteDoc(lR);await updateDoc(vR,{likes:increment(-1),likedBy:arrayRemove(cur.uid)})}else{await setDoc(lR,{uid:cur.uid,time:serverTimestamp()});await updateDoc(vR,{likes:increment(1),likedBy:arrayUnion(cur.uid)});const v=vids.find(x=>x.id===id);await addNotif(v?.userId,'like',id,'liked your reel ❤️')}};
window.toggleF=async uid=>{if(!cur)return alert("Login");if(!uid||uid===cur.uid)return;const fid=`${cur.uid}_${uid}`,fR=doc(db,"follows",fid),s=await getDoc(fR);if(s.exists()){await deleteDoc(fR);follow.delete(uid)}else{await setDoc(fR,{followerId:cur.uid,followingId:uid,time:serverTimestamp()});follow.add(uid);await addNotif(uid,'follow','','followed you 👥')}render(sortByAlgorithm(allVids));updateStats()};
window.openC=id=>{curCid=id;cmodal.classList.add('on');cmodal.style.display='flex';clist.innerHTML='Loading...';if(cUnsub)cUnsub();cUnsub=onSnapshot(query(collection(db,"videos",id,"comments"),orderBy("time","asc")),s=>{if(s.empty){clist.innerHTML="<p style='text-align:center;color:#666;padding:12px'>No comments yet</p>";return}let h="";s.forEach(d=>{const c=d.data();h+=`<div class="citem"><img src="${c.userPhoto}" style="width:24px;height:24px;border-radius:50%"><div><b>${c.userName}</b> ${c.text}</div></div>`});clist.innerHTML=h;})};window.closeC=()=>{cmodal.classList.remove('on');setTimeout(()=>cmodal.style.display='none',250);if(cUnsub)cUnsub()};
csend.onclick=async()=>{const t=cin.value.trim();if(!t||!cur||!curCid)return;cin.value="";await addDoc(collection(db,"videos",curCid,"comments"),{text:t,userName:cur.displayName,userPhoto:cur.photoURL,uid:cur.uid,time:serverTimestamp()});await updateDoc(doc(db,"videos",curCid),{comments:increment(1)});const v=vids.find(x=>x.id===curCid);await addNotif(v?.userId,'comment',curCid,`commented: ${t.slice(0,30)} 💬`)};
function startNotif(){if(!cur)return;if(nUnsub)nUnsub();nUnsub=onSnapshot(query(collection(db,"notifications"),where("toUserId","==",cur.uid),orderBy("time","desc")),s=>{let unread=0,h="";if(s.empty){nlist.innerHTML="<p style='text-align:center;color:#666;padding:16px'>No notifications</p>";badge.style.display='none';return}s.forEach(d=>{const n=d.data();if(!n.read)unread++;const ic=n.type==='like'?'❤️':n.type==='comment'?'💬':'👥';h+=`<div class="nitem ${!n.read?'unread':''}" onclick="markOne('${d.id}')"><img src="${n.fromPhoto}" style="width:30px;height:30px;border-radius:50%"><div style="flex:1"><b>${n.fromName}</b> ${n.text}<div style="font-size:10px;opacity:.5">${n.time?.toDate?n.time.toDate().toLocaleString():'now'}</div></div><div>${ic}</div></div>`});nlist.innerHTML=h;badge.style.display=unread>0?'flex':'none';badge.innerText=unread;})}
window.markOne=async id=>await updateDoc(doc(db,"notifications",id),{read:true});window.readAll=async()=>{const s=await getDocs(query(collection(db,"notifications"),where("toUserId","==",cur.uid),where("read","==",false)));s.forEach(d=>updateDoc(d.ref,{read:true}))};
window.switchView=name=>{
 const maps={home:'v-home',reels:'v-reels',search:'v-search',chat:'v-chat',notif:'v-notif',profile:'v-profile',chatRoom:'v-chatRoom'};
 Object.values(maps).forEach(id=>{const el=document.getElementById(id);if(el){el.style.display='none';el.classList.remove('on')}});
 const target=document.getElementById(maps[name]||'v-reels');if(target){target.style.display=name==='chatRoom'?'flex':(name==='chat'?'flex':'block');target.classList.add('on');}
 document.querySelectorAll('.bottom div').forEach(b=>b.classList.remove('a'));const bmap={home:'b_home',reels:'b_home',search:'b_search',notif:'b_notif',profile:'b_profile',chat:'b_home'};if(bmap[name]){const be=document.getElementById(bmap[name]);if(be)be.classList.add('a');}
 apanel.style.display='none';if(name==='profile')renderProfile();
};
window.doSearch=q=>{if(!q){searchRes.innerHTML=homeGrid.innerHTML;return}q=q.toLowerCase();const f=vids.filter(v=>v.title.toLowerCase().includes(q)||v.userName.toLowerCase().includes(q));if(!f.length){searchRes.innerHTML="<p style='padding:40px;text-align:center;color:#777'>No results</p>";return}let g="";f.forEach(v=>{const isV=v.url.includes('video');g+=`<div class="gitem" onclick="focusReel('${v.id}')">${isV?`<video src="${v.url}" muted></video>`:`<img src="${v.url}">`}</div>`});searchRes.innerHTML=g};
window.renderProfile=()=>{if(!cur)return;const mine=allVids.filter(v=>v.userId===cur.uid);const liked=allVids.filter(v=>v.likedBy?.includes(cur.uid));
 pinfo.innerHTML=`<button onclick="openS()" style="position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff">☰</button><img src="${cur.photoURL}" style="width:76px;height:76px;border-radius:50%;border:2px solid #ff4da6;box-shadow:0 0 18px rgba(255,77,166,.35)"><h3 style="margin-top:8px;font-size:16px">${cur.displayName}</h3><p style="font-size:11px;color:#aaa">${cur.email}</p><div style="display:flex;justify-content:space-around;margin-top:12px;background:rgba(255,255,255,.06);border-radius:14px;padding:10px"><div><b>${mine.length}</b><br><span style="font-size:10px;opacity:.6">Posts</span></div><div><b>${follow.size}</b><br><span style="font-size:10px;opacity:.6">Following</span></div><div><b>${liked.length}</b><br><span style="font-size:10px;opacity:.6">Liked</span></div></div>`;
 let list=pTab==='posts'?mine:liked;if(!list.length){profileGrid.innerHTML=`<p style='grid-column:1/4;padding:24px;text-align:center;color:#666'>No ${pTab}</p>`;return}let g="";list.forEach(v=>{const isV=v.url.includes('video');g+=`<div class="gitem" onclick="focusReel('${v.id}')">${isV?`<video src="${v.url}" muted></video>`:`<img src="${v.url}">`}</div>`});profileGrid.innerHTML=g;
 document.getElementById('pt1').style.color=pTab==='posts'?'#fff':'#aaa';document.getElementById('pt1').style.borderBottom=pTab==='posts'?'2px solid #ff4da6':'none';document.getElementById('pt2').style.color=pTab==='liked'?'#fff':'#aaa';document.getElementById('pt2').style.borderBottom=pTab==='liked'?'2px solid #ff4da6':'none';
};
window.openS=()=>{smodal.style.display='flex'};window.closeS=()=>{smodal.style.display='none'};
window.openU=()=>{if(!cur)return alert("Login");umodal.classList.add('on');umodal.style.display='flex';};window.closeU=()=>{umodal.classList.remove('on');setTimeout(()=>umodal.style.display='none',250);ustatus.innerText="";pwrap.style.display='none';};
vfile.onchange=e=>{const f=e.target.files[0];if(!f)return;const isV=f.type.startsWith('video');prev.style.display=isV?'none':'block';prevV.style.display=isV?'block':'none';if(isV){prevV.src=URL.createObjectURL(f);prevV.className=fsel.value;}else{prev.src=URL.createObjectURL(f);prev.className=fsel.value;}};fsel.onchange=e=>{prev.className=e.target.value;prevV.className=e.target.value;};
upbtn.onclick=()=>{let file=vfile.files[0],title=vtitle.value.trim();if(!file||!title)return alert("Caption + file");const musicUrl=msel.value;const musicName=msel.selectedOptions[0].text;
 upbtn.disabled=true;upbtn.innerText="Posting...";ustatus.innerText="0%";pwrap.style.display='block';pbar.style.width='0%';
 let fd=new FormData();fd.append('file',file);fd.append('upload_preset',PRESET);
 const xhr=new XMLHttpRequest();xhr.open('POST',`https://api.cloudinary.com/v1_1/${CLOUD}/auto/upload`);
 xhr.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);pbar.style.width=p+'%';ustatus.innerText=p+'%';}};
 xhr.onload=async()=>{try{const d=JSON.parse(xhr.responseText);if(!d.secure_url)throw new Error(d.error?.message);ustatus.innerText="Saving...";
  await addDoc(collection(db,"videos"),{title,url:d.secure_url,type:file.type.startsWith('video')?'video':'image',filter:fsel.value,musicUrl,musicName:musicUrl?musicName:"",userId:cur.uid,userName:cur.displayName,userPhoto:cur.photoURL,likes:0,comments:0,likedBy:[],time:serverTimestamp()});
  ustatus.innerText="Done ✓";setTimeout(()=>{closeU();vtitle.value="";vfile.value="";prev.style.display='none';prevV.style.display='none';upbtn.disabled=false;upbtn.innerText="Post 🚀";switchView('reels');},700);
 }catch(e){ustatus.innerText=e.message;upbtn.disabled=false;upbtn.innerText="Post 🚀";}};xhr.onerror=()=>{ustatus.innerText="Network error";upbtn.disabled=false;};xhr.send(fd);};
window.shareR=url=>{if(navigator.share)navigator.share({title:'INTUBE',url});else{prompt('Copy link',url)}};
window.tm=()=>{const p=apanel;p.style.display=p.style.display==='block'?'none':'block';if(p.style.display==='block')updateStats();};
function updateStats(){if(!cur)return;const mine=allVids.filter(v=>v.userId===cur.uid);const likes=mine.reduce((s,v)=>s+(v.likes||0),0);const views=mine.length*137+likes*3;const eng=mine.length?Math.round(likes/mine.length*12):0;astats.innerHTML=`<div style="padding:8px;border-radius:12px;background:rgba(255,255,255,.07);text-align:center"><b>${views}</b><br><span style="font-size:9px">VIEWS</span></div><div style="padding:8px;border-radius:12px;background:rgba(255,255,255,.07);text-align:center"><b>${likes}</b><br><span style="font-size:9px">LIKES</span></div><div style="padding:8px;border-radius:12px;background:rgba(255,255,255,.07);text-align:center"><b>${follow.size}</b><br><span style="font-size:9px">FOLLOW</span></div><div style="padding:8px;border-radius:12px;background:rgba(255,255,255,.07);text-align:center"><b>${eng}%</b><br><span style="font-size:9px">ENGAGE</span></div>`}
window.setF=f=>{curFilter=f;document.querySelectorAll('#feed video,#feed img').forEach(el=>el.className=f);document.querySelectorAll('[id^=f]').forEach(b=>b.style.background='rgba(255,255,255,.11)');const map={'':'f0','f-vivid':'f1','f-cinema':'f2','f-gold':'f3','f-neon':'f4','f-vintage':'f5'};if(map[f])document.getElementById(map[f]).style.background='#ff4da6';};
async function loadChatUsers(){if(!cur)return;const s=await getDocs(collection(db,"users"));let h="";s.forEach(d=>{const u=d.data();if(u.uid===cur.uid)return;h+=`<div class="chatIt" onclick="openChatWith('${u.uid}','${u.displayName}','${u.photoURL}')"><img src="${u.photoURL}" style="width:38px;height:38px;border-radius:50%"><div style="flex:1"><b style="font-size:13px">${u.displayName}</b><div style="font-size:10px;opacity:.5">Tap to chat 💬</div></div><div style="width:7px;height:7px;background:#0f0;border-radius:50%"></div></div>`});chatList.innerHTML=h||"<p style='text-align:center;color:#666;padding:20px'>No users</p>";}
window.openChatWith=async(uid,name,photo)=>{
 if(!cur)return alert("Login");curChatUser={uid,name,photo};curChatId=[cur.uid,uid].sort().join('_');chatName.innerText=name;chatAv.src=photo;switchView('chatRoom');
 if(chatUnsub)chatUnsub();chatUnsub=onSnapshot(query(collection(db,"chats",curChatId,"messages"),orderBy("time","asc")),s=>{let h="";s.forEach(d=>{const m=d.data();const isMe=m.from===cur.uid;h+=`<div class="bubble ${isMe?'me':'other'}">${m.text}</div>`});chatMsgs.innerHTML=h;chatMsgs.scrollTop=chatMsgs.scrollHeight;});
};
chatSend.onclick=async()=>{const t=chatIn.value.trim();if(!t||!curChatId)return;chatIn.value="";await addDoc(collection(db,"chats",curChatId,"messages"),{text:t,from:cur.uid,to:curChatUser.uid,time:serverTimestamp()});await setDoc(doc(db,"chats",curChatId),{users:[cur.uid,curChatUser.uid],lastMsg:t,lastTime:serverTimestamp()},{merge:true});};
chatIn.addEventListener('keydown',e=>{if(e.key==='Enter')chatSend.click()});
window.logout=()=>signOut(auth).then(()=>location.reload());
feed.addEventListener('click',()=>{apanel.style.display='none'});
switchView('home');setTimeout(()=>switchView('reels'),400);
</script></body></html>
