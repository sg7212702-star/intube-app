<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2702 Star</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:#090018;
position:relative;
color:white;
}

body::before{
content:'';
position:absolute;
inset:0;
background:
radial-gradient(circle at 20% 20%,#7b61ff55,transparent 30%),
radial-gradient(circle at 80% 20%,#00d4ff55,transparent 30%),
radial-gradient(circle at 50% 80%,#ff4fd855,transparent 35%);
animation:move 12s infinite alternate;
}

@keyframes move{
100%{
transform:scale(1.2) rotate(8deg);
}
}

.container{
position:relative;
z-index:2;
height:100%;
display:flex;
flex-direction:column;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:20px;
}

.logo{
font-size:34px;
font-weight:700;
}

.logo span{
background:linear-gradient(45deg,#00d4ff,#ff4fd8);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.glass{
margin-top:40px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.15);
border-radius:35px;
padding:30px;
box-shadow:
0 0 30px rgba(123,97,255,.4),
0 0 50px rgba(0,212,255,.2);
}

.avatar{
width:120px;
height:120px;
margin:auto;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
background:linear-gradient(135deg,#00d4ff,#7b61ff,#ff4fd8);
box-shadow:0 0 30px #7b61ff;
}

.title{
text-align:center;
margin-top:20px;
font-size:42px;
font-weight:700;
}

.subtitle{
text-align:center;
opacity:.8;
margin-top:10px;
}

.google-btn{
margin-top:30px;
width:100%;
padding:18px;
border:none;
border-radius:18px;
font-size:18px;
font-weight:700;
cursor:pointer;
color:white;
background:linear-gradient(
135deg,
#00d4ff,
#7b61ff,
#ff4fd8
);
box-shadow:0 0 30px rgba(123,97,255,.6);
transition:.3s;
}

.google-btn:hover{
transform:translateY(-4px);
}

.features{
display:flex;
justify-content:space-around;
margin-top:35px;
text-align:center;
}

.feature{
font-size:14px;
}

.bottom-nav{
position:absolute;
bottom:20px;
left:20px;
right:20px;
height:80px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border-radius:30px;
display:flex;
justify-content:space-around;
align-items:center;
border:1px solid rgba(255,255,255,.15);
}

.nav-item{
text-align:center;
font-size:14px;
}

.plus{
width:70px;
height:70px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
background:linear-gradient(135deg,#00d4ff,#7b61ff,#ff4fd8);
box-shadow:0 0 30px #7b61ff;
margin-top:-40px;
}

.glow{
position:absolute;
width:150px;
height:150px;
border-radius:50%;
background:#7b61ff;
filter:blur(90px);
opacity:.4;
}

.g1{
top:50px;
left:-50px;
}

.g2{
right:-50px;
top:200px;
background:#00d4ff;
}

.g3{
bottom:150px;
left:40%;
background:#ff4fd8;
}
</style>
</head>

<body>

<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="glow g3"></div>

<div class="container">

<div class="header">
<div class="logo">2702 <span>Star</span></div>
<div>🚀</div>
</div>

<div class="glass">

<div class="avatar">👤</div>

<div class="title">Account</div>

<div class="subtitle">
Apne Google account se login karein
</div>

<button class="google-btn" onclick="googleLogin()">
Sign in with Google
</button>

<div class="features">

<div class="feature">
🛡️ <br> Secure
</div>

<div class="feature">
⚡ <br> Fast
</div>

<div class="feature">
🔒 <br> Trusted
</div>

</div>

</div>

<div class="bottom-nav">

<div class="nav-item">
🏠<br>Home
</div>

<div class="nav-item">
📰<br>Feed
</div>

<div class="plus">+</div>

<div class="nav-item">
🧭<br>Explore
</div>

<div class="nav-item">
👤<br>Profile
</div>

</div>

</div>

<script>
function googleLogin(){
alert("Firebase Google Login Connect Here");
}
</script>

</body>
</html>
