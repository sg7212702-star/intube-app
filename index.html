<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>INTUBE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{background:radial-gradient(circle at 20% 20%, #2a1f45 0%, #120b20 40%, #0a0612 100%) fixed!important; color:#fff; font-family:'Poppins'; margin:0; padding:0 0 90px; min-height:100vh}
.header{padding:14px 16px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:20; background:rgba(18,11,32,0.45)!important; backdrop-filter:blur(20px)!important; border-bottom:1px solid rgba(255,255,255,0.1)}
#videos{max-width:480px; margin:0 auto; padding:10px; display:flex; flex-direction:column; gap:16px}
.card{background:rgba(30,20,48,0.42)!important; backdrop-filter:blur(18px)!important; border:1px solid rgba(255,255,255,0.13)!important; border-radius:20px; overflow:hidden; box-shadow:0 12px 32px rgba(0,0,0,0.35)}
.card video,.card img{width:100%; max-height:72vh; object-fit:cover; background:#000; display:block}
.top-bar{display:flex; justify-content:space-between; align-items:center; padding:10px 12px}
.follow-btn{background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); color:#fff; padding:4px 12px; border-radius:999px; font-size:11px; cursor:pointer}
.follow-btn.following{background:linear-gradient(135deg,#c084fc,#818cf8); border:none}
.actions{display:flex; gap:18px; align-items:center; padding:10px 12px 2px; font-size:22px}
.actions span{cursor:pointer}.meta{padding:4px 12px 12px; font-size:13px}
.comment-box{display:flex; gap:8px; padding:8px 12px; border-top:1px solid rgba(255,255,255,0.08); background:rgba(0,0,0,0.15)}
.comment-box input{flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:999px; padding:8px 14px; color:#fff; outline:none}
.bottom-nav{position:fixed; bottom:0; width:100%; background:rgba(18,11,32,0.55)!important; backdrop-filter:blur(24px)!important; display:flex; justify-content:space-around; align-items:center; height:70px; border-top:1px solid rgba(255,255,255,0.12); z-index:99}
.nav-item{color:#9c92b5; text-decoration:none; font-size:11px; display:flex; flex-direction:column; align-items:center}.nav-item.active{color:#fff}.fab-btn{width:56px; height:56px; background:linear-gradient(135deg,#c084fc,#818cf8); border-radius:50%; display:flex; justify-content:center; align-items:center; color:#fff; font-size:26px; margin-top:-20px; text-decoration:none}
</style></head><body>
<div class="header"><div style="font-weight:700; font-size:20px">IN<span style="color:#c084fc">TUBE</span></div><div style="color:#b8b0cc; font-size:11px" id="liveCount">● Live</div></div>
<div id="videos"></div>
<nav class="bottom-nav"><a href="index.html" class="nav-item active">🏠 Home</a><a href="feed.html" class="nav-item">🎞️ Feed</a><a href="upload.html" class="fab-btn">+</a><a href="explore.html" class="nav-item">📺 Explore</a><a href="login.html" class="nav-item">👤 Profile</a></nav>

<script type="module">
import { db, auth } from "./firebase-config.js";
import { collection, query, orderBy, onSnapshot, doc, updateDoc, arrayUnion, arrayRemove, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let currentUser=null;
onAuthStateChanged(auth,u=>{currentUser=u});

const container=document.getElementById("videos");
const q=query(collection(db,"posts"), orderBy("createdAt","desc"));

// REAL-TIME INSTA ALGORITHM - bina refresh ke update
onSnapshot(q,(snap)=>{
  container.innerHTML="";
  document.getElementById("liveCount").innerText=`● ${snap.size} Live`;
  snap.forEach(d=>{
    const v=d.data(); const id=d.id;
    const liked=v.likedBy?.includes(currentUser?.uid);
    const following=v.followers?.includes(currentUser?.uid);
    const isVideo=v.mediaUrl?.match(/mp4|mov|webm|video/);
    container.innerHTML+=`
    <div class="card">
      <div class="top-bar"><b>👤 ${v.userName||'Guest'}</b><button class="follow-btn ${following?'following':''}" onclick="followUser('${id}')">${following?'Following':'Follow'}</button></div>
      ${isVideo? `<video src="${v.mediaUrl}" autoplay muted loop playsinline preload="auto"></video>` : `<img src="${v.mediaUrl}">`}
      <div class="actions">
        <span onclick="likePost('${id}')">${liked?'❤️':'🤍'}</span>
        <span onclick="document.getElementById('c-${id}').focus()">💬</span>
        <span style="margin-left:auto; font-size:12px; color:#b8b0cc">${v.likes||0} likes • ${v.commentsCount||0} comments</span>
      </div>
      <div class="meta"><b>${v.userName||''}</b> ${v.caption||''}</div>
      <div class="comment-box"><input id="c-${id}" placeholder="Add comment..."><span style="color:#c084fc; font-weight:600; cursor:pointer" onclick="commentPost('${id}')">Post</span></div>
    </div>`;
  });
  // AutoPlay observer
  const vids=document.querySelectorAll('video');
  const obs=new IntersectionObserver(es=>{es.forEach(e=>{e.isIntersecting?e.target.play().catch(()=>{}):e.target.pause()})},{threshold:0.6});
  vids.forEach(v=>obs.observe(v));
});

window.likePost=async(id)=>{
  if(!currentUser) return alert('Login karo pehle');
  const ref=doc(db,"posts",id);
  const snap=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js").then(m=>m.getDoc(ref));
  const liked=snap.data().likedBy?.includes(currentUser.uid);
  if(liked){ await updateDoc(ref,{likes:increment(-1), likedBy:arrayRemove(currentUser.uid)}) }
  else{ await updateDoc(ref,{likes:increment(1), likedBy:arrayUnion(currentUser.uid)}) }
}

window.followUser=async(id)=>{
  if(!currentUser) return alert('Login karo');
  const ref=doc(db,"posts",id);
  await updateDoc(ref,{followers:arrayUnion(currentUser.uid)});
}

window.commentPost=async(id)=>{
  const input=document.getElementById(`c-${id}`); if(!input.value) return;
  const ref=doc(db,"posts",id);
  await updateDoc(ref,{commentsCount:increment(1), lastComment:input.value, comments:arrayUnion({text:input.value, user:currentUser?.displayName||'Guest', uid:currentUser?.uid||'guest'})});
  input.value="";
}
</script></body></html>
