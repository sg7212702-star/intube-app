<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>INTUBE</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="glass loginCard">
    <h1>INTUBE 💎</h1>
    <p>Realtime Social Platform</p>

    <button id="googleLoginBtn">
      Continue With Google
    </button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <!-- TOP BAR -->
  <header class="topBar glass">

    <div class="logo">
      INTUBE
    </div>

    <div class="topBtns">

      <button id="searchBtn">🔍</button>

      <button id="chatBtn">💌</button>

      <button id="notificationBtn">♥️</button>

    </div>

  </header>

  <!-- STORIES -->
  <section id="stories">
    <div class="story">
      <div class="storyRing" id="addStory">+</div>
      <small>Add</small>
    </div>
    <div id="storiesList"></div>
  </section>
  <input type="file" id="storyFile" hidden accept="image/*,video/*">

  <!-- FEED -->
  <main id="feed">

  </main>



  <!-- BOTTOM NAV -->
  <nav class="bottomNav glass">

    <button class="active" id="homeBtn">
      💝
      <span>Home</span>
    </button>

    <button id="exploreBtn">
      🔍
      <span>Explore</span>
    </button>

    <button id="postBtn">
      ➕
      <span>Post</span>
    </button>

    <button id="reelsBtn">
      🎬
      <span>Reels</span>
    </button>

    <button id="profileBtn">
      👤
      <span>Profile</span>
    </button>

  </nav>

</div>

<!-- POST UPLOAD MODAL -->
<div id="uploadModal" hidden>

  <div class="glass uploadCard">

    <h3>Create Post</h3>

    <input
      type="text"
      id="caption"
      placeholder="Write caption..."
    >

    <input
      type="file"
      id="mediaFile"
    >

    <button id="uploadBtn">
      Upload
    </button>

  </div>

</div>

<!-- STORY MODAL -->
<div id="storyModal" hidden>

  <div class="glass uploadCard">

    <h3>Add Story</h3>

    <input
      type="file"
      id="storyFile"
    >

    <button id="uploadStoryBtn">
      Upload Story
    </button>

  </div>

</div>

<div id="storyViewer" hidden>
  <div id="storyProgress"></div>
  <div id="storyHeader">
    <img id="viewerUserPhoto" style="width:40px;height:40px;border-radius:50%">
    <div>
      <b id="viewerUser"></b>
      <small id="storyTime"></small>
    </div>
    <button id="closeViewer">X</button>
  </div>
  <img id="storyImg" hidden>
  <video id="storyVideo" hidden controls></video>
  <button id="prevStory">Prev</button>
  <button id="nextStory">Next</button>
</div>
<script type="module" src="firebase-config.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="feed.js"></script>
<script type="module" src="stories.js?v=5"></script>
  <script type="module" src="story-seen.js"></script>
<script type="module" src="upload.js"></script>
<script type="module" src="profile.js"></script>
<script type="module" src="notifications.js"></script>
<script type="module" src="chat.js"></script>
<script type="module" src="reels.js"></script>

<script type="module" src="explore.js"></script>

<script>
function comingSoon(e){
  if(e) e.preventDefault();
  alert('Coming Soon - Stay Tuned!');
}
</script>

</body>
</html>
