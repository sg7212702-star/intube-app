<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUBE - Real YouTube</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff}
.top{position:sticky;top:0;background:rgba(0,0,0,.9);backdrop-filter:blur(15px);display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #222;z-index:100}
#search{flex:1;background:#151515;border:1px solid #222;padding:10px 16px;border-radius:25px;color:#fff;outline:none}
#feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:16px}
.card{background:#111;border:1px solid #222;border-radius:20px;overflow:hidden;transition:.2s}
.card:hover{border-color:#333}
.card video,.card img{width:100%;height:220px;object-fit:cover;background:#000}
.info{padding:12px;display:flex;gap:10px}
.info img{width:36px;height:36px;border-radius:50%}
#loginScreen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:200}
.loginCard{background:#111;padding:35px;border-radius:25px;border:1px solid #222;text-align:center;width:90%;max-width:380px}
.loginCard button{background:#fff;color:#000;border:none;padding:14px;width:100%;border-radius:30px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;margin-top:20px}
#uploadModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:150;align-items:center;justify-content:center;padding:16px}
.uploadBox{background:#111;padding:22px;border-radius:20px;width:100%;max-width:420px;border:1px solid #222}
.uploadBox input[type="text"]{width:100%;margin:12px 0;padding:12px;border-radius:12px;background:#000;border:1px solid #222;color:#fff;outline:none}
#progressWrap{display:none;margin-top:12px;background:#222;height:8px;border-radius:10px;overflow:hidden}
#progressBar{height:100%;width:0%;background:#ff004f;transition:.2s}
.upload-btn{position:fixed;bottom:20px;right:20px;background:#ff004f;color:#fff;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;z-index:50;box-shadow:0 5px 20px rgba(255,0,79,.4)}
#preview{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:10px;display:none;background:#000}
</style>
</head>
<body>
<div id="loginScreen"><div class="loginCard"><h1>INTUBE 🔥</h1><p style="color:#888;margin-top:8px">Real YouTube Clone for Real Users</p><button id="googleBtn"><img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20"> Login with Google</button><p id="loginMsg" style="color:#ff004f;margin-top:14px;font-size:13px;line-height:1.4"></p></div></div>

<div class="top"><b>INTUBE</b><input id="search" placeholder="Search video..."><div id="profilePic" style="width:38px;height:38px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden" onclick="logout()">👤</div></div>

<div id="feed">Loading videos...</div>
<div class="upload-btn" onclick="openUpload()">+</div>

<div id="uploadModal">
<div class="uploadBox">
<h3>Upload Video / Photo</h3>
<input id="vTitle" type="text" placeholder="Video ka Title likho...">
<input type="file" id="vFile" accept="video/*,image/*">
<img id="preview">
<div id="progressWrap"><div id="progressBar"></div></div>
<button id="upBtn" style="width:100%;margin-top:14px;background:#ff004f;border:none;padding:12px;border-radius:20px;color:#fff;font-weight:bold;cursor:pointer">Upload Now</button>
<button onclick="closeUpload()" style="width:100%;margin-top:8px;background:#222;border:none;padding:10px;border-radius:20px;color:#fff;cursor:pointer">Cancel</button>
<p id="upStatus" style="text-align:center;margin-top:12px;color:#888;font-size:13px"></p>
</div>
</div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "firebase/auth";
import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyDibgzp64G1QB7Pma-7Zx4yMAV06go8cNU",
  authDomain: "intube-61cca.firebaseapp.com",
  projectId: "intube-61cca",
  storageBucket: "intube-61cca.firebasestorage.app",
  messagingSenderId: "627409965607",
  appId: "1:627409965607:web:a1d71800d812fe668b7402"
};

const CLOUD_NAME = "kujnbe0a";
const UPLOAD_PRESET = "intube_free";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
let currentUser = null;
let allVideos = [];

setPersistence(auth, browserLocalPersistence);
getRedirectResult(auth).catch(e=>{ document.getElementById('loginMsg').innerText = e.message; });

document.getElementById('googleBtn').onclick = async ()=>{
  const msg = document.getElementById('loginMsg');
  msg.innerText = "Google khul raha hai...";
  try{
    await signInWithPopup(auth, provider);
  }catch(err){
    if(err.code === 'auth/unauthorized-domain'){
      msg.innerHTML = "❌ Domain allow nahi hai!<br>Firebase > Auth > Settings > Authorized domains me<br><b>2702-star.github.io</b> add karo";
    }else if(err.code.includes('popup')){
      msg.innerText = "Popup block hai, redirect kar rahe hai...";
      await signInWithRedirect(auth, provider);
    }else{
      msg.innerText = err.message;
    }
  }
};

onAuthStateChanged(auth, (user)=>{
 if(user){
  currentUser=user;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('profilePic').innerHTML=`<img src="${user.photoURL}" style="width:100%;height:100%;object-fit:cover">`;
  loadVideos();
 }else{
  document.getElementById('loginScreen').style.display='flex';
  loadVideos();
 }
});

window.logout=()=>signOut(auth).then(()=>location.reload());
window.openUpload=()=>{ if(!currentUser) return alert("Pehle Login karo"); document.getElementById('uploadModal').style.display='flex'; }
window.closeUpload=()=>{ document.getElementById('uploadModal').style.display='none'; document.getElementById('upStatus').innerText=""; document.getElementById('progressWrap').style.display='none'; document.getElementById('progressBar').style.width='0%'; }

document.getElementById('vFile').onchange = (e)=>{
  const file = e.target.files[0]; if(!file) return;
  if(file.size > 100*1024*1024) return alert("100MB se badi file allowed nahi hai");
  const prev = document.getElementById('preview');
  prev.style.display='block';
  if(file.type.startsWith('video')){ prev.outerHTML = `<video id="preview" controls style="width:100%;max-height:200px;border-radius:12px;margin-top:10px;display:block"></video>`; document.getElementById('preview').src = URL.createObjectURL(file); }
  else{ prev.src = URL.createObjectURL(file); }
};

async function loadVideos(){
 try{
  const snap = await getDocs(query(collection(db,"videos"), orderBy("time","desc")));
  allVideos = []; snap.forEach(d=> allVideos.push(d.data()));
  renderVideos(allVideos);
 }catch(e){ document.getElementById('feed').innerHTML = "Error: "+e.message+"<br><br>Firestore Rules check karo"; }
}

function renderVideos(list){
  if(!list.length){ document.getElementById('feed').innerHTML = "<p style='padding:20px;color:#888'>Koi video nahi hai, pehle upload karo 🔥</p>"; return; }
  let html=""; list.forEach(v=>{
    html+=`<div class="card">${v.url.includes('video')||v.url.includes('.mp4')?`<video src="${v.url}" controls preload="metadata"></video>`:`<img src="${v.url}" loading="lazy">`}<div class="info"><img src="${v.userPhoto||''}" onerror="this.style.display='none'"><div><b>${v.title}</b><p style="color:#888;font-size:13px;margin-top:2px">${v.userName} • ${v.time?.toDate? v.time.toDate().toLocaleDateString() : 'Just now'}</p></div></div></div>`;
  });
  document.getElementById('feed').innerHTML = html;
}

document.getElementById('search').oninput = (e)=>{
  const q = e.target.value.toLowerCase();
  const filtered = allVideos.filter(v=> v.title.toLowerCase().includes(q) || v.userName.toLowerCase().includes(q));
  renderVideos(filtered);
};

// UPLOAD WITH PROGRESS
document.getElementById('upBtn').onclick= ()=>{
 let file=document.getElementById('vFile').files[0];
 let title=document.getElementById('vTitle').value.trim();
 if(!file||!title) return alert("Title + file dono chahiye");
 if(!currentUser) return alert("Login karo");

 const upBtn = document.getElementById('upBtn');
 const status = document.getElementById('upStatus');
 const wrap = document.getElementById('progressWrap');
 const bar = document.getElementById('progressBar');

 upBtn.disabled=true; upBtn.innerText="Uploading..."; status.innerText="0%"; wrap.style.display='block'; bar.style.width='0%';

 let fd=new FormData(); fd.append('file', file); fd.append('upload_preset', UPLOAD_PRESET);

 const xhr = new XMLHttpRequest();
 xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`);

 xhr.upload.onprogress = (e)=>{
   if(e.lengthComputable){ const p = Math.round((e.loaded/e.total)*100); bar.style.width=p+'%'; status.innerText=`Uploading ${p}%`; }
 };

 xhr.onload = async ()=>{
   try{
     const data = JSON.parse(xhr.responseText);
     if(!data.secure_url) throw new Error(data.error?.message||'Cloudinary preset error');
     status.innerText="Saving to database...";
     await addDoc(collection(db,"videos"),{ title, url:data.secure_url, userName:currentUser.displayName, userEmail:currentUser.email, userPhoto:currentUser.photoURL, time:new Date() });
     status.innerText="Done 🔥";
     setTimeout(()=>{ closeUpload(); document.getElementById('vTitle').value=""; document.getElementById('vFile').value=""; document.getElementById('preview').style.display='none'; upBtn.disabled=false; upBtn.innerText="Upload Now"; loadVideos(); },800);
   }catch(err){ status.innerText="Failed: "+err.message; upBtn.disabled=false; upBtn.innerText="Upload Now"; }
 };

 xhr.onerror = ()=>{ status.innerText="Network error, fir se try karo"; upBtn.disabled=false; upBtn.innerText="Upload Now"; };
 xhr.send(fd);
};
</script>
</body>
</html>
