<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaySphere - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #120b20; color: #ffffff; padding-bottom: 90px; }
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .section-title { font-size: 18px; font-weight: 600; margin: 20px 20px 10px 20px; display: flex; align-items: center; gap: 8px; }
        .horizontal-scroll { display: flex; overflow-x: auto; gap: 15px; padding: 0 20px; scrollbar-width: none; }
        .horizontal-scroll::-webkit-scrollbar { display: none; }
        .trending-card { min-width: 280px; background: #251b37; border-radius: 20px; overflow: hidden; flex-shrink: 0; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .trending-thumbnail { width: 100%; height: 150px; background: #3f305c; object-fit: cover; display: flex; align-items: center; justify-content: center; color: #b0a8c2; }
        .trending-info { padding: 12px; }
        .trending-info h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .trending-info p { font-size: 12px; color: #b0a8c2; }
        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(30, 20, 48, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; height: 70px; border-top: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000; }
        .nav-item { text-align: center; color: #9c92b5; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .nav-item.active { color: #ffffff; }
        .fab-btn { width: 52px; height: 52px; background: linear-gradient(135deg, #c084fc, #818cf8); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; box-shadow: 0 4px 15px rgba(192, 132, 252, 0.5); margin-top: -18px; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <h2>🎬 PlaySphere</h2>
        <span id="user-greeting" style="font-size: 13px; color: #c084fc;">Loading...</span>
    </header>

    <div class="section-title">🔥 Trending Videos</div>
    <div class="horizontal-scroll" id="trending-container">
        <!-- Firestore se data yahan dynamically load hoga -->
        <p style="color: #b0a8c2; font-size: 13px;">Loading feed...</p>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><span>🏠</span> Home</a>
        <a href="feed.html" class="nav-item"><span>🎞️</span> Feed</a>
        <a href="upload.html" class="fab-btn">+</a>
        <a href="explore.html" class="nav-item"><span>📺</span> Explore</a>
        <a href="login.html" class="nav-item"><span>👤</span> Profile</a>
    </nav>

    <script type="module">
        import { auth, db, onAuthStateChanged, collection, getDocs, query, orderBy } from "./firebase-config.js";

        // Auth state check
        onAuthStateChanged(auth, (user) => {
            const greeting = document.getElementById('user-greeting');
            if (user) {
                greeting.innerText = `Hi, ${user.displayName ? user.displayName.split(' ')[0] : 'User'}`;
            } else {
                greeting.innerText = 'Guest Mode';
            }
        });

        // Fetch videos from Firestore
        async function loadFeed() {
            const container = document.getElementById('trending-container');
            try {
                const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                if(querySnapshot.empty) {
                    container.innerHTML = `<p style="color: #b0a8c2; font-size: 13px; padding: 10px;">Koi video uplabdh nahi hai.</p>`;
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const video = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'trending-card';
                    card.onclick = () => window.location.href = `watch.html?id=${docSnap.id}`;
                    card.innerHTML = `
                        <div class="trending-thumbnail">▶ Video Preview</div>
                        <div class="trending-info">
                            <h3>${video.title}</h3>
                            <p>${video.views || 0} Views • ${video.author || 'Anonymous'}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading feed:", error);
                container.innerHTML = `<p style="color: #ff6b6b; font-size: 13px;">Database connection error.</p>`;
            }
        }

        loadFeed();
    </script>
</body>
</html>
