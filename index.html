<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;overflow-x:hidden}
.top{position:sticky;top:0;background:rgba(0,0,0,.85);backdrop-filter:blur(15px);display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #222;z-index:100}
.top b{font-size:18px;letter-spacing:1px}
.top input{flex:1;background:#151515;border:1px solid #222;padding:10px 16px;border-radius:25px;color:#fff;outline:none;transition:.3s}
.top input:focus{border-color:#ff004f;background:#1a1a1a}
.icon{width:38px;height:38px;background:#151515;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:.3s}
.icon:hover{transform:scale(1.1);background:#222}
.badge{position:absolute;top:-2px;right:-2px;background:#ff004f;color:#fff;font-size:10px;padding:2px 5px;border-radius:10px;display:none}
#feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:16px}
.card{background:#111;border:1px solid #222;border-radius:20px;overflow:hidden;animation:pop .5s ease;transition:.3s}
.card:hover{transform:translateY(-5px);border-color:#333;box-shadow:0 10px 30px rgba(255,0,79,.15)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.card video,.card img{width:100%;height:220px;object-fit:cover;background:#000}
.info{padding:12px}
.user{display:flex;align-items:center;gap:8px;margin:8px 0}
.user img{width:28px;height:28px;border-radius:50%}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.actions button{background:#1a1a1a;border:1px solid #222;color:#fff;padding:7px 14px;border-radius:20px;cursor:pointer;transition:.3s;font-size:13px}
.actions button:active{transform:scale(.9)}
.actions button.liked{background:#ff004f;border-color:#ff004f;animation:heart .4s}
@keyframes heart{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.comment-box{display:flex;gap:6px;margin-top:10px}
.comment-box input{flex:1;background:#000;border:1px solid #222;padding:7px 12px;border-radius:20px;color:#fff;outline:none}
.upload-btn{position:fixed;bottom:20px;right:20px;background:#ff004f;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;box-shadow:0 5px 20px rgba(255,0,79,.4);z-index:50;transition:.3s}
.upload-btn:hover{transform:scale(1.1) rotate(10deg)}

.loginCard{background:#111;padding:35px;border-radius:25px;border:1px solid #222;text-align:center;width:90%;max-width:380px;animation:pop .6s}
.loginCard button{background:#fff;color:#000;border:none;padding:14px;width:100%;border-radius:30px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;margin-top:20px}

// LOAD VIDEOS
async function loadVideos(){
 const snap = await getDocs(query(collection(db,"videos"), orderBy("time","desc")));
 allVideos=[]; snap.forEach(d=> allVideos.push({id:d.id, ...d.data()}));
 render(allVideos);
}
function render(list){
 if(!list.length){ document.getElementById('feed').innerHTML="<p style='padding:20px;color:#888'>Koi video nahi hai</p>"; return }
 document.getElementById('feed').innerHTML = list.map(v=>`
  <div class="card" data-title="${(v.title+v.userName).toLowerCase()}">
    ${v.url.includes('.mp4')||v.url.includes('video')? `<video src="${v.url}" controls poster=""></video>` : `<img src="${v.url}">`}
    <div class="info">
      <b>${v.title}</b>
      <div class="user"><img src="${v.userPhoto||'https://i.pravatar.cc/100'}"><small>${v.userName} • ${new Date(v.time?.seconds*1000).toLocaleDateString()}</small></div>
      <div class="actions">
        <button onclick="likeVideo('${v.id}', this)">❤️ ${v.likes||0}</button>
        <button onclick="document.getElementById('c-${v.id}').focus()">💬 ${v.comments?.length||0}</button>
        <button onclick="followUser('${v.userEmail}', '${v.userName}')">+ Follow</button>
      </div>
      <div id="list-${v.id}">${(v.comments||[]).slice(-2).map(c=>`<p style="font-size:13px;color:#ccc;margin-top:6px"><b>${c.name}:</b> ${c.text}</p>`).join('')}</div>
      <div class="comment-box"><input id="c-${v.id}" placeholder="Comment..."><button onclick="addComment('${v.id}')">➤</button></div>
    </div>
  </div>
 `).join('');
}
window.filterVideos=()=>{
 let q=document.getElementById('search').value.toLowerCase();
 render(allVideos.filter(v=> (v.title+v.userName).toLowerCase().includes(q)));
}
