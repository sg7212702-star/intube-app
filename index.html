<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>INTUBE - Insta Exact Transparent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;min-height:100dvh;padding-bottom:90px;background:radial-gradient(600px at 0% 0%,rgba(225,48,108,0.16),transparent 60%),#08080a;max-width:480px;margin:0 auto;}

/* GLASS FORMULA FOR ALL BUTTONS */
.glassBtn{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(16px) saturate(1.8);-webkit-backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,0.13);
box-shadow:inset 0 1px 0 rgba(255,255,255,0.15),0 4px 20px rgba(0,0,0,0.25);
color:#E1306C;cursor:pointer;transition:0.18s;
}
.glassBtn:active{transform:scale(0.92);background:rgba(255,59,127,0.15)}

/* TOP BAR - INSTA SIZE 60px */
.topBar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:100;background:rgba(12,12,14,0.65);backdrop-filter:blur(30px);border-bottom:1px solid rgba(255,255,255,0.08);}
.topBar .leftBtn,.topBar .rightBtn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;}
.logo{font-family:cursive;font-size:28px;font-weight:700;color:#E1306C;letter-spacing:0.5px;font-style:italic;cursor:pointer}

/* STORIES ROW - INSTA SIZE 66px CIRCLE */
.stories{display:flex;gap:14px;padding:12px 16px;overflow-x:auto;background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.06);}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 68px;text-align:center;position:relative;cursor:pointer}
.ring{width:68px;height:68px;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);position:relative;}
.ring img{width:100%;height:100%;border-radius:50%;border:3px solid #000;object-fit:cover;background:#222;display:block}
.plusBadge{position:absolute;bottom:-1px;right:-1px;width:22px;height:22px;border-radius:50%;background:#0095F6;color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2.5px solid #000;z-index:2;}
.story span{font-size:12px;color:#fff;margin-top:6px;display:block;letter-spacing:0.2px}

/* BANNER - INSTA PRO STYLE */
.banner{background:#FFF0F3;color:#FF6B30;text-align:center;font-size:14px;font-weight:600;padding:10px;}

/* FEED EMPTY - TRANSPARENT */
#feed{min-height:50vh}
.emptyBox{margin:20px 16px;padding:40px 20px;text-align:center;border-radius:20px;background:rgba(255,255,255,0.04);border:1px dashed rgba(255,255,255,0.14);backdrop-filter:blur(20px);color:#777;font-size:13px;line-height:1.6}
.emptyBox b{color:#fff;font-size:15px;display:block;margin-bottom:8px}

/* POST TEMPLATE (HIDDEN, FOR FUTURE) - INSTA SIZES */
.post{margin-bottom:8px;background:rgba(255,255,255,0.03);border-top:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06);}
.pHead{height:56px;padding:0 12px;display:flex;align-items:center;gap:10px}
.pHead img{width:32px;height:32px;border-radius:50%;background:#222}
.pHead .name{font-size:14px;font-weight:600;color:#fff}
.pHead .music{font-size:11px;color:#a0a0a0;display:block}
.pHead .follow{margin-left:auto;padding:6px 16px;border-radius:8px;font-size:14px;font-weight:600;background:rgba(255,255,255,0.12);color:#fff;border:none;backdrop-filter:blur(10px)}
.pHead .dots{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.pImg{width:100%;aspect-ratio:1/1;background:#111;position:relative}
.badge{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.75);color:#fff;font-size:12px;padding:5px 10px;border-radius:12px}
.pActions{height:48px;display:flex;align-items:center;gap:16px;padding:0 12px;font-size:24px;color:#fff}
.pActions .right{margin-left:auto;display:flex;gap:16px}

/* BOTTOM NAV - INSTA SIZE 50px + GLASS */
.bottomNav{position:fixed;bottom:10px;left:10px;right:10px;max-width:460px;margin:0 auto;height:62px;display:flex;justify-content:space-around;align-items:center;background:rgba(18,18,22,0.72);backdrop-filter:blur(32px) saturate(1.8);border:1px solid rgba(255,255,255,0.13);border-radius:24px;box-shadow:0 16px 40px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.12);z-index:200;}
.bottomNav button{width:44px;height:44px;border-radius:14px;border:none;background:transparent;color:#8e8e8e;font-size:26px;display:flex;align-items:center;justify-content:center}
.bottomNav button.active{color:#fff;background:rgba(255,255,255,0.10)}
.bottomNav img{width:26px;height:26px;border-radius:50%;border:1.5px solid #fff}
.dot{position:absolute;top:6px;right:8px;width:8px;height:8px;background:#FF3040;border-radius:50%;border:1.5px solid #000}
.createSheet{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(18px);z-index:500;display:none;align-items:flex-end;justify-content:center}
.createSheet.show{display:flex}
.sheet{width:100%;max-width:480px;background:rgba(22,22,26,0.96);border:1px solid rgba(255,255,255,0.12);border-top-left-radius:26px;border-top-right-radius:26px;padding:18px 16px 30px}
