<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore & Categories</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #120b20; color: #fff; padding-bottom: 90px; }
        header { padding: 20px; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
        .category-chips { display: flex; gap: 10px; overflow-x: auto; padding: 0 20px; margin-bottom: 20px; scrollbar-width: none; }
        .category-chips::-webkit-scrollbar { display: none; }
        .chip { background: #251b37; padding: 8px 16px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; border: 1px solid #3f305c; color: #b0a8c2; }
        .chip.active { background: #c084fc; color: #120b20; font-weight: 600; border-color: #c084fc; }
        .explore-list { padding: 0 20px; display: flex; flex-direction: column; gap: 15px; }
        .explore-card { background: #251b37; border-radius: 15px; padding: 15px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); }
        .explore-card h3 { font-size: 15px; margin-bottom: 5px; color: #fff; }
        .explore-card p { font-size: 12px; color: #b0a8c2; }
        /* Bottom Navigation Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(30, 20, 48, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; height: 70px; border-top: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000; }
        .nav-item { text-align: center; color: #9c92b5; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .nav-item.active { color: #ffffff; }
        .fab-btn { width: 52px; height: 52px; background: linear-gradient(135deg, #c084fc, #818cf8); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; box-shadow: 0 4px 15px rgba(192, 132, 252, 0.5); margin-top: -18px; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <span>📺 Explore Channels</span>
    </header>

    <div class="category-chips">
        <div class="chip active">All Videos</div>
        <div class="chip">Trending</div>
        <div class="chip">Gaming</div>
        <div class="chip">Vlogs</div>
        <div class="chip">Tech</div>
    </div>

    <div class="explore-list" id="explore-container">
        <p style="color: #b0a8c2; font-size: 13px; text-align: center; margin-top: 20px;">Data load ho raha hai...</p>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span>🏠</span> Home</a>
        <a href="feed.html" class="nav-item"><span>🎞️</span> Feed</a>
        <a href="upload.html" class="fab-btn">+</a>
        <a href="explore.html" class="nav-item active"><span>📺</span> Explore</a>
        <a href="login.html" class="nav-item"><span>👤</span> Profile</a>
    </nav>

    <script type="module">
        import { db, collection, getDocs, query, orderBy } from "./firebase-config.js";

        async function loadExploreData() {
            const container = document.getElementById('explore-container');
            try {
                const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                if(querySnapshot.empty) {
                    container.innerHTML = `<p style="color: #b0a8c2; font-size: 13px; text-align: center;">Koi video uplabdh nahi hai.</p>`;
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const video = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'explore-card';
                    card.onclick = () => window.location.href = `watch.html?id=${docSnap.id}`;
                    card.innerHTML = `
                        <h3>${video.title}</h3>
                        <p>${video.views || 0} Views • By ${video.author || 'Creator'}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                container.innerHTML = `<p style="color: #ff6b6b; font-size: 13px; text-align: center;">Database error: Data load nahi ho saka.</p>`;
            }
        }

        loadExploreData();
    </script>
</body>
</html>
