<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUBE Explore</title>

<style>
body{
background:#06152f;
color:white;
font-family:Poppins,sans-serif;
padding:20px;
}

h1{
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.card{
height:180px;
border-radius:20px;
background:#1b2d52;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
}
</style>
</head>
<body>

<h1>🔍 Explore</h1>

<input type="text" placeholder="Search users, videos...">

<div class="grid">
<div class="card">🔥 Trending</div>
<div class="card">🎬 Reels</div>
<div class="card">🎵 Music</div>
<div class="card">🎮 Gaming</div>
<div class="card">📸 Creators</div>
<div class="card">⚡ Viral</div>
</div>

</body>
</html>
