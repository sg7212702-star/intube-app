<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUBE Story Upload</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#89c4ff,#ff9dd6,#caa6ff);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:450px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,.25);

border-radius:30px;

padding:25px;

box-shadow:0 10px 40px rgba(0,0,0,.15);
}

.logo{
text-align:center;
font-size:32px;
font-weight:700;
color:#ff4da6;
margin-bottom:20px;
}

.preview{
width:100%;
height:320px;

border-radius:20px;

overflow:hidden;

background:rgba(255,255,255,.15);

display:flex;
align-items:center;
justify-content:center;

color:white;
font-size:20px;
margin-bottom:20px;
}

.preview img,
.preview video{
width:100%;
height:100%;
object-fit:cover;
}

.upload-btn{
display:block;
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:16px;
font-weight:bold;
background:#ff4da6;
color:white;
margin-bottom:15px;
}

input[type=file]{
display:none;
}

textarea{
width:100%;
height:100px;
border:none;
outline:none;
padding:15px;
border-radius:15px;
resize:none;
background:rgba(255,255,255,.2);
color:white;
margin-bottom:15px;
}

textarea::placeholder{
color:white;
}

.post-btn{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#8a2be2;
color:white;
font-size:18px;
font-weight:bold;
}

</style>
</head>
<body>

<div class="card">

<div class="logo">
INTUBE STORY
</div>

<div class="preview" id="preview">
Preview Area
</div>

<label class="upload-btn">
Select Photo / Video
<input type="file" id="file" accept="image/*,video/*">
</label>

<textarea
placeholder="Write something for your story...">
</textarea>

<button class="post-btn">
Upload Story
</button>

</div>

<script>

const fileInput=document.getElementById('file');
const preview=document.getElementById('preview');

fileInput.addEventListener('change',()=>{

const file=fileInput.files[0];

if(!file) return;

const url=URL.createObjectURL(file);

if(file.type.startsWith('image')){

preview.innerHTML=
`<img src="${url}">`;

}else if(file.type.startsWith('video')){

preview.innerHTML=
`<video src="${url}" controls></video>`;

}

});

</script>

</body>
</html>
