<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeds - InTube</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" rel="stylesheet">
    <style>
        body { background: #120b20; color: #fff; font-family: 'Poppins', sans-serif; margin:0; padding:0; padding-bottom:90px; }
        .header { padding:16px 20px; font-weight:600; font-size:18px; position:sticky; top:0; background:#120b20; z-index:10; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; align-items:center; }
        #feedContainer { padding: 12px; display: flex; flex-direction: column; gap: 16px; max-width:500px; margin:0 auto; }
        .post-card { background: #1e1430; border:1px solid rgba(255,255,255,0.08); border-radius:18px; overflow:hidden; }
        .post-card video, .post-card img { width:100%; max-height:480px; object-fit:cover; background:#000; display:block; }
        .post-info { padding:12px 14px; }
        .post-user { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500; }
        .post-user img { width:28px; height:28px; border-radius:50%; }
        .post-actions { display:flex; gap:16px; font-size:20px; margin-top:10px; align-items:center; }
        .post-actions i { cursor:pointer; }
        .liked { color:#ff4d6d !important; }
        .caption { font-size:13px; color:#d0c8e0; margin-top:6px; }
        .comment-box { display:flex; gap:8px; margin-top:10px; }
        .comment-box input { flex:1; background:#120b20; border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:8px 14px; color:#fff; outline:none; font-size:13px; }
        .comment-box button { background:none; border:none; color:#c084fc; font-weight:600; cursor:pointer; }
        .empty { text-align:center; color:#9c92b5; margin-top:60px; font-size:14px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(30, 20, 48, 0.95); backdrop-filter:blur(10px); display: flex; justify-content: space-around; align-items: center; height: 70px; border-top: 1px solid rgba(255,255,255,0.1); z-index:99; }
        .nav-item { text-align: center; color: #9c92b5; text-decoration: none; font-size: 11px; display:flex; flex-direction:column; align-items:center; gap:2px; }
        .nav-item.active { color: #fff; }
        .fab-btn { width: 52px; height: 52px; background: linear-gradient(135deg, #c084fc, #818cf8); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; margin-top: -18px; text-decoration: none; box-shadow:0 8px 20px rgba(192,132,252,0.4); }
        #notifCount { position:absolute; top:-6px; right:-8px; background:#ff3040; font-size:9px; padding:2px 5px; border-radius:10px; display:none; }
    </style>
</head>
<body>
    <div class="header">
        <span>App Feeds & Updates</span>
        <a href="notifications.html" style="position:relative;color:#fff;text-decoration:none;font-size:20px"><i class="ri-heart-3-line"></i><span id="notifCount"></span></a>
    </div>
    <p style="color:#b0a8c2; font-size:13px; padding:0 20px;">Firestore connected real-time short feed stream.</p>

    <div id="feedContainer"><div class="empty">Loading feeds... ⏳</div></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="ri-home-5-line" style="font-size:20px"></i> Home</a>
        <a href="feed.html" class="nav-item active"><i class="ri-clapperboard-fill" style="font-size:20px"></i> Feed</a>
        <a href="upload.html" class="fab-btn">+</a>
        <a href="explore.html" class="nav-item"><i class="ri-compass-3-line" style="font-size:20px"></i> Explore</a>
        <a href="login.html" class="nav-item"><i class="ri-user-3-line" style="font-size:20px"></i> Profile</a>
    </nav>

<script type="module">
import { db } from './firebase-config.js';
import { collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { toggleLike, postComment, bindLikeSystem, bindCommentCount, initNotifications } from "./notifications.js";

const feedContainer = document.getElementById('feedContainer');

// Notifications Bell Count
initNotifications();

const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));

onSnapshot(q, (snapshot) => {
    if(snapshot.empty){
        feedContainer.innerHTML = `<div class="empty">Abhi koi post nahi hai.<br>Upload se pehla post daal 🔥</div>`;
        return;
    }
    feedContainer.innerHTML = "";
    snapshot.forEach((docSnap) => {
        const post = docSnap.data();
        const id = docSnap.id;
        const ownerId = post.userId || post.uid || post.ownerId || "unknown";
        const isVideo = post.mediaUrl && (post.mediaUrl.includes(".mp4") || post.mediaUrl.includes("video"));

        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
            ${isVideo ? `<video src="${post.mediaUrl}" controls playsinline></video>` : `<img src="${post.mediaUrl}" loading="lazy">`}
            <div class="post-info">
                <div class="post-user"><img src="${post.userPic || 'https://i.pravatar.cc/100'}"><span>${post.userName || 'sg7212'}</span><span style="color:#9c92b5;font-weight:300;margin-left:auto">now</span></div>
                <div class="post-actions">
                    <i class="ri-heart-3-line" id="likeBtn_${id}" onclick="toggleLike('${id}','${ownerId}')"></i>
                    <i class="ri-chat-3-line" onclick="document.getElementById('cmt_${id}').focus()"></i>
                </div>
                <div class="caption"><b>${post.userName || 'user'}</b> ${post.caption || ''}</div>
                <div style="font-size:12px;color:#9c92b5;margin-top:4px"><span id="likeCount_${id}">0</span> likes • <span id="commentCount_${id}">0</span> comments</div>
                <div class="comment-box">
                    <input id="cmt_${id}" placeholder="Add a comment...">
                    <button onclick="handleCmt('${id}','${ownerId}')">Post</button>
                </div>
            </div>
        `;
        feedContainer.appendChild(card);

        // LIVE COUNT BIND - YAHI SE LIKE/COMMENT BUTTON LIVE HONGE
        bindLikeSystem(id);
        bindCommentCount(id);
    });
});

window.toggleLike = toggleLike;
window.handleCmt = async (postId, ownerId) => {
    const input = document.getElementById(`cmt_${postId}`);
    const text = input.value.trim();
    if(!text) return;
    input.value = "";
    await postComment(postId, ownerId, text);
};
</script>
</body>
</html>
