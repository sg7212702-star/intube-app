<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feeds - InTube</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" rel="stylesheet">
    <style>
        body { background: #120b20; color: #fff; font-family: 'Poppins', sans-serif; margin:0; padding:0; padding-bottom:90px; }
        .header { padding:16px 20px; font-weight:600; font-size:18px; position:sticky; top:0; background:#120b20; z-index:10; border-bottom:1px solid rgba(255,255,255,0.08); }
        #feedContainer { padding: 12px; display: flex; flex-direction: column; gap: 16px; max-width:500px; margin:0 auto; }
        .post-card { background: #1e1430; border:1px solid rgba(255,255,255,0.08); border-radius:18px; overflow:hidden; }
        .post-card video, .post-card img { width:100%; max-height:480px; object-fit:cover; background:#000; display:block; }
        .post-info { padding:12px 14px; }
        .post-user { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500; }
        .post-user img { width:28px; height:28px; border-radius:50%; }
        .post-actions { display:flex; gap:16px; font-size:20px; margin-top:10px; }
        .post-actions i { cursor:pointer; }
        .liked { color:#ff4d6d; }
        .caption { font-size:13px; color:#d0c8e0; margin-top:6px; }
        .empty { text-align:center; color:#9c92b5; margin-top:60px; font-size:14px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(30, 20, 48, 0.95); backdrop-filter:blur(10px); display: flex; justify-content: space-around; align-items: center; height: 70px; border-top: 1px solid rgba(255,255,255,0.1); z-index:99; }
        .nav-item { text-align: center; color: #9c92b5; text-decoration: none; font-size: 11px; display:flex; flex-direction:column; align-items:center; gap:2px; }
        .nav-item.active { color: #fff; }
        .fab-btn { width: 52px; height: 52px; background: linear-gradient(135deg, #c084fc, #818cf8); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; margin-top: -18px; text-decoration: none; box-shadow:0 8px 20px rgba(192,132,252,0.4); }
    </style>
</head>
<body>
    <div class="header">App Feeds & Updates</div>
    <p style="color:#b0a8c2; font-size:13px; padding:0 20px;">Firestore connected real-time short feed stream.</p>

    <div id="feedContainer"><div class="empty">Loading feeds... ⏳</div></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="ri-home-5-line" style="font-size:20px"></i> Home</a>
        <a href="feed.html" class="nav-item active"><i class="ri-clapperboard-fill" style="font-size:20px"></i> Feed</a>
        <a href="upload.html" class="fab-btn">+</a>
        <a href="explore.html" class="nav-item"><i class="ri-compass-3-line" style="font-size:20px"></i> Explore</a>
        <a href="login.html" class="nav-item"><i class="ri-user-3-line" style="font-size:20px"></i> Profile</a>
    </nav>

<script type="module">
import { db } from './firebase-config.js';
import { collection, query, orderBy, onSnapshot, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const feedContainer = document.getElementById('feedContainer');

const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));

onSnapshot(q, (snapshot) => {
    if(snapshot.empty){
        feedContainer.innerHTML = `<div class="empty">Abhi koi post nahi hai.<br>Upload se pehla post daal 🔥</div>`;
        return;
    }
    feedContainer.innerHTML = "";
    snapshot.forEach((docSnap) => {
        const post = docSnap.data();
        const id = docSnap.id;
        const isVideo = post.mediaUrl && post.mediaUrl.includes(".mp4");

        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
            ${isVideo ? `<video src="${post.mediaUrl}" controls playsinline loop></video>` : `<img src="${post.mediaUrl}" loading="lazy">`}
            <div class="post-info">
                <div class="post-user"><img src="${post.userPic || 'https://i.pravatar.cc/100'}"><span>${post.userName || 'sg7212'}</span><span style="color:#9c92b5;font-weight:300;margin-left:auto">${post.createdAt ? new Date(post.createdAt.seconds*1000).toLocaleDateString() : 'now'}</span></div>
                <div class="post-actions">
                    <i class="ri-heart-3-line" id="like-${id}" onclick="likePost('${id}')"></i>
                    <i class="ri-chat-3-line"></i>
                    <i class="ri-share-line"></i>
                </div>
                <div class="caption"><b>${post.userName || 'user'}</b> ${post.caption || ''}</div>
                <div style="font-size:12px;color:#9c92b5;margin-top:4px"><span id="count-${id}">${post.likes || 0}</span> likes</div>
            </div>
        `;
        feedContainer.appendChild(card);
    });
});

window.likePost = async (id) => {
    const icon = document.getElementById(`like-${id}`);
    const countEl = document.getElementById(`count-${id}`);
    const isLiked = icon.classList.contains('ri-heart-3-fill');
    
    if(isLiked){
        icon.className = 'ri-heart-3-line';
        countEl.innerText = parseInt(countEl.innerText) - 1;
        await updateDoc(doc(db, "posts", id), { likes: increment(-1) });
    } else {
        icon.className = 'ri-heart-3-fill liked';
        icon.style.transform = 'scale(1.3)';
        setTimeout(()=>icon.style.transform='scale(1)',150);
        countEl.innerText = parseInt(countEl.innerText) + 1;
        await updateDoc(doc(db, "posts", id), { likes: increment(1) });
    }
}
</script>
</body>
</html>
