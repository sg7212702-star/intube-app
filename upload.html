<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Metadata</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background: #120b20; color: #fff; font-family: 'Poppins', sans-serif; padding: 25px; }
        .form-container { max-width: 500px; margin: auto; background: #251b37; padding: 25px; border-radius: 20px; }
        .form-group { margin-bottom: 18px; }
        label { font-size: 13px; color: #b0a8c2; }
        input, textarea { width: 100%; padding: 12px; background: #120b20; border: 1px solid #3f305c; border-radius: 10px; color: #fff; margin-top: 6px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #c084fc, #818cf8); border: none; border-radius: 10px; color: #fff; font-weight: 600; cursor: pointer; font-size: 15px; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #c084fc; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Publish Video Details</h2>
        <p style="color:#b0a8c2; font-size:12px; margin-bottom:20px;">Storage cost bachane ke liye direct database entry karein.</p>
        
        <div class="form-group">
            <label>Video Title</label>
            <input type="text" id="videoTitle" placeholder="Jaise: My Travel Vlog">
        </div>
        <div class="form-group">
            <label>Video Link / URL (YouTube/External Link)</label>
            <input type="text" id="videoUrl" placeholder="https://...">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea id="videoDesc" rows="3" placeholder="Video ke baare me likhein..."></textarea>
        </div>
        
        <button id="publishBtn">Publish to Database</button>
        <a href="index.html" class="back-link">← Cancel</a>
    </div>

    <script type="module">
        import { auth, db, addDoc, collection } from "./firebase-config.js";

        const publishBtn = document.getElementById('publishBtn');

        publishBtn.onclick = async () => {
            const title = document.getElementById('videoTitle').value.trim();
            const url = document.getElementById('videoUrl').value.trim();
            const desc = document.getElementById('videoDesc').value.trim();
            const user = auth.currentUser;

            if (!title || !url) {
                alert("Kripya Title aur Video URL bharein!");
                return;
            }

            try {
                publishBtn.innerText = "Publishing...";
                publishBtn.disabled = true;

                await addDoc(collection(db, "videos"), {
                    title: title,
                    videoUrl: url,
                    description: desc,
                    author: user ? user.displayName : "Guest Creator",
                    authorEmail: user ? user.email : "anonymous",
                    views: 0,
                    createdAt: new Date()
                });

                alert("Video successfully published!");
                window.location.href = "index.html";
            } catch (error) {
                alert("Error: " + error.message);
                publishBtn.innerText = "Publish to Database";
                publishBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
