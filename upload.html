<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Upload - INTUBE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{background:radial-gradient(circle at 20% 20%, #2a1f45 0%, #120b20 40%, #0a0612 100%) fixed!important; color:#fff; font-family:'Poppins'; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0}.box{background:rgba(30,20,48,0.6); backdrop-filter:blur(18px); padding:24px; border-radius:20px; width:90%; max-width:380px; border:1px solid rgba(255,255,255,0.15)}input,textarea{width:100%; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.15); color:#fff; padding:12px; border-radius:12px; margin:10px 0; box-sizing:border-box; font-family:Poppins}button{width:100%; background:linear-gradient(135deg,#c084fc,#818cf8); border:none; padding:13px; border-radius:12px; color:#fff; font-weight:600; cursor:pointer; font-family:Poppins}</style></head><body>
<div class="box">
<h3 style="margin:0 0 10px">Upload Video 🔥</h3>
<input type="file" id="file" accept="video/*,image/*">
<textarea id="caption" placeholder="Caption likho..."></textarea>
<div id="msg" style="font-size:12px; color:#c084fc; margin-top:8px"></div>
<button id="btn">Post to INTUBE</button>
<a href="index.html" style="display:block; text-align:center; color:#aaa; margin-top:14px; text-decoration:none; font-size:13px">← Back to Home</a>
</div>
<script type="module">
import { db, auth } from "./firebase-config.js";
import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const CLOUD_NAME="kujnbe0a"; const PRESET="intube_free";
document.getElementById("btn").onclick=async()=>{
 const f=document.getElementById("file").files[0]; const cap=document.getElementById("caption").value;
 if(!f) return alert("Video select karo!");
 const m=document.getElementById("msg"); m.innerText="Uploading... 0% - wait karo";
 document.getElementById("btn").disabled=true;
 try{
  const fd=new FormData(); fd.append("file",f); fd.append("upload_preset",PRESET);
  const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,{method:"POST",body:fd});
  const d=await r.json();
  if(!d.secure_url) throw new Error(d.error?.message||"Preset save nahi hua? Unsigned karo");
  m.innerText="Saving...";
  await addDoc(collection(db,"posts"),{mediaUrl:d.secure_url,caption:cap,userName:auth.currentUser?.email||"Guest",userId:auth.currentUser?.uid||"guest",likes:0,likedBy:[],followers:[],commentsCount:0,createdAt:serverTimestamp()});
  alert("Ho Gaya Upload! 🔥"); location.href="index.html";
 }catch(e){ alert(e.message); m.innerText="Error: "+e.message; document.getElementById("btn").disabled=false; }
}
</script></body></html>
