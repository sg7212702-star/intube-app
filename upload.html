<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload - INTUBE REAL</title>
<script type="importmap">
{ "imports": { "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js", "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js" } }
</script>
</head>
<body style="background:#000;color:#fff;padding:20px;font-family:sans-serif">
<h2>Upload Video (Real Public)</h2>
<input type="file" id="videoFile" accept="video/*"><br><br>
<input type="text" id="caption" placeholder="Caption likho..." style="width:90%;padding:12px;border-radius:8px"><br><br>
<button id="uploadBtn" style="padding:12px 25px;background:#ff004f;color:#fff;border:none;border-radius:8px;font-weight:bold">Upload Karo</button>
<p id="status"></p>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, addDoc, serverTimestamp } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyDibgzp64G1QB7Pma-7Zx4yMAV06go8cNU",
  authDomain: "intube-61cca.firebaseapp.com",
  projectId: "intube-61cca",
  storageBucket: "intube-61cca.firebasestorage.app",
  messagingSenderId: "627409965607",
  appId: "1:627409965607:web:a1d71800d812fe668b7402"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CLOUD_NAME = "kujnbe0a";
const UPLOAD_PRESET = "intube_free";

document.getElementById('uploadBtn').onclick = async () => {
  const file = document.getElementById('videoFile').files[0];
  const caption = document.getElementById('caption').value;
  if(!file){ alert("Video select karo"); return; }

  document.getElementById('status').innerText = "Uploading to Cloudinary...";

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', UPLOAD_PRESET);

  try {
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, { method: 'POST', body: formData });
    const data = await res.json();

    if(data.secure_url){
      document.getElementById('status').innerText = "Saving to Database...";
      await addDoc(collection(db, "videos"), {
        videoUrl: data.secure_url,
        caption: caption,
        userName: localStorage.getItem('userName') || 'Intube User',
        userPhoto: localStorage.getItem('userPhoto') || '',
        timestamp: serverTimestamp()
      });
      document.getElementById('status').innerText = "✅ PUBLIC HO GAYA! Sabko dikhega.";
      setTimeout(()=> window.location.href="index.html", 1500);
    } else {
      document.getElementById('status').innerText = "Error: " + data.error.message;
    }
  } catch(e){
    document.getElementById('status').innerText = "Error: " + e.message;
  }
};
</script>
</body>
</html>
