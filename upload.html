<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
body{background:radial-gradient(circle at 20% 20%, #2a1f45 0%, #120b20 40%, #0a0612 100%) fixed; color:#fff; font-family:'Poppins'; margin:0; padding:20px 20px 90px; min-height:100vh}
.box{background:rgba(30,20,48,0.42); backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,0.13); border-radius:20px; padding:20px; max-width:500px; margin:20px auto}
input,textarea,select{width:100%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:12px; color:#fff; margin-top:10px; box-sizing:border-box}
button{width:100%; margin-top:16px; padding:14px; border-radius:999px; border:none; background:linear-gradient(135deg,#c084fc,#818cf8); color:#fff; font-weight:600; cursor:pointer}
.bottom-nav{position:fixed; bottom:0; left:0; width:100%; background:rgba(18,11,32,0.55); backdrop-filter:blur(24px); display:flex; justify-content:space-around; align-items:center; height:70px; border-top:1px solid rgba(255,255,255,0.12)}
.nav-item{color:#9c92b5; text-decoration:none; font-size:11px}.fab-btn{width:56px; height:56px; background:linear-gradient(135deg,#c084fc,#818cf8); border-radius:50%; display:flex; justify-content:center; align-items:center; color:#fff; font-size:26px; margin-top:-18px; text-decoration:none}
</style></head><body>
<div class="box"><h3>📤 New Post / Video</h3>
<select id="type"><option value="post">Post (Insta)</option><option value="video">Video (YouTube)</option></select>
<input type="file" id="file" accept="image/*,video/*">
<textarea id="caption" placeholder="Caption / Title..."></textarea>
<button id="uploadBtn">Upload Now</button><p id="status" style="color:#b8b0cc; font-size:13px; text-align:center"></p>
</div>
<nav class="bottom-nav"><a href="index.html" class="nav-item">🏠 Home</a><a href="feed.html" class="nav-item">🎞️ Feed</a><a href="upload.html" class="fab-btn">+</a><a href="explore.html" class="nav-item">📺 Explore</a><a href="login.html" class="nav-item">👤 Profile</a></nav>
<script type="module">
import { db, auth, serverTimestamp } from "./firebase-config.js";
import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
document.getElementById('uploadBtn').onclick=async()=>{
 const file=document.getElementById('file').files[0]; const caption=document.getElementById('caption').value;
 if(!file) return alert('File chuno'); if(!caption) return alert('Caption likho');
 document.getElementById('status').innerText='⏳ Uploading to Cloudinary...';
 const form=new FormData(); form.append('file',file); form.append('upload_preset','intube_unsigned');
 try{
  const res=await fetch('https://api.cloudinary.com/v1_1/dcu3zhmui/auto/upload',{method:'POST',body:form});
  const data=await res.json(); if(!data.secure_url) throw new Error('Cloudinary fail');
  document.getElementById('status').innerText='⚡ Saving to Firebase...';
  await addDoc(collection(db,'posts'),{mediaUrl:data.secure_url, caption, title:caption, userName:auth.currentUser?.displayName||'Guest', uid:auth.currentUser?.uid||'guest', likes:0, likedBy:[], followers:[], comments:[], commentsCount:0, views:0, type:document.getElementById('type').value, createdAt:serverTimestamp()});
  document.getElementById('status').innerText='✅ Uploaded! Real-time feed me aa gaya';
  setTimeout(()=>location.href='index.html',1000);
 }catch(e){ document.getElementById('status').innerText='❌ Error: '+e.message }
}
</script></body></html>
