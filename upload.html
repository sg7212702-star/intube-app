<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUBE Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#06152f;
color:white;
padding:20px;
}

body::before{
content:"";
position:fixed;
width:400px;
height:400px;
background:#00bfff;
filter:blur(200px);
top:-120px;
left:-120px;
opacity:.25;
z-index:-1;
}

.glass{
background:rgba(255,255,255,.08);
backdrop-filter:blur(35px);
border:1px solid rgba(255,255,255,.12);
border-radius:30px;
}

.profile-card{
padding:25px;
text-align:center;
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
margin:auto;
background:linear-gradient(45deg,#00bfff,#7f5cff);
}

.username{
font-size:24px;
font-weight:700;
margin-top:15px;
}

.bio{
opacity:.8;
margin-top:10px;
}

.stats{
display:flex;
justify-content:space-around;
margin-top:25px;
}

.stat h2{
font-size:22px;
}

.edit-btn{
margin-top:25px;
padding:14px;
border:none;
width:100%;
border-radius:18px;
color:white;
font-weight:600;
background:linear-gradient(45deg,#00bfff,#7f5cff);
}

.posts{
margin-top:25px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.post{
height:120px;
border-radius:18px;
background:rgba(255,255,255,.08);
}

</style>
</head>

<body>

<div class="profile-card glass">

<div class="avatar"></div>

<div class="username">INTUBE User</div>

<div class="bio">
Creator • Video Lover • Premium Member
</div>

<div class="stats">

<div class="stat">
<h2>25</h2>
<p>Posts</p>
</div>

<div class="stat">
<h2>1.2K</h2>
<p>Followers</p>
</div>

<div class="stat">
<h2>530</h2>
<p>Following</p>
</div>

</div>

<button class="edit-btn">
Edit Profile
</button>

</div>

<div class="posts">

<div class="post glass"></div>
<div class="post glass"></div>
<div class="post glass"></div>
<div class="post glass"></div>
<div class="post glass"></div>
<div class="post glass"></div>

</div>

</body>
</html>
