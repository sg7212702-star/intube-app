<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUBE Upload</title>

<style>
body{
background:#0a0712;
font-family:sans-serif;
color:white;
padding:20px;
}

.box{
background:rgba(255,255,255,.08);
padding:20px;
border-radius:20px;
}

input,button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
}

button{
background:#7f5cff;
color:white;
font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h2>📤 Upload Video</h2>

<input type="text" id="title" placeholder="Video Title">

<input type="text" id="videoUrl" placeholder="Video URL">

<button id="uploadBtn">
Upload Video
</button>

<p id="status"></p>

</div>

<script type="module">

import { db } from "./firebase-config.js";

import {
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const btn = document.getElementById("uploadBtn");

btn.onclick = async ()=>{

const title = document.getElementById("title").value;
const videoUrl = document.getElementById("videoUrl").value;

if(!title || !videoUrl){
alert("Fill all fields");
return;
}

try{

await addDoc(collection(db,"videos"),{
title:title,
videoUrl:videoUrl,
createdAt:serverTimestamp()
});

document.getElementById("status").innerHTML =
"✅ Video Uploaded Successfully";

}catch(error){

document.getElementById("status").innerHTML =
"❌ "+error.message;

}

};

</script>

</body>
</html>
