<script type="module">

import {
db,
doc,
getDoc,
updateDoc,
increment
}
from "./firebase-config.js";

const id =
new URLSearchParams(
location.search
).get("id");

const ref =
doc(db,"videos",id);

const snap =
await getDoc(ref);

if(snap.exists()){

const v=snap.data();

document.getElementById("title")
.innerText=v.title;

await updateDoc(
ref,
{
views:increment(1)
}
);

}

</script>
