<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - InTube</title>
<style>
body{background:#120b20;color:#fff;font-family:Poppins,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:#1e1430;padding:30px;border-radius:20px;width:90%;max-width:340px;border:1px solid rgba(255,255,255,0.08);text-align:center}
button{width:100%;padding:12px;background:#fff;border:none;border-radius:12px;color:#000;font-weight:600;margin-top:16px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
button.google{background:linear-gradient(135deg,#c084fc,#818cf8);color:#fff}
</style>
</head>
<body>
<div class="card">
<h3>Login to InTube</h3>
<p style="font-size:12px;opacity:.5">Google se login karo</p>
<button class="google" onclick="googleLogin()"> <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="18"> Continue with Google</button>
<p id="msg" style="font-size:12px;margin-top:16px;opacity:.6"></p>
</div>

<script type="module">
import { db } from './firebase-config.js';
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const auth = getAuth();
const provider = new GoogleAuthProvider();

window.googleLogin = async()=>{
  try{
    document.getElementById('msg').innerText="Google opening...";
    const result = await signInWithPopup(auth, provider);
    const user = result.user;
    saveUser(user);
  }catch(e){
    document.getElementById('msg').innerText=e.message;
    console.log(e);
  }
};

function saveUser(user){
  // IMPORTANT - Ye tumhare notifications.js ke liye
  localStorage.setItem('my_user_id', user.uid);
  localStorage.setItem('my_name', user.displayName || user.email.split('@')[0]);
  localStorage.setItem('username', user.displayName);
  localStorage.setItem('userPic', user.photoURL || "");

  // Firebase users collection
  setDoc(doc(db, "users", user.uid), {
    uid: user.uid,
    userName: user.displayName,
    email: user.email,
    userPic: user.photoURL,
    createdAt: new Date()
  }, {merge:true});

  document.getElementById('msg').innerText="Logged in as " + user.displayName + " → Redirecting...";
  setTimeout(()=>window.location.href="feed.html", 800);
}

// Auto check - agar pehle se login hai
onAuthStateChanged(auth, (user)=>{
  if(user){
    saveUser(user);
  }
});
</script>
</body>
</html>
