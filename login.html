<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - Google Accounts</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
 "imports": {
  "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
  "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
 }
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Google Sans,Roboto,Arial}
body{background:#f0f4f9;display:flex;align-items:center;justify-content:center;min-height:100vh}
.g-card{background:#fff;width:92%;max-width:900px;border-radius:28px;display:flex;overflow:hidden;min-height:380px}
.left{flex:1;padding:40px}
.right{flex:1;padding:40px;display:flex;flex-direction:column;justify-content:center}
.logo{width:48px;margin-bottom:20px}
h1{font-size:36px;font-weight:400;color:#1f1f1f}
p{color:#444;margin-top:12px;font-size:14px}
.g-btn{border:1px solid #747775;padding:12px 24px;border-radius:30px;background:#fff;display:flex;align-items:center;gap:12px;cursor:pointer;font-size:14px;font-weight:500;margin-top:40px;width:fit-content}
.g-btn:hover{background:#f8f9ff}
#msg{color:#d93025;font-size:13px;margin-top:15px}
@media(max-width:700px){.g-card{flex-direction:column;border-radius:0;width:100%;min-height:100vh}}
</style>
</head>
<body>
<div class="g-card">
<div class="left">
<img class="logo" src="https://www.google.com/images/branding/product/ico/googleg_lodp.ico">
<h1>Sign in</h1>
<p>Use your Google Account to continue to INTUBE</p>
</div>
<div class="right">
<p style="font-size:14px;color:#1f1f1f">Continue to INTUBE 🔥</p>
<button id="googleBtn" class="g-btn">
<img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20"> Continue with Google
</button>
<p id="msg"></p>
<p style="margin-top:40px;font-size:12px;color:#666">Secure login by Google • Firebase Auth</p>
</div>
</div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence } from "firebase/auth";

const firebaseConfig = {
  apiKey: "AIzaSyDibgzp64G1QB7Pma-7Zx4yMAV06go8cNU",
  authDomain: "intube-61cca.firebaseapp.com",
  projectId: "intube-61cca",
  storageBucket: "intube-61cca.firebasestorage.app",
  messagingSenderId: "627409965607",
  appId: "1:627409965607:web:a1d71800d812fe668b7402"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({prompt: 'select_account'});

// FIX 1: Persistence
setPersistence(auth, browserLocalPersistence);

// FIX 2: Redirect Result Check
getRedirectResult(auth).then((res)=>{
  if(res?.user) location.href = "index.html";
}).catch(e=>{ document.getElementById('msg').innerText = e.message; });

// FIX 3: Hybrid Login
document.getElementById('googleBtn').onclick = async ()=>{
  document.getElementById('msg').innerText = "Opening Google...";
  try{
    await signInWithPopup(auth, provider);
  }catch(err){
    console.log("Popup failed, redirecting...", err.code);
    await signInWithRedirect(auth, provider);
  }
};

onAuthStateChanged(auth, (user)=>{
  if(user){
    localStorage.setItem('userName', user.displayName);
    localStorage.setItem('userPhoto', user.photoURL);
    location.href = "index.html";
  }
});
</script>
</body>
</html>
