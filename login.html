<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUBE Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0a0712;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.box{
width:100%;
max-width:400px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
padding:25px;
border-radius:25px;
text-align:center;
border:1px solid rgba(255,255,255,.15);
}

h1{
margin-bottom:20px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
margin-top:12px;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.google{
background:#4285F4;
color:white;
}

.phone{
background:#7f5cff;
color:white;
}

input{
width:100%;
padding:15px;
margin-top:12px;
border:none;
border-radius:15px;
outline:none;
}

#status{
margin-top:15px;
font-size:14px;
}

#recaptcha-container{
margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<h1>INTUBE Login</h1>

<button id="googleBtn" class="google">
Continue with Google
</button>

<input
type="tel"
id="phone"
placeholder="Enter Mobile Number">

<button id="phoneBtn" class="phone">
Get OTP
</button>

<div id="recaptcha-container"></div>

<p id="status"></p>

</div>

<script type="module">

import { auth } from "./firebase-config.js";

import {
GoogleAuthProvider,
signInWithPopup,
RecaptchaVerifier,
signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const googleBtn =
document.getElementById("googleBtn");

const phoneBtn =
document.getElementById("phoneBtn");

const status =
document.getElementById("status");

/* Google Login */

googleBtn.onclick = async () => {

try{

const provider =
new GoogleAuthProvider();

const result =
await signInWithPopup(auth, provider);

status.innerHTML =
"✅ Welcome " +
(result.user.displayName || "User");

setTimeout(()=>{
window.location.href="index.html";
},1000);

}catch(err){

status.innerHTML =
"❌ " + err.message;

}

};

/* Recaptcha */

window.recaptchaVerifier =
new RecaptchaVerifier(
auth,
"recaptcha-container",
{
size:"normal"
}
);

/* Phone Login */

phoneBtn.onclick = async () => {

const userNumber =
document.getElementById("phone").value.trim();

if(userNumber.length !== 10){

status.innerHTML =
"❌ Enter 10 digit mobile number";

return;

}

const phone = "+91" + userNumber;

try{

const confirmation =
await signInWithPhoneNumber(
auth,
phone,
window.recaptchaVerifier
);

const otp =
prompt("Enter OTP");

if(!otp) return;

await confirmation.confirm(otp);

status.innerHTML =
"✅ Phone Login Success";

setTimeout(()=>{
window.location.href="index.html";
},1000);

}catch(err){

status.innerHTML =
"❌ " + err.message;

}

};

</script>

</body>
</html>
