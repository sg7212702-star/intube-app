<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaySphere - Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #120b20; color: #fff; padding-bottom: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { background: #251b37; padding: 25px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); }
        .auth-card h2 { margin-bottom: 5px; font-size: 20px; color: #fff; }
        .auth-card p { color: #b0a8c2; font-size: 12px; margin-bottom: 15px; }
        .input-box { width: 100%; padding: 11px 12px; background: #120b20; border: 1px solid #3f305c; border-radius: 10px; color: #fff; margin-bottom: 12px; font-size: 13px; outline: none; }
        .input-box:focus { border-color: #c084fc; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; background: linear-gradient(135deg, #c084fc, #818cf8); color: #fff; margin-top: 5px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .link-text { font-size: 12px; color: #b0a8c2; margin-top: 15px; display: block; text-decoration: none; }
        .link-text span { color: #c084fc; font-weight: 500; }
        /* Bottom Navigation Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(30, 20, 48, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; height: 70px; border-top: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000; }
        .nav-item { text-align: center; color: #9c92b5; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .nav-item.active { color: #ffffff; }
        .fab-btn { width: 52px; height: 52px; background: linear-gradient(135deg, #c084fc, #818cf8); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; box-shadow: 0 4px 15px rgba(192, 132, 252, 0.5); margin-top: -18px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Create Account</h2>
        <p>PlaySphere join karne ke liye details bharein</p>
        
        <div id="signupForm">
            <input type="text" id="nameInput" class="input-box" placeholder="Full Name">
            <input type="email" id="emailInput" class="input-box" placeholder="Email Address">
            <input type="password" id="passInput" class="input-box" placeholder="Password (min 6 characters)">
            <button id="signupBtn" class="btn">Sign Up</button>
        </div>

        <a href="login.html" class="link-text">Pehle se account hai? <span>Login karein</span></a>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span>🏠</span> Home</a>
        <a href="feed.html" class="nav-item"><span>🎞️</span> Feed</a>
        <a href="upload.html" class="fab-btn">+</a>
        <a href="explore.html" class="nav-item"><span>📺</span> Explore</a>
        <a href="login.html" class="nav-item active"><span>👤</span> Profile</a>
    </nav>

    <script type="module">
        import { auth } from "./firebase-config.js";
        import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const signupBtn = document.getElementById('signupBtn');
        const nameInput = document.getElementById('nameInput');
        const emailInput = document.getElementById('emailInput');
        const passInput = document.getElementById('passInput');

        signupBtn.onclick = async () => {
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passInput.value.trim();

            if (!name || !email || !password) {
                alert("Kripya sabhi fields (Name, Email, Password) bharein!");
                return;
            }

            if (password.length < 6) {
                alert("Password kam se kam 6 characters ka hona chahiye!");
                return;
            }

            try {
                signupBtn.innerText = "Creating Account...";
                signupBtn.disabled = true;

                // Firebase me naya user create karna
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                
                // User ka Display Name update karna
                await updateProfile(userCredential.user, {
                    displayName: name
                });

                alert("Account successfully create ho gaya!");
                window.location.href = "index.html";
            } catch (error) {
                alert("Signup Error: " + error.message);
                signupBtn.innerText = "Sign Up";
                signupBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
