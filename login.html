<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InstaPro • Login</title>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
*{margin:0; padding:0; box-sizing:border-box}
body{height:100vh; background:#000; display:flex; align-items:center; justify-content:center; font-family:-apple-system,BlinkMacSystemFont,sans-serif; color:#fff;}
.bg{position:fixed; inset:0; background: radial-gradient(1200px 600px at 10% -10%, #feda75 0%, transparent 40%), radial-gradient(800px 500px at 90% 90%, #d62976 0%, transparent 40%), radial-gradient(1000px 600px at 50% 50%, #962fbf55 0%, transparent 50%), #000;}
.wrap{position:relative; width:100%; max-width:380px; margin:12px;}
.card{width:100%; padding:28px 24px; border-radius:22px; background:rgba(18,18,18,0.72); backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%); border:1px solid rgba(255,255,255,.12); box-shadow:0 20px 60px rgba(0,0,0,.6);}
.logo{font-family:'Grand Hotel',cursive; font-size:44px; text-align:center; letter-spacing:1px;}
.tag{font-size:12px; opacity:.5; text-align:center; margin-bottom:18px; margin-top:2px;}
.tabs{display:flex; background:rgba(255,255,255,.08); border-radius:12px; padding:4px; margin-bottom:16px; border:1px solid rgba(255,255,255,.08);}
.tab{flex:1; padding:10px; border-radius:9px; text-align:center; font-size:14px; font-weight:600; cursor:pointer; transition:.25s; opacity:.6;}
.tab.active{background:rgba(255,255,255,.95); color:#000; opacity:1; box-shadow:0 2px 8px rgba(0,0,0,.3);}
.input{width:100%; padding:13px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.08); color:#fff; outline:none; font-size:14px; margin-bottom:10px; transition:.2s;}
.input:focus{border-color:#0095f6; background:rgba(255,255,255,.12);}
.input::placeholder{color:rgba(255,255,255,.4);}
.btn{width:100%; padding:13px; border-radius:12px; border:0; background:#0095f6; color:#fff; font-weight:700; font-size:14px; cursor:pointer; transition:.2s; display:flex; align-items:center; justify-content:center; gap:8px;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.5;}
.btn-google{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); backdrop-filter:blur(10px);}
.btn-google:hover{background:rgba(255,255,255,.15);}
.divider{display:flex; align-items:center; gap:12px; margin:16px 0; font-size:12px; opacity:.4;}
.divider div{flex:1; height:1px; background:rgba(255,255,255,.15);}
.error{font-size:12px; color:#ff3040; min-height:16px; text-align:center; margin-bottom:8px;}
.foot{font-size:12px; text-align:center; opacity:.5; margin-top:14px; line-height:1.4;}
.foot b{color:#fff; cursor:pointer;}
#recaptcha-container{margin:8px 0;display:flex;justify-content:center;min-height:1px;}
.phone-row{display:flex;gap:8px;}
.phone-code{width:92px;flex-shrink:0;}
#otpForm{display:none;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
<div class="card">
  <div class="logo">InstaPro</div>
  <div class="tag">Glass • Transparent • Instagram</div>

  <div class="tabs">
    <div id="tabLogin" class="tab active">Log in</div>
    <div id="tabSignup" class="tab">Sign up</div>
  </div>

  <div id="errorMsg" class="error"></div>

  <!-- LOGIN -->
  <div id="loginForm">
    <input id="loginEmail" class="input" type="email" placeholder="Email">
    <input id="loginPass" class="input" type="password" placeholder="Password">
    <button id="loginBtn" class="btn">Log in</button>
  </div>

  <!-- SIGNUP -->
  <div id="signupForm" style="display:none;">
    <input id="signupEmail" class="input" type="email" placeholder="Email">
    <input id="signupPass" class="input" type="password" placeholder="Password (min 6 chars)">
    <button id="signupBtn" class="btn">Sign up →</button>
  </div>

  <div id="phoneForm" style="display:none;">
    <div class="phone-row"><input id="phoneCode" class="input phone-code" type="text" value="+91" aria-label="Country calling code"><input id="phoneNumber" class="input" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="Mobile number"></div>
    <div id="recaptcha-container"></div>
    <button id="sendOtpBtn" class="btn">Send OTP</button>
    <div id="otpForm"><input id="phoneOtp" class="input" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit OTP"><button id="verifyOtpBtn" class="btn">Verify OTP & Continue</button></div>
    <div class="foot">SMS verification se mobile number verify hoga.</div>
  </div>

  <button id="phoneToggleBtn" class="btn btn-google" style="margin-top:10px;">Continue with mobile number</button>
  <div class="divider"><div></div>OR<div></div></div>

  <button id="googleBtn" class="btn btn-google">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:18px; height:18px;"> Continue with Google
  </button>

  <div class="foot">Bina login ke Home me entry nahi milegi 🔒<br>Login = Firebase se verified user</div>
</div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const $=id=>document.getElementById(id);
const tabLogin=$("tabLogin"), tabSignup=$("tabSignup");
const loginForm=$("loginForm"), signupForm=$("signupForm"), phoneForm=$("phoneForm");
let recaptchaVerifier = null;
let confirmationResult = null;

function switchTab(t){
  if(t==="login"){ tabLogin.classList.add("active"); tabSignup.classList.remove("active"); loginForm.style.display="block"; signupForm.style.display="none"; }
  else { tabSignup.classList.add("active"); tabLogin.classList.remove("active"); signupForm.style.display="block"; loginForm.style.display="none"; }
  $("errorMsg").textContent="";
}
tabLogin.onclick=()=>switchTab("login");
tabSignup.onclick = () => switchTab("signup");

$("phoneToggleBtn").onclick=()=>{
  const opening=phoneForm.style.display==="none";
  loginForm.style.display="none"; signupForm.style.display="none"; phoneForm.style.display=opening?"block":"none";
  tabLogin.classList.remove("active"); tabSignup.classList.remove("active"); $("errorMsg").textContent="";
  if(opening) setupRecaptcha();
};
function setupRecaptcha(){
  if(recaptchaVerifier) return;
  try {
    recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
      size:"normal",
      callback:()=>{$("errorMsg").textContent="";},
      "expired-callback":()=>showError("reCAPTCHA expire ho gaya. Dobara verify karein.")
    });
    recaptchaVerifier.render().catch(error=>showError("reCAPTCHA: "+error.message));
  } catch(error) { showError("reCAPTCHA setup: "+error.message); }
}


async function saveProfile(user) {
  const userRef = doc(db, "users", user.uid);
  const snapshot = await getDoc(userRef);

  const profile = {
    uid: user.uid,
    name: user.displayName || user.email?.split("@")[0] || "Insta Pro User",
    email: user.email || "",
    avatar: user.photoURL || "",
    updatedAt: serverTimestamp()
  };

  if (!snapshot.exists()) {
    profile.bio = "";
    profile.followers = 0;
    profile.following = 0;
    profile.posts = 0;
    profile.createdAt = serverTimestamp();
  }

  await setDoc(userRef, profile, { merge: true });
}

// LOGIN
$("loginBtn").onclick = async () => {
  const email = $("loginEmail").value.trim();
  const password = $("loginPass").value;

  if (!email || !password) {
    showError("Email aur password bhariye.");
    return;
  }

  try {
    const result = await signInWithEmailAndPassword(auth, email, password);
    await saveProfile(result.user);
    window.location.href = "index.html";
  } catch (error) {
    showError(error.message);
  }
};

// SIGN UP
$("signupBtn").onclick = async () => {
  const email = $("signupEmail").value.trim();
  const password = $("signupPass").value;

  if (!email || !password) {
    showError("Email aur password bhariye.");
    return;
  }

  if (password.length < 6) {
    showError("Password kam se kam 6 characters ka hona chahiye.");
    return;
  }

  try {
    const result = await createUserWithEmailAndPassword(auth, email, password);
    await saveProfile(result.user);
    window.location.href = "index.html";
  } catch (error) {
    showError(error.message);
  }
};

// Google login: popup first, redirect fallback for browsers that block popups.
$("googleBtn").onclick = async () => {
  try {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    $("googleBtn").disabled = true;
    $("googleBtn").textContent = "Opening Google...";
    const result = await signInWithPopup(auth, provider);
    await finishLogin(result.user);
  } catch (error) {
    if (["auth/popup-blocked","auth/popup-closed-by-user","auth/cancelled-popup-request","auth/operation-not-supported-in-this-environment"].includes(error.code)) {
      try { const provider = new GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"}); await signInWithRedirect(auth, provider); return; }
      catch (redirectError) { error = redirectError; }
    }
    $("googleBtn").disabled = false;
    $("googleBtn").textContent = "Continue with Google";
    showError((error.code ? error.code + ": " : "") + error.message);
  }
};
getRedirectResult(auth).then(async result => { if (result?.user) await finishLogin(result.user); }).catch(error => {
  console.error("Google redirect login failed:", error);
  showError((error.code ? error.code + ": " : "") + error.message);
  $("googleBtn").disabled = false; $("googleBtn").textContent = "Continue with Google";
});
async function finishLogin(user) {
  try { await saveProfile(user); } catch (error) { console.error("Profile save failed:", error); }
  window.location.replace("index.html");
}

$("sendOtpBtn").onclick = async () => {
  const code = $("phoneCode").value.trim();
  const number = $("phoneNumber").value.trim().replace(/[\s()-]/g, "");
  const fullPhone = code + number;
  if (!/^\+[1-9]\d{7,14}$/.test(fullPhone)) { showError("Country code ke saath sahi mobile number likhein, jaise +91 9876543210."); return; }
  try {
    $("sendOtpBtn").disabled = true; $("sendOtpBtn").textContent = "Sending OTP...";
    if (!recaptchaVerifier) setupRecaptcha();
    if (!recaptchaVerifier) throw new Error("reCAPTCHA load nahi hua. Page refresh karke dobara try karein.");
    confirmationResult = await signInWithPhoneNumber(auth, fullPhone, recaptchaVerifier);
    $("otpForm").style.display = "block"; $("sendOtpBtn").textContent = "OTP Sent";
    showError("OTP SMS se bhej diya gaya hai.");
  } catch (error) {
    showError((error.code ? error.code + ": " : "") + error.message);
    $("sendOtpBtn").disabled = false; $("sendOtpBtn").textContent = "Send OTP";
    if (recaptchaVerifier) { try { await recaptchaVerifier.render(); } catch (_) {} }
  }
};
$("verifyOtpBtn").onclick = async () => {
  const otp = $("phoneOtp").value.trim();
  if (!confirmationResult) { showError("Pehle Send OTP dabayein."); return; }
  if (!/^\d{6}$/.test(otp)) { showError("6 digit OTP dalein."); return; }
  try {
    $("verifyOtpBtn").disabled = true; $("verifyOtpBtn").textContent = "Verifying...";
    const result = await confirmationResult.confirm(otp);
    await finishLogin(result.user);
  } catch (error) {
    showError((error.code ? error.code + ": " : "") + error.message);
    $("verifyOtpBtn").disabled = false; $("verifyOtpBtn").textContent = "Verify OTP & Continue";
  }
};

// ERROR MESSAGE
function showError(message) {
  $("errorMsg").textContent = message;
}

// EXISTING LOGIN SESSION
onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.replace("index.html");
  }
});
</script>
</body>
</html>
