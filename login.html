<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUBE - Real Login</title>
<script type="importmap">
{ "imports": { "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js", "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js" } }
</script>
<style>
body{background:#000;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.box{background:#111;padding:30px;border-radius:20px;text-align:center;width:90%;max-width:350px;border:1px solid #222}
button{background:#fff;color:#000;border:none;padding:14px 20px;border-radius:30px;font-weight:bold;width:100%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
button img{width:20px}
</style>
</head>
<body>
<div class="box">
<h2>INTUBE 🔥</h2>
<p style="color:#888;margin:10px 0 25px">Real Google Login</p>
<button id="gBtn"><img src="https://www.svgrepo.com/show/475656/google-color.svg"> Login with Google</button>
<p id="msg" style="margin-top:15px;color:#ff004f"></p>
</div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, signInWithPopup, GoogleAuthProvider } from "firebase/auth";

const firebaseConfig = {
  apiKey: "AIzaSyDibgzp64G1QB7Pma-7Zx4yMAV06go8cNU",
  authDomain: "intube-61cca.firebaseapp.com",
  projectId: "intube-61cca",
  storageBucket: "intube-61cca.firebasestorage.app",
  messagingSenderId: "627409965607",
  appId: "1:627409965607:web:a1d71800d812fe668b7402"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

document.getElementById('gBtn').onclick = async () => {
  document.getElementById('msg').innerText = "Google khul raha hai...";
  try {
    const res = await signInWithPopup(auth, provider);
    localStorage.setItem('userName', res.user.displayName);
    localStorage.setItem('userPhoto', res.user.photoURL);
    localStorage.setItem('userEmail', res.user.email);
    document.getElementById('msg').innerText = "Login ho gaya!";
    setTimeout(()=> location.href="index.html", 1000);
  } catch(e){
    document.getElementById('msg').innerText = e.message;
  }
}
</script>
</body>
</html>
