<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTUBE Authentication</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0a0712;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
padding:20px;
}

body::before{
content:"";
position:fixed;
width:400px;
height:400px;
background:#ff4fd8;
filter:blur(180px);
top:-100px;
left:-100px;
opacity:.35;
}

body::after{
content:"";
position:fixed;
width:400px;
height:400px;
background:#7f5cff;
filter:blur(180px);
bottom:-100px;
right:-100px;
opacity:.35;
}

.card{
width:100%;
max-width:420px;
padding:30px;
border-radius:30px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);

border:1px solid rgba(255,255,255,.15);

box-shadow:
0 8px 40px rgba(255,79,216,.18),
inset 0 1px 1px rgba(255,255,255,.18);

color:white;
}

.logo{
text-align:center;
font-size:34px;
font-weight:700;
margin-bottom:10px;
background:linear-gradient(45deg,#ff4fd8,#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
text-align:center;
opacity:.8;
margin-bottom:25px;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.tab{
flex:1;
padding:12px;
border:none;
border-radius:15px;
cursor:pointer;
color:white;
background:rgba(255,255,255,.08);
}

.active{
background:linear-gradient(45deg,#ff4fd8,#7f5cff);
}

input{
width:100%;
padding:15px;
margin-bottom:12px;
border:none;
outline:none;
border-radius:15px;
background:rgba(255,255,255,.08);
color:white;
}

input::placeholder{
color:rgba(255,255,255,.7);
}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:15px;
cursor:pointer;
font-weight:600;
color:white;
margin-top:5px;
}

.primary{
background:linear-gradient(45deg,#ff4fd8,#7f5cff);
}

.google{
background:#4285F4;
margin-top:12px;
}

#status{
margin-top:15px;
font-size:14px;
text-align:center;
word-break:break-word;
}

.hidden{
display:none;
}

</style>
</head>
<body>

<div class="card">

<div class="logo">INTUBE</div>
<div class="subtitle">Watch • Upload • Connect</div>

<div class="tabs">
<button id="loginTab" class="tab active">Login</button>
<button id="signupTab" class="tab">Sign Up</button>
</div>

<div id="signupBox" class="hidden">

<input
type="text"
id="signupUsername"
placeholder="Username">

<input
type="email"
id="signupEmail"
placeholder="Email Address">

<input
type="password"
id="signupPassword"
placeholder="Password">

<button
id="signupBtn"
class="btn primary">
Create Account
</button>

</div>

<div id="loginBox">

<input
type="email"
id="loginEmail"
placeholder="Email Address">

<input
type="password"
id="loginPassword"
placeholder="Password">

<button
id="loginBtn"
class="btn primary">
Login
</button>

</div>

<button
id="googleBtn"
class="btn google">
Continue with Google
</button>

<p id="status"></p>

</div>

<script type="module">

import { auth } from "./firebase-config.js";

import {
GoogleAuthProvider,
signInWithPopup,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
updateProfile
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const loginTab =
document.getElementById("loginTab");

const signupTab =
document.getElementById("signupTab");

const loginBox =
document.getElementById("loginBox");

const signupBox =
document.getElementById("signupBox");

const status =
document.getElementById("status");

/* Tabs */

loginTab.onclick = () => {

loginBox.classList.remove("hidden");
signupBox.classList.add("hidden");

loginTab.classList.add("active");
signupTab.classList.remove("active");

};

signupTab.onclick = () => {

signupBox.classList.remove("hidden");
loginBox.classList.add("hidden");

signupTab.classList.add("active");
loginTab.classList.remove("active");

};

/* Signup */

document
.getElementById("signupBtn")
.onclick = async () => {

const username =
document.getElementById("signupUsername").value;

const email =
document.getElementById("signupEmail").value;

const password =
document.getElementById("signupPassword").value;

try{

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

await updateProfile(
userCredential.user,
{
displayName: username
}
);

status.innerHTML =
"✅ Account Created Successfully";

setTimeout(()=>{
window.location.href="index.html";
},1000);

}catch(err){

status.innerHTML =
"❌ " + err.message;

}

};

/* Login */

document
.getElementById("loginBtn")
.onclick = async () => {

const email =
document.getElementById("loginEmail").value;

const password =
document.getElementById("loginPassword").value;

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

status.innerHTML =
"✅ Login Success";

setTimeout(()=>{
window.location.href="index.html";
},1000);

}catch(err){

status.innerHTML =
"❌ " + err.message;

}

};

/* Google Login */

document
.getElementById("googleBtn")
.onclick = async () => {

try{

const provider =
new GoogleAuthProvider();

await signInWithPopup(
auth,
provider
);

status.innerHTML =
"✅ Google Login Success";

setTimeout(()=>{
window.location.href="index.html";
},1000);

}catch(err){

status.innerHTML =
"❌ " + err.message;

}

};

</script>

</body>
</html>
