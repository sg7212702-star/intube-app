<!placeholder="Email Address<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background: #120b20; color: #fff; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: #251b37; padding: 30px; border-radius: 20px; width: 320px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .auth-card h2 { margin-bottom: 10px; font-size: 22px; }
        .auth-card p { color: #b0a8c2; font-size: 13px; margin-bottom: 25px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; margin-bottom: 10px; }
        .google-btn { background: #ffffff; color: #120b20; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .logout-btn { background: #ff4757; color: #fff; display: none; }
        .back-link { display: block; margin-top: 15px; color: #c084fc; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 id="title">Account</h2>
        <p id="subtitle">Apne Google account se login karein</p>
        
        <button id="googleLoginBtn" class="btn google-btn">Sign in with Google</button>
        <button id="logoutBtn" class="btn logout-btn">Logout</button>
        
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script type="module">
        import { auth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "./firebase-config.js";

        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');

        googleLoginBtn.onclick = async () => {
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                alert("Successfully logged in!");
                window.location.href = "index.html";
            } catch (error) {
                alert("Login Error: " + error.message);
            }
        };

        logoutBtn.onclick = async () => {
            await signOut(auth);
            alert("Logged out successfully!");
            window.location.reload();
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                title.innerText = user.displayName;
                subtitle.innerText = user.email;
                googleLoginBtn.style.display = "none";
                logoutBtn.style.display = "block";
            } else {
                title.innerText = "Account";
                subtitle.innerText = "Apne Google account se login karein";
                googleLoginBtn.style.display = "flex";
                logoutBtn.style.display = "none";
            }
        });
    </script>
</body>
</html>
