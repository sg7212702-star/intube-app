<!DOCTYPE html>
<html>
<head>
<title>INTUBE Login</title>
</head>
<body>

<h2>Google Login</h2>

<button id="loginBtn">
Google Sign In
</button>

<script type="module">

import {
auth,
GoogleAuthProvider,
signInWithPopup
}
from "./firebase-config.js";

const provider = new GoogleAuthProvider();

document.getElementById("loginBtn").onclick = async () => {

try {

const result = await signInWithPopup(
auth,
provider
);

alert(
"Welcome " +
result.user.displayName
);

location.href="index.html";

}
catch(err){
alert(err.message);
}

};

</script>

</body>
</html>
