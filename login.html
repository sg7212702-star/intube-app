<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.glass{width:92%;max-width:360px;background:rgba(255,255,255,.12);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:28px}
input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.4);color:#fff;box-sizing:border-box}
button{width:100%;padding:14px;border-radius:12px;border:0;background:#fff;color:#000;font-weight:700;margin-top:12px;cursor:pointer}
</style></head><body>
<div class="glass"><h2 style="text-align:center">InstaPro</h2>
<div id="regBox"><input id="regName" placeholder="Full Name"><input id="regEmail" placeholder="Email"><input id="regPass" type="password" placeholder="Password"><button onclick="registerUser()">Create Account - 0 to Start</button><p style="text-align:center;opacity:.6;font-size:13px;margin-top:10px" onclick="showLogin()">Already have account? Login</p></div>
<div id="logBox" style="display:none"><input id="logEmail" placeholder="Email"><input id="logPass" type="password" placeholder="Password"><button onclick="loginUser()">Login</button><p style="text-align:center;opacity:.6;font-size:13px;margin-top:10px" onclick="showReg()">Create new account</p></div>
</div><script>function showLogin(){regBox.style.display='none';logBox.style.display='block'}function showReg(){logBox.style.display='none';regBox.style.display='block'}</script><script type="module" src="auth.js"></script></body></html>
