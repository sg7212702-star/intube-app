<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #120b20; color: #fff; padding-bottom: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { background: #251b37; padding: 30px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); }
        .auth-card h2 { margin-bottom: 6px; font-size: 20px; color: #fff; }
        .auth-card p { color: #b0a8c2; font-size: 12px; margin-bottom: 20px; word-break: break-all; }
        .avatar { width: 75px; height: 75px; border-radius: 50%; background: #c084fc; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600; color: #120b20; overflow: hidden; border: 2px solid #c084fc; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; margin-bottom: 10px; transition: 0.2s; }
        .google-btn { background: #ffffff; color: #120b20; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .google-btn:hover { background: #f0f0f0; }
        .logout-btn { background: #ff4757; color: #fff; display: none; }
        .logout-btn:hover { background: #ff334b; }
        /* Bottom Navigation Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(30, 20, 48, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; height: 70px; border-top: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000; }
        .nav-item { text-align: center; color: #9c92b5; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .nav-item.active { color: #ffffff; }
        .fab-btn { width: 52px; height: 52px; background: linear-gradient(135deg, #c084fc, #818cf8); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; box-shadow: 0 4px 15px rgba(192, 132, 252, 0.5); margin-top: -18px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="avatar" id="userAvatar">👤</div>
        <h2 id="title">Account</h2>
        <p id="subtitle">Apne Google account se login karein</p>
        
        <button id="googleLoginBtn" class="btn google-btn">Sign in with Google</button>
        <button id="logoutBtn" class="btn logout-btn">Logout</button>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span>🏠</span> Home</a>
        <a href="feed.html" class="nav-item"><span>🎞️</span> Feed</a>
        <a href="upload.html" class="fab-btn">+</a>
        <a href="explore.html" class="nav-item"><span>📺</span> Explore</a>
        <a href="login.html" class="nav-item active"><span>👤</span> Profile</a>
    </nav>

    <script type="module">
        import { auth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "./firebase-config.js";

        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');
        const userAvatar = document.getElementById('userAvatar');

        googleLoginBtn.onclick = async () => {
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                alert("Successfully logged in!");
                window.location.reload();
            } catch (error) {
                alert("Login Error: " + error.message);
            }
        };

        logoutBtn.onclick = async () => {
            try {
                await signOut(auth);
                alert("Logged out successfully!");
                window.location.reload();
            } catch (error) {
                alert("Logout Error: " + error.message);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                title.innerText = user.displayName || "User";
                subtitle.innerText = user.email || "";
                if(user.photoURL) {
                    userAvatar.innerHTML = `<img src="${user.photoURL}" alt="Profile">`;
                } else {
                    userAvatar.innerText = user.displayName ? user.displayName[0].toUpperCase() : "U";
                }
                googleLoginBtn.style.display = "none";
                logoutBtn.style.display = "block";
            } else {
                title.innerText = "Account";
                subtitle.innerText = "Apne Google account se login karein";
                userAvatar.innerHTML = "👤";
                googleLoginBtn.style.display = "flex";
                logoutBtn.style.display = "none";
            }
        });
    </script>
</body>
</html>
