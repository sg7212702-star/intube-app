<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Story</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;overflow:hidden}
#close{position:fixed;top:16px;right:16px;font-size:32px;color:#fff;z-index:20;cursor:pointer}
.progress{position:fixed;top:6px;left:6px;right:6px;height:3px;background:rgba(255,255,255,0.3);border-radius:10px;overflow:hidden;z-index:20}
.progress div{height:100%;background:#fff;width:0%}
</style>
</head>
<body>
<div id="close" onclick="history.back()">✕</div>
<div class="progress"><div id="bar"></div></div>
<div id="content" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"></div>
<script>
const openStory = localStorage.getItem('openStory');
const allStories = JSON.parse(localStorage.getItem('myStories') || '[]');
const story = openStory? JSON.parse(openStory) : allStories.slice(-1)[0];
const content = document.getElementById('content');
const bar = document.getElementById('bar');

if(!story){
  content.innerHTML='<p style="color:#fff">No Story</p>';
} else {
  if(story.type==='video'){
    content.innerHTML=`<video src="${story.url}" autoplay playsinline style="width:100%;height:100%;object-fit:contain"></video>`;
  } else {
    content.innerHTML=`<img src="${story.url}" style="width:100%;height:100%;object-fit:contain">`;
  }
  setTimeout(()=>{ bar.style.transition='width 5s linear'; bar.style.width='100%'; },100);
  setTimeout(()=>{ history.back(); },5200);
}
</script>
</body>
</html>
