<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;height:100vh;width:100vw;display:flex;align-items:center;justify-content:center}
#close{position:fixed;top:16px;right:16px;font-size:30px;color:#fff;z-index:10}
.progress{position:fixed;top:4px;left:4px;right:4px;height:3px;background:rgba(255,255,255,0.3);border-radius:10px;overflow:hidden}
.progress div{height:100%;background:#fff;width:0%;transition:width 5s linear}
</style>
</head>
<body>
<div id="close" onclick="history.back()">✕</div>
<div class="progress"><div id="bar"></div></div>
<div id="content" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"></div>
<script>
const story = JSON.parse(localStorage.getItem('openStory') || localStorage.getItem('myStories') && JSON.parse(localStorage.getItem('myStories')).slice(-1)[0] && JSON.stringify(JSON.parse(localStorage.getItem('myStories')).slice(-1)[0]) || 'null');
const content = document.getElementById('content');
const bar = document.getElementById('bar');
if(!story){ content.innerHTML='<p style=color:#fff>No Story</p>'; }
else {
  if(story.type==='video'){
    content.innerHTML=`<video src="${story.url}" autoplay playsinline style="width:100%;height:100%;object-fit:contain"></video>`;
  } else {
    content.innerHTML=`<img src="${story.url}" style="width:100%;height:100%;object-fit:contain">`;
  }
  setTimeout(()=>bar.style.width='100%',50);
  setTimeout(()=>history.back(),5200);
}
</script>
</body>
</html>
