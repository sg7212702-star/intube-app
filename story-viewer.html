<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INTUBE Story Viewer</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{
background:#000;
height:100vh;
overflow:hidden;
}

.story{
width:100%;
height:100vh;
position:relative;
}

.story img,
.story video{
width:100%;
height:100%;
object-fit:cover;
}

.top{
position:absolute;
top:0;
left:0;
right:0;
padding:15px;
z-index:10;
}

.progress{
height:4px;
background:rgba(255,255,255,.25);
border-radius:20px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:#fff;
animation:load 8s linear forwards;
}

@keyframes load{
from{width:0%}
to{width:100%}
}

.close{
position:absolute;
top:25px;
right:20px;
font-size:30px;
color:#fff;
cursor:pointer;
z-index:20;
}

.user{
position:absolute;
top:35px;
left:20px;
display:flex;
align-items:center;
gap:10px;
color:#fff;
z-index:20;
}

.user img{
width:40px;
height:40px;
border-radius:50%;
border:2px solid #ff4da6;
}

.nav{
position:absolute;
top:0;
bottom:0;
width:50%;
z-index:15;
}

.left{
left:0;
}

.right{
right:0;
}

</style>
</head>
<body>

<div class="story">

<div class="top">
<div class="progress">
<div class="bar"></div>
</div>
</div>

<div class="close" onclick="history.back()">✕</div>

<div class="user">
<img src="https://picsum.photos/100">
<span>INTUBE User</span>
</div>

<img src="https://picsum.photos/1080/1920">

<div class="nav left"></div>
<div class="nav right"></div>

</div>

</body>
</html>
