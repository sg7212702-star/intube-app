name: Build InstaPro Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
      - '**.html'
      - '**.js'
      - '**.css'
      - 'assets/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install packaging tools
        run: npm install

      - name: Bundle native Google sign-in bridge
        run: npm run bundle:native-auth

      - name: Prepare web assets
        run: |
          mkdir -p www
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' --exclude='www' --exclude='package.json' --exclude='package-lock.json' --exclude='capacitor.config.json' ./ www/

      - name: Add Android project
        run: npx cap add android

      - name: Configure Firebase Android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Missing GOOGLE_SERVICES_JSON_BASE64 repository secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          node -e "const fs=require('fs'); const p='android/build.gradle'; let s=fs.readFileSync(p,'utf8'); if(!s.includes('com.google.gms:google-services')) { s=s.replace(/dependencies\\s*\\{/, 'dependencies {\\n        classpath \'com.google.gms:google-services:4.4.2\''); fs.writeFileSync(p,s); }"
          node -e "const fs=require('fs'); const p='android/app/build.gradle'; let s=fs.readFileSync(p,'utf8'); if(!s.includes('com.google.gms.google-services')) { s += '\\napply plugin: \'com.google.gms.google-services\'\\n'; fs.writeFileSync(p,s); }"
          node -e "const fs=require('fs'); const p='android/variables.gradle'; if(fs.existsSync(p)){let s=fs.readFileSync(p,'utf8'); if(!s.includes('rgcfaIncludeGoogle')) {s += '\\next.rgcfaIncludeGoogle = true\\n'; fs.writeFileSync(p,s);} }"


      - name: Configure stable Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 repository secret. Add the stable keystore secret before building."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/instapro-debug.keystore
          node <<'NODE'
          const fs = require('fs');
          const p = 'android/app/build.gradle';
          let s = fs.readFileSync(p, 'utf8');
          if (!s.includes('instaproStableDebug')) {
            s += `\n\nandroid {\n    signingConfigs {\n        instaproStableDebug {\n            storeFile file('instapro-debug.keystore')\n            storePassword 'android'\n            keyAlias 'instaprodebug'\n            keyPassword 'android'\n        }\n    }\n    buildTypes {\n        debug {\n            signingConfig signingConfigs.instaproStableDebug\n        }\n    }\n}\n`;
            fs.writeFileSync(p, s);
          }
          NODE

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
