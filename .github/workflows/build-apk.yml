name: Build InstaPro Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
      - '**.html'
      - '**.js'
      - '**.css'
      - 'assets/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install packaging tools
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' --exclude='www' --exclude='package.json' --exclude='package-lock.json' --exclude='capacitor.config.json' ./ www/

      - name: Add Android project
        run: npx cap add android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
